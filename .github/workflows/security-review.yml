name: Security Review

# Anthropic's official AI security reviewer (anthropics/claude-code-security-review).
# Runs Claude over the PR diff and comments any security findings inline. It is
# diff-aware (only changed files), language-agnostic, and applies false-positive
# filtering.
#
# OPT-IN, NOT AUTOMATIC (2026-08). Apply the `security-review` label to a PR to
# run it; `workflow_dispatch` re-runs one by hand. Nothing else starts it, so a
# PR nobody labels costs nothing. To re-scan after pushing a fix, remove the
# label and re-apply it — `labeled` fires on each application.
#
# THE TRADE, STATED PLAINLY: this is the only thing in the repo that looks for
# security findings — required CI covers secrets hygiene and rules text, not
# vulnerabilities in application logic. Opt-in means it runs when someone
# remembers, which on most PRs will be never. That is a deliberate cost choice,
# not an oversight; label anything touching auth, rules, payments, user input,
# or a new external surface.
#
# Uses the dedicated ANTHROPIC_AGENTS_KEY Actions secret shared by the
# GitHub-agent workflows (agent-bug-fixer.yml / agent-release-notes.yml),
# so Console spend separates agent/Opus from the app
# runtime. Falls back to ANTHROPIC_API_KEY when unset, so this is safe to run
# before the dedicated key is provisioned. The key must be enabled for both the
# Claude API and Claude Code usage.
#
# SECURITY NOTE: this action is not hardened against prompt injection, so it
# should only review trusted PRs. `main` is branch-protected and merges are
# self-served by a maintainer, but if external contributors are ever enabled,
# turn on "Require approval for all external contributors" in
# Settings → Actions so the workflow only runs after maintainer review.

on:
  pull_request:
    branches: [main]
    # `labeled` ONLY — not [opened, synchronize, reopened]. `synchronize` fires
    # on every push to a PR branch, so each CI-failure fixup commit bought
    # another full agentic re-scan of the whole diff; on a 24-merge day that is
    # where the Anthropic bill went, not in the app runtime. Scanning at
    # `opened` was cheaper but still paid for every PR whether or not the diff
    # could carry a vulnerability.
    types: [labeled]
  workflow_dispatch:

permissions:
  pull-requests: write   # leave PR comments with findings
  contents: read

concurrency:
  group: security-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # A `labeled` run fires for EVERY label, so the job must check which one it
    # was; without this, adding any unrelated label would start an agentic scan.
    # `workflow_dispatch` carries no label payload, hence the explicit branch.
    #
    # There is deliberately no draft gate. Labelling is an explicit request, so
    # a labelled draft is someone asking for exactly this scan on exactly this
    # diff — the earlier draft==false rule existed to stop the automatic
    # `opened` run from scanning an unfinished PR, and nothing is automatic now.
    #
    # The old Dependabot skip is gone with the same reasoning: it existed
    # because every dependency bump auto-started a run that then failed on a
    # withheld secret. Dependabot does not apply labels, so it can no longer
    # start this workflow at all.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'security-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      # Pinning to @main tracks upstream. For stricter supply-chain hygiene,
      # replace @main with a specific commit SHA and bump it deliberately.
      - uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_AGENTS_KEY || secrets.ANTHROPIC_API_KEY }}
          # Pin the model: the action otherwise defaults to Opus, which on a
          # per-PR agentic scan dominated the API bill (≈2M Opus tokens during
          # the June PR burst). Haiku 4.5 is ~15x cheaper per token and is
          # ample for diff-scoped security findings.
          claude-model: claude-haiku-4-5-20251001
          comment-pr: true
          # android/ is generated Capacitor native output; not worth scanning.
          exclude-directories: android,dist
