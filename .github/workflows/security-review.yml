name: Security Review

# Anthropic's official AI security reviewer (anthropics/claude-code-security-review).
# Runs Claude over the PR diff and comments any security findings inline. It is
# diff-aware (only changed files), language-agnostic, and applies false-positive
# filtering. This is the ONLY automatic per-PR review left: Rex's general
# review (agent-pr-review.yml) was deleted in 2026-08 because required CI
# already covers his checks deterministically, whereas nothing else in the
# repo looks for security findings.
#
# Uses the dedicated ANTHROPIC_AGENTS_KEY Actions secret shared by the
# GitHub-agent workflows (agent-bug-fixer.yml / agent-release-notes.yml),
# so Console spend separates agent/Opus from the app
# runtime. Falls back to ANTHROPIC_API_KEY when unset, so this is safe to run
# before the dedicated key is provisioned. The key must be enabled for both the
# Claude API and Claude Code usage.
#
# SECURITY NOTE: this action is not hardened against prompt injection, so it
# should only review trusted PRs. `main` is branch-protected and merges are
# self-served by a maintainer, but if external contributors are ever enabled,
# turn on "Require approval for all external contributors" in
# Settings → Actions so the workflow only runs after maintainer review.

on:
  pull_request:
    branches: [main]
    # NOT the default [opened, synchronize, reopened]. `synchronize` fires on
    # every push to a PR branch, so each CI-failure fixup commit bought another
    # full agentic re-scan of the whole diff — on a 24-merge day that is where
    # the Anthropic bill went, not in the app runtime. Scanning once, when the
    # PR is actually ready, reviews the same final diff for a fraction of the
    # spend. Re-run a specific PR by hand with workflow_dispatch.
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  pull-requests: write   # leave PR comments with findings
  contents: read

concurrency:
  group: security-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # Skip Dependabot PRs: GitHub withholds repo/Actions secrets from
    # dependabot-authored pull_request runs, so claude-api-key resolves empty
    # and the reviewer action fails on every dependency bump. Skipping renders
    # the check "skipped" (non-failing) instead of a spurious red X. Dependency
    # bumps carry no application diff for a security scan to reason about.
    #
    # Skip drafts: PRs here are opened as drafts and iterated on, so scanning at
    # `opened` would scan a diff that is not finished yet and then scan again at
    # `ready_for_review`. Gating on draft==false leaves exactly one scan per PR,
    # of the diff that is actually up for merge. A dispatch run has no
    # pull_request payload, so `draft` is null and the check still passes.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      # Pinning to @main tracks upstream. For stricter supply-chain hygiene,
      # replace @main with a specific commit SHA and bump it deliberately.
      - uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_AGENTS_KEY || secrets.ANTHROPIC_API_KEY }}
          # Pin the model: the action otherwise defaults to Opus, which on a
          # per-PR agentic scan dominated the API bill (≈2M Opus tokens during
          # the June PR burst). Haiku 4.5 is ~15x cheaper per token and is
          # ample for diff-scoped security findings.
          claude-model: claude-haiku-4-5-20251001
          comment-pr: true
          # android/ is generated Capacitor native output; not worth scanning.
          exclude-directories: android,dist
