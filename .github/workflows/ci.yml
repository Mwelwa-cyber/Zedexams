name: CI

# Runs lint + the existing unit test suite on every pull request. This is the
# PRE-MERGE gate. Deploy workflows (deploy-hosting.yml, deploy-firebase.yml)
# re-run lint + test:all before they ship — they are the POST-MERGE
# belt-and-braces, so there is no need to run this whole 7-job matrix AGAIN on
# push to main.
#
# Why no `push: [main]` trigger: every job here already ran (and was required
# to pass) on the PR. Firing all 7 jobs a second time on the merge commit
# duplicated that work and — because GitHub-hosted runners are a shared, capped
# pool — forced the deploy-hosting / deploy-firebase jobs to queue BEHIND this
# matrix for a runner. That runner-queue wait, not the ~3-min pipeline itself,
# was the bulk of the "deploys are slow" delay (a merge could sit ~10 min
# waiting for a free runner). Dropping the redundant push-to-main run frees
# those slots so the deploy job picks up a runner immediately. Trigger a manual
# re-run with workflow_dispatch if you ever need the full matrix against main.
#
# Make these two jobs required status checks on `main` in
# Settings → Branches → Branch protection rules to actually block
# merges on failure.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# puppeteer (a devDependency, used only by `npm run prerender` in the hosting
# deploy) downloads a ~150 MB Chromium in its postinstall. None of the jobs
# here prerender, so skip that download to keep `npm ci` fast. The deploy
# workflow deliberately does NOT set this, so it gets the browser it needs.
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  tests:
    name: Tests (importer + sanitize + schema)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. scripts/test-release-notes-core.mjs asks git whether
          # the trunk still squash-merges, and a depth-1 clone answers no
          # merges no matter what — so the guard passed here while
          # deploy-hosting.yml, which already checks out with fetch-depth 0,
          # failed on every push. Same checkout depth, same answer.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm run test:all

  functions-coverage:
    # Backend (functions/) coverage report. The plain-node backend tests are
    # root-install-safe (they never require firebase-admin/firebase-functions
    # at load time), so this needs only `npm ci` at the root — no functions/
    # install and no emulator, same as the `tests` job. c8 (`.c8rc.json`,
    # `all: true`) instruments EVERY functions/ source file, so the number
    # reflects the true backend gap — including the untested onCall/onRequest
    # handlers in index.js. Thresholds in .c8rc.json are a ratchet: raise them
    # as coverage improves so the backend number can only go up.
    name: Tests (Functions coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Functions coverage
        run: npm run functions:coverage

  src-node-coverage:
    # src/ coverage from the plain-node suite (`.c8rc.src.json`, c8 wrapping
    # scripts/run-src-node-tests.mjs). The third coverage surface: Vitest sees
    # only the *.spec.* files, so src logic tested by the ~330 node scripts
    # (exporters, parsers, schemas — e.g. assessmentToDocx via
    # test:paper-golden) read 0% there. This job measures that slice and
    # ratchets it via the thresholds in .c8rc.src.json. Deliberately NOT a
    # required check (the nine required checks are fixed — see repo docs); it
    # still fails the run when coverage drops below the ratchet.
    name: Tests (src node coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Same reason as the tests job above, and the reason that guard now
          # FAILS instead of skipping: this job runs the plain-node suite too
          # (scripts/run-src-node-tests.mjs under c8), which includes the
          # merge-commit guard in scripts/test-release-notes-core.mjs. The guard
          # inspects origin/$GITHUB_BASE_REF, and a depth-1 clone does not
          # fetch it — so every job that runs the suite needs the same history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: src node coverage
        run: npm run src:coverage

  unit-shards:
    # Vitest (jsdom) component/hook/behaviour specs — the `*.spec.{js,jsx}`
    # files under src/ — SHARDED three ways. This is the only job that
    # saturates every core (~15m of CPU across ~417 spec files), so it is the
    # one whose wall time tracks the runner's core count: 5m16s while the
    # repository was public (4-vCPU standard runners), ~13m40s once it became
    # private (2-vCPU standard runners) — measured 2026-08-19, and the whole
    # reason the run's critical path doubled. Sharding buys the cores back by
    # renting three runners at once: each shard runs a third of the spec files
    # and the `unit` gate below merges the results.
    #
    # The repository went PUBLIC again on 2026-08-19 (4-vCPU runners, unmetered
    # minutes) and this stays sharded anyway, which is a reversal of what this
    # comment said when it landed — so here is the arithmetic. Single job on
    # 4-vCPU: ~5m20s of suite + ~40s setup ≈ 6m. Sharded on 4-vCPU: ~2m of
    # suite + ~40s setup per shard, then the gate (~1m, serialized after) ≈
    # 4m20s. Still the faster shape, and the ~+6 billable minutes it costs
    # stopped mattering the moment minutes became free. What WOULD justify
    # collapsing it back: the gate's merge step becoming a maintenance problem,
    # or the suite shrinking enough that per-shard setup dominates. Neither is
    # true today. Do not add a fourth shard without re-measuring — setup cost
    # per shard is fixed and eats the gain quickly.
    #
    # Mechanics, verified against vitest 4.1.10 before this landed:
    #   • `--reporter=blob` writes the shard's test results AND raw coverage
    #     to .vitest-reports/blob-N-3.json; `--merge-reports` in the gate
    #     reassembles them (merged totals match a single unsharded run).
    #   • Thresholds are zeroed PER SHARD because each shard sees ~a third of
    #     the suite, so the config's ratchet (30/28/26/24.5) would fail every
    #     shard on partial coverage. The gate's merge step re-applies the
    #     config thresholds against the MERGED totals — the ratchet still
    #     gates exactly as before, just in the one place that sees the whole
    #     picture. Do not zero thresholds anywhere else.
    name: Vitest (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      # One flaky shard must not cancel the other two: a cancelled shard has
      # no blob, which turns a real test failure into a confusing artifact
      # error in the gate. Let all three finish and report honestly.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Bounds a HANG; it is not a performance budget (a shard honestly runs
    # ~5–6 min on the 2-vCPU runner). Do not tune it down to "just above" the
    # current number — that turns every slow runner into a red required check
    # on an unrelated PR.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Vitest (shard)
        # `--reporter=default` rides along so a failing spec prints in THIS
        # job's log — blob alone records silently and the failure would only
        # surface as the gate's "a shard failed", one click away from why.
        run: >
          npx vitest run --coverage --reporter=blob --reporter=default
          --shard=${{ matrix.shard }}/3
          --coverage.thresholds.lines=0
          --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0
      - name: Upload shard report
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          retention-days: 1
          if-no-files-found: error
          # upload-artifact v4+ EXCLUDES dot-prefixed paths by default (the
          # post-CVE guard against globbing .env/.git into an artifact), and
          # `.vitest-reports` is vitest's fixed blob directory — without this
          # the shard's own log says "blob report written" and the upload
          # still finds nothing. The path above names exactly one directory,
          # so the broad-glob risk the default protects against does not
          # apply here.
          include-hidden-files: true

  unit:
    # The gate that carries the REQUIRED check name. Branch protection knows
    # this job as "Tests (Vitest unit + coverage)"; the shards above are
    # deliberately NOT required (a matrix job name is per-shard, and requiring
    # three names re-litigates the fixed-nine-checks decision). Same pattern
    # as the Visual regression gate: `if: always()` so it reports under a
    # stable name on every PR — a required job that can be skipped is a wedged
    # repo, and a skip is absence of evidence, which fails.
    #
    # It fails when any shard failed, when a blob is missing (three shards in,
    # three blobs out — a merge over two blobs would report two-thirds of the
    # suite as if it were the whole), and when the MERGED coverage falls below
    # the ratchet in vitest.config.js, which is enforced here and only here.
    name: Tests (Vitest unit + coverage)
    runs-on: ubuntu-latest
    needs: unit-shards
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
      # download-artifact reads this run's artifacts. On a public repository
      # an unstated grant was survivable; privately the same call is a 403 —
      # see test:workflow-api-permissions and the deploy-hosting incident.
      actions: read
    steps:
      # Before spending an npm ci: if a shard failed or was cancelled, this
      # run's verdict is already known.
      - name: Require every shard green
        if: ${{ needs.unit-shards.result != 'success' }}
        run: |
          echo "unit-shards result: ${{ needs.unit-shards.result }} — a Vitest shard failed or did not run."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Require every shard report present
        run: |
          count=$(ls .vitest-reports/blob-*.json 2>/dev/null | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "expected 3 shard blobs in .vitest-reports/, found $count:"
            ls -la .vitest-reports/ || true
            exit 1
          fi
      - name: Merge shard reports + enforce coverage ratchet
        run: npx vitest run --merge-reports --coverage

  build:
    # Clean build gate (release-safety layer). The pre-merge guarantee that the
    # Vite frontend actually compiles AND the core public routes render on a
    # phone — caught here before merge, not post-merge in deploy-hosting.yml.
    #
    #   • Build: `vite build --mode smoke` runs the full production build
    #     pipeline with the FAKE public Firebase config in .env.smoke (web
    #     config is non-secret; it ships in every browser bundle). No repo
    #     secrets are needed, so this gate runs on forked-PR builds too.
    #   • Mobile smoke: boots the build in a phone-sized headless Chromium and
    #     asserts /, /login, /register, /papers, /pricing each paint real
    #     content with no crash card, uncaught error, or horizontal overflow.
    #
    # Make this a required status check on `main` branch protection to block a
    # merge that breaks the build or a public route.
    name: Build + mobile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Override the workflow-level skip: this job is the one that DOES need the
    # puppeteer Chromium (the smoke drives a real browser).
    env:
      PUPPETEER_SKIP_DOWNLOAD: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build (smoke mode — fake public Firebase config)
        run: npm run smoke:build
      # Needs the build above, which is why it lives here and not in test:all
      # (plain node, no dist/). It walks the emitted chunks' STATIC import graph
      # and fails if a page declared light reaches a heavy vendor — the
      # regression #2172 measured by hand and, one hop deeper, missed.
      - name: Bundle edges (light pages stay free of heavy vendors)
        run: npm run check:bundle-edges
      - name: Mobile smoke (public routes)
        run: npm run smoke:mobile
      - name: Dashboard responsive navigation (viewport matrix)
        run: npm run smoke:dashboard
      # Learner Home's Explore row: three tiles, one horizontal row, at every
      # width. Needs a real Chromium (it measures computed grid tracks and
      # font metrics), which is why it lives here and not in the Tests job.
      - name: Learner Explore row (three-up at every width)
        run: npm run smoke:explore
      # WCAG AA in the two dark themes: live-walks the public routes under a
      # saved Midnight theme (also proving navigation keeps the saved theme)
      # and renders each gated teacher/settings route's risk surfaces against
      # the built CSS under Night. Fails on any text pair below AA.
      - name: Route contrast (Night + Midnight, WCAG AA)
        run: npm run contrast:routes

  rules-emulator:
    # Behavioural Firestore-rules tests. Kept as a separate job because
    # they need the Firestore emulator (JVM) — that's why they can't sit
    # inside `test:all`, which is plain `node` scripts.
    name: Tests (Firestore rules emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Firestore rules tests
        run: npm run test:rules-emulator
      - name: School-membership RBAC rules tests
        # Multi-school access-control model (schools/{id}/members/{uid}):
        # membership is tamper-proof, cross-school isolation holds, and the
        # platformAdmin custom claim folds into isAdmin(). See
        # scripts/test-school-membership-rules-emulator.mjs.
        run: npm run test:school-membership-rules
      - name: Quiz-editor save replay (full real payloads vs rules)
        # Replays the editor's exact autosave payloads (built by the real
        # importer + serializer + normalizeQuestionPayload) through the rules.
        # Guards the expression-budget cliff that broke every scanned
        # past-paper import — see scripts/test-quiz-autosave-rules-emulator.mjs.
        run: npm run test:quiz-autosave-rules
      - name: Library smart-folder rules + index coverage
        # Runs every query the library's builders can emit against the real
        # emulator. A missing composite index is a FAILED_PRECONDITION in a
        # teacher's browser, not a deploy failure, so it has to be executed
        # here — see scripts/test-library-rules-emulator.mjs.
        run: npm run test:library-rules-emulator

  dependency-audit:
    # Dependency vulnerability gate (CICD-002). Audits only PRODUCTION
    # dependencies (`--omit=dev`) of the two deployed trees — the root Vite
    # bundle and functions/ — because dev-only tooling vulns never ship to a
    # user. `npm audit` reads the committed lockfile against the advisory DB
    # (no install needed), so this is fast.
    #
    # Threshold policy:
    #   • BLOCKING at `critical` — a newly introduced critical prod dep fails
    #     the merge (the P1-5 acceptance criterion). Both trees are clean at
    #     this level today.
    #   • REPORTING at `high` — highs are surfaced in the log (never blocking)
    #     so a freshly disclosed transitive high can't red-wall every unrelated
    #     PR while Dependabot's bump PR is in flight; the fix lands through
    #     Dependabot (.github/dependabot.yml), not by wedging the queue.
    name: Dependency audit (prod deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Audit root production dependencies (block on critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: Report root high-severity advisories (non-blocking)
        if: ${{ always() }}
        run: npm audit --omit=dev --audit-level=high || echo "::warning::root has high-severity prod advisories — see Dependabot PRs"
      - name: Audit functions production dependencies (block on critical)
        working-directory: functions
        run: npm audit --omit=dev --audit-level=critical
      - name: Report functions high-severity advisories (non-blocking)
        if: ${{ always() }}
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high || echo "::warning::functions has high-severity prod advisories — see Dependabot PRs"

  storage-rules-emulator:
    # Behavioural Storage-rules tests. Like the Firestore job above, these
    # need the emulator (JVM) so they can't sit inside `test:all`. The suite
    # existed but ran nowhere in CI until now — this wires it up so the
    # per-path ownership / content-type / cross-tenant guards actually gate
    # merges. It boots BOTH firestore + storage emulators because
    # storage.rules reads the caller's role from users/{uid} in Firestore.
    name: Tests (Storage rules emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Storage rules tests
        run: npm run test:storage-rules-emulator

  payment-lifecycle-emulator:
    # End-to-end payment lifecycle against the Firestore + Storage emulators.
    # Drives the REAL subscriptionActivation.js + lencoWebhookProcessor.js
    # transactions with the mock provider adapter standing in for the Lenco
    # sandbox — the emulator half of the payment-lifecycle launch blocker.
    # Unlike the rules-emulator jobs (client SDK only) this one requires
    # firebase-admin, a functions/ dependency, so it installs functions/ deps
    # too; it needs the JVM for the emulator. Storage emulator is booted so the
    # best-effort invoice-PDF side effect exercises end-to-end instead of
    # failing on a missing bucket.
    name: Tests (Payment lifecycle emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Payment lifecycle tests
        run: npm run test:payment-lifecycle-emulator
