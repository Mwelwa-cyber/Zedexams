name: CI

# Runs lint + the existing unit test suite on every pull request. This is the
# PRE-MERGE gate. Deploy workflows (deploy-hosting.yml, deploy-firebase.yml)
# re-run lint + test:all before they ship — they are the POST-MERGE
# belt-and-braces, so there is no need to run this whole 7-job matrix AGAIN on
# push to main.
#
# Why no `push: [main]` trigger: every job here already ran (and was required
# to pass) on the PR. Firing all 7 jobs a second time on the merge commit
# duplicated that work and — because GitHub-hosted runners are a shared, capped
# pool — forced the deploy-hosting / deploy-firebase jobs to queue BEHIND this
# matrix for a runner. That runner-queue wait, not the ~3-min pipeline itself,
# was the bulk of the "deploys are slow" delay (a merge could sit ~10 min
# waiting for a free runner). Dropping the redundant push-to-main run frees
# those slots so the deploy job picks up a runner immediately. Trigger a manual
# re-run with workflow_dispatch if you ever need the full matrix against main.
#
# Make these two jobs required status checks on `main` in
# Settings → Branches → Branch protection rules to actually block
# merges on failure.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# puppeteer (a devDependency, used only by `npm run prerender` in the hosting
# deploy) downloads a ~150 MB Chromium in its postinstall. None of the jobs
# here prerender, so skip that download to keep `npm ci` fast. The deploy
# workflow deliberately does NOT set this, so it gets the browser it needs.
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  tests:
    name: Tests (importer + sanitize + schema)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm run test:all

  functions-coverage:
    # Backend (functions/) coverage report. The plain-node backend tests are
    # root-install-safe (they never require firebase-admin/firebase-functions
    # at load time), so this needs only `npm ci` at the root — no functions/
    # install and no emulator, same as the `tests` job. c8 (`.c8rc.json`,
    # `all: true`) instruments EVERY functions/ source file, so the number
    # reflects the true backend gap — including the untested onCall/onRequest
    # handlers in index.js. Thresholds in .c8rc.json are a ratchet: raise them
    # as coverage improves so the backend number can only go up.
    name: Tests (Functions coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Functions coverage
        run: npm run functions:coverage

  src-node-coverage:
    # src/ coverage from the plain-node suite (`.c8rc.src.json`, c8 wrapping
    # scripts/run-src-node-tests.mjs). The third coverage surface: Vitest sees
    # only the *.spec.* files, so src logic tested by the ~330 node scripts
    # (exporters, parsers, schemas — e.g. assessmentToDocx via
    # test:paper-golden) read 0% there. This job measures that slice and
    # ratchets it via the thresholds in .c8rc.src.json. Deliberately NOT a
    # required check (the nine required checks are fixed — see repo docs); it
    # still fails the run when coverage drops below the ratchet.
    name: Tests (src node coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: src node coverage
        run: npm run src:coverage

  unit:
    # Vitest (jsdom) component/hook/behaviour specs — the `*.spec.{js,jsx}`
    # files under src/. Separate from `tests` (the plain-node `*.test.js`
    # suite) because it needs the jsdom environment. Runs coverage so the
    # frontend gap is reported on every PR. This is a required status check
    # on `main` branch protection.
    name: Tests (Vitest unit + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Vitest
        run: npm run test:coverage

  build:
    # Clean build gate (release-safety layer). The pre-merge guarantee that the
    # Vite frontend actually compiles AND the core public routes render on a
    # phone — caught here before merge, not post-merge in deploy-hosting.yml.
    #
    #   • Build: `vite build --mode smoke` runs the full production build
    #     pipeline with the FAKE public Firebase config in .env.smoke (web
    #     config is non-secret; it ships in every browser bundle). No repo
    #     secrets are needed, so this gate runs on forked-PR builds too.
    #   • Mobile smoke: boots the build in a phone-sized headless Chromium and
    #     asserts /, /login, /register, /papers, /pricing each paint real
    #     content with no crash card, uncaught error, or horizontal overflow.
    #
    # Make this a required status check on `main` branch protection to block a
    # merge that breaks the build or a public route.
    name: Build + mobile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Override the workflow-level skip: this job is the one that DOES need the
    # puppeteer Chromium (the smoke drives a real browser).
    env:
      PUPPETEER_SKIP_DOWNLOAD: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build (smoke mode — fake public Firebase config)
        run: npm run smoke:build
      # Needs the build above, which is why it lives here and not in test:all
      # (plain node, no dist/). It walks the emitted chunks' STATIC import graph
      # and fails if a page declared light reaches a heavy vendor — the
      # regression #2172 measured by hand and, one hop deeper, missed.
      - name: Bundle edges (light pages stay free of heavy vendors)
        run: npm run check:bundle-edges
      - name: Mobile smoke (public routes)
        run: npm run smoke:mobile
      - name: Dashboard responsive navigation (viewport matrix)
        run: npm run smoke:dashboard

  rules-emulator:
    # Behavioural Firestore-rules tests. Kept as a separate job because
    # they need the Firestore emulator (JVM) — that's why they can't sit
    # inside `test:all`, which is plain `node` scripts.
    name: Tests (Firestore rules emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Firestore rules tests
        run: npm run test:rules-emulator
      - name: School-membership RBAC rules tests
        # Multi-school access-control model (schools/{id}/members/{uid}):
        # membership is tamper-proof, cross-school isolation holds, and the
        # platformAdmin custom claim folds into isAdmin(). See
        # scripts/test-school-membership-rules-emulator.mjs.
        run: npm run test:school-membership-rules
      - name: Quiz-editor save replay (full real payloads vs rules)
        # Replays the editor's exact autosave payloads (built by the real
        # importer + serializer + normalizeQuestionPayload) through the rules.
        # Guards the expression-budget cliff that broke every scanned
        # past-paper import — see scripts/test-quiz-autosave-rules-emulator.mjs.
        run: npm run test:quiz-autosave-rules
      - name: Library smart-folder rules + index coverage
        # Runs every query the library's builders can emit against the real
        # emulator. A missing composite index is a FAILED_PRECONDITION in a
        # teacher's browser, not a deploy failure, so it has to be executed
        # here — see scripts/test-library-rules-emulator.mjs.
        run: npm run test:library-rules-emulator

  dependency-audit:
    # Dependency vulnerability gate (CICD-002). Audits only PRODUCTION
    # dependencies (`--omit=dev`) of the two deployed trees — the root Vite
    # bundle and functions/ — because dev-only tooling vulns never ship to a
    # user. `npm audit` reads the committed lockfile against the advisory DB
    # (no install needed), so this is fast.
    #
    # Threshold policy:
    #   • BLOCKING at `critical` — a newly introduced critical prod dep fails
    #     the merge (the P1-5 acceptance criterion). Both trees are clean at
    #     this level today.
    #   • REPORTING at `high` — highs are surfaced in the log (never blocking)
    #     so a freshly disclosed transitive high can't red-wall every unrelated
    #     PR while Dependabot's bump PR is in flight; the fix lands through
    #     Dependabot (.github/dependabot.yml), not by wedging the queue.
    name: Dependency audit (prod deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Audit root production dependencies (block on critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: Report root high-severity advisories (non-blocking)
        if: ${{ always() }}
        run: npm audit --omit=dev --audit-level=high || echo "::warning::root has high-severity prod advisories — see Dependabot PRs"
      - name: Audit functions production dependencies (block on critical)
        working-directory: functions
        run: npm audit --omit=dev --audit-level=critical
      - name: Report functions high-severity advisories (non-blocking)
        if: ${{ always() }}
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high || echo "::warning::functions has high-severity prod advisories — see Dependabot PRs"

  storage-rules-emulator:
    # Behavioural Storage-rules tests. Like the Firestore job above, these
    # need the emulator (JVM) so they can't sit inside `test:all`. The suite
    # existed but ran nowhere in CI until now — this wires it up so the
    # per-path ownership / content-type / cross-tenant guards actually gate
    # merges. It boots BOTH firestore + storage emulators because
    # storage.rules reads the caller's role from users/{uid} in Firestore.
    name: Tests (Storage rules emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Storage rules tests
        run: npm run test:storage-rules-emulator

  payment-lifecycle-emulator:
    # End-to-end payment lifecycle against the Firestore + Storage emulators.
    # Drives the REAL subscriptionActivation.js + lencoWebhookProcessor.js
    # transactions with the mock provider adapter standing in for the Lenco
    # sandbox — the emulator half of the payment-lifecycle launch blocker.
    # Unlike the rules-emulator jobs (client SDK only) this one requires
    # firebase-admin, a functions/ dependency, so it installs functions/ deps
    # too; it needs the JVM for the emulator. Storage emulator is booted so the
    # best-effort invoice-PDF side effect exercises end-to-end instead of
    # failing on a missing bucket.
    name: Tests (Payment lifecycle emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Payment lifecycle tests
        run: npm run test:payment-lifecycle-emulator
