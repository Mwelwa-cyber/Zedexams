name: Agent — Ledger release notes

# Ledger drafts a CHANGELOG entry for any merge commits since the last
# dated section in docs/CHANGELOG.md, then opens a draft PR with the
# patch. Runs on every push to main, and supports manual dispatch.
#
# Required repository secret:
#   ANTHROPIC_AGENTS_KEY — dedicated Anthropic key for the GitHub-agent
#     workflows, so Console spend separates agent/Opus from the app runtime.
#     Falls back to ANTHROPIC_API_KEY when unset, so this is safe to run
#     before the dedicated key is provisioned.

on:
  # Daily, NOT per-push. While Ledger was a no-op (see releaseNotesCore.mjs) a
  # push trigger cost nothing, so 24 merges in a day meant 24 free runs. Now
  # that it actually calls the model, that same day would be 24 Sonnet calls
  # producing 24 drafts of one daily digest — and the branch, PR title and
  # section heading are all keyed to the DATE, so every run after the first
  # just rewrites the same document. One run per day is the unit of work.
  # 20:00 UTC = 22:00 Africa/Lusaka, so the digest covers a full working day.
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the patch instead of opening a PR"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write
  actions: write  # dispatch ci.yml against the new branch — GITHUB_TOKEN-created events don't fire downstream workflows on their own.

concurrency:
  group: ledger-release-notes
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Ledger walks git log, needs full history.

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Octokit
        run: npm install --no-save --no-audit --no-fund @octokit/rest@22

      - name: Run Ledger
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_AGENTS_KEY || secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/agents/release-notes.mjs
