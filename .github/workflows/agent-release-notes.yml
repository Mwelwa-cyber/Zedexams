name: Agent — Ledger release notes

# Ledger drafts a CHANGELOG entry from the PRs that landed on main since the
# changelog was last written, then opens a draft PR with the patch.
#
# NO SECRETS. Ledger calls no model — it assembles the entry from commit
# subjects, so it needs only the GITHUB_TOKEN Actions provides. It used to
# hold ANTHROPIC_AGENTS_KEY; the measurement behind dropping that is in
# scripts/agents/release-notes.mjs.

on:
  # Daily, NOT per-push. Ledger is free now, so this is no longer about spend:
  # the branch, PR title and section heading are all keyed to the DATE, so
  # every run after the first on a given day just rewrites the same document.
  # A day is the unit of work. Per-push would also put a job on the merge
  # commit, which is what ci.yml documents as making the deploys queue.
  # 20:00 UTC = 22:00 Africa/Lusaka, so the digest covers a full working day.
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the patch instead of opening a PR"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write
  actions: write  # dispatch ci.yml against the new branch — GITHUB_TOKEN-created events don't fire downstream workflows on their own.

concurrency:
  group: ledger-release-notes
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Ledger walks git log, needs full history.

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Octokit
        run: npm install --no-save --no-audit --no-fund @octokit/rest@22

      - name: Run Ledger
        # No ANTHROPIC key: Ledger assembles the changelog from commit subjects
        # deterministically and calls no model. Do not re-add one without
        # reading the measurement in scripts/agents/release-notes.mjs.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/agents/release-notes.mjs
