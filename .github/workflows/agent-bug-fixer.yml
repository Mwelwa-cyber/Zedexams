name: Agent — Mendi bug fixer

# Mendi (Bug Fixer) reproduces a reported bug, finds the root cause, applies a
# minimal fix, adds a regression test, verifies lint + build + tests, and opens
# a DRAFT pull request with the result. Mendi never pushes to main.
#
# Triggers:
#   - An issue gets the `bug` label.
#   - A maintainer comments `/mendi` on an issue (not a PR).
#
# Mendi's full operating contract lives in `.claude/agents/bug-fixer.md`; this
# workflow just points Claude Code at it so there is one source of truth.
#
# Required repository secret:
#   ANTHROPIC_AGENTS_KEY — dedicated Anthropic key shared by the GitHub-agent
#     workflows (Rex, Ledger, Mendi, Security Review), so Console spend
#     separates agent/Opus from the app runtime. Falls back to
#     ANTHROPIC_API_KEY when unset, so this is safe to run before the
#     dedicated key is provisioned.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

# Don't fight the runtime stack: one Mendi run per issue, and let a run finish
# rather than cancelling it half-way through an edit.
concurrency:
  group: mendi-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write        # commit + push the fix branch
  pull-requests: write   # open the draft PR
  issues: write          # comment the PR link back on the issue

jobs:
  fix:
    # Run when the `bug` label is added, OR when an authorised maintainer types
    # `/mendi` on an issue (PR comments are excluded — Mendi fixes from issues).
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'bug') ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       contains(github.event.comment.body, '/mendi') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Mendi reproduces by walking history + running tests.

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pre-install root deps so Mendi's `npm run lint / build / test:all`
      # verification is fast. Mendi installs functions/ deps itself if it
      # touches that tree.
      - name: Install dependencies
        run: npm ci || npm install

      # Write the bug report outside the repo tree via env vars (never inline
      # untrusted issue text into a run script — avoids command injection, and
      # keeps it out of the commit).
      - name: Capture issue context
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "Bug report — issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
            echo
            echo "${ISSUE_BODY}"
          } > "${RUNNER_TEMP}/mendi-issue.md"

      - name: Run Mendi
        id: mendi
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_AGENTS_KEY || secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_prefix: "mendi/"
          base_branch: "main"
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 50
          prompt: |
            You are Mendi, the ZedExams bug-fixing engineer.

            First read these files and follow them exactly — they are your
            operating contract and the repo's source of truth:
              - .claude/agents/bug-fixer.md   (your full operating principles)
              - CLAUDE.md                     (commands, deploy flow, off-limits)
              - ORG.md                        (org model)

            The bug report you must fix is in this file (read it first):
              ${{ runner.temp }}/mendi-issue.md

            Do the job end to end:
              1. Reproduce the failure and state the root cause in 1–2 sentences
                 with file:line evidence. If you cannot reproduce or locate it,
                 stop and say so in a commit-message-style summary — do NOT
                 guess-patch.
              2. Apply a minimal, robust fix at the true root cause.
              3. Add a regression test (a plain Node script under scripts/, wired
                 into package.json + the test:all chain) per bug-fixer.md.
              4. Verify and confirm the real exit codes:
                   npm run lint && npm run build && npm run check:integrity
                 plus the new test and the nearest neighbouring tests.
              5. Commit on the working branch with a clear message describing the
                 root cause and the fix. Do NOT push to main. Do NOT run any
                 `firebase deploy` beyond `firestore:indexes`.

            Keep the diff minimal and idiomatic. Never reference any model
            name or id in commits, code, or comments.

      # The action commits + pushes a branch but does not open the PR. Open it
      # as a DRAFT keyed off the branch the action reported, only if Mendi
      # actually produced commits.
      - name: Open draft PR
        if: steps.mendi.outputs.branch_name != ''
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.mendi.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const base = 'main';
            const { owner, repo } = context.repo;

            // Confirm the branch exists and is ahead of base before opening a PR.
            let cmp;
            try {
              cmp = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${base}...${branch}`,
              });
            } catch (e) {
              core.info(`Branch ${branch} not comparable (Mendi may have made no changes): ${e.message}`);
              return;
            }
            if (!cmp.data.ahead_by) {
              core.info('No new commits on the branch — Mendi did not produce a fix.');
              return;
            }

            // Don't open a duplicate if one already exists for this branch.
            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`,
            });
            if (existing.data.length) {
              core.info(`Draft PR already open: #${existing.data[0].number}`);
              return;
            }

            const num = process.env.ISSUE_NUMBER;
            const pr = await github.rest.pulls.create({
              owner, repo, head: branch, base, draft: true,
              title: `Mendi: fix #${num} — ${process.env.ISSUE_TITLE}`,
              body:
                `Automated bug fix for #${num}.\n\n` +
                `Mendi (the bug-fixer agent) reproduced the issue, fixed the root ` +
                `cause, and added a regression test. **Review the diff and the ` +
                `verification output before merging** — this is a draft.\n\n` +
                `Closes #${num}`,
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: Number(num),
              body: `🛠️ Mendi opened draft PR #${pr.data.number} with a proposed fix.`,
            });
            core.info(`Opened draft PR #${pr.data.number}`);
