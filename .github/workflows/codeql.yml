name: CodeQL

# GitHub's own semantic analysis engine, scanning JavaScript/TypeScript for
# XSS, injection, path traversal, prototype pollution, ReDoS, open redirect,
# unsafe deserialization, hard-coded credentials and clear-text logging of
# sensitive data. Findings land in the repository's Security tab.
#
# WHY THIS EXISTS: it replaces the per-PR AI security review. That reviewer
# billed the Anthropic API on every run and #2295 made it opt-in behind the
# `security-review` label, which left nothing looking at application logic by
# default. CodeQL is free on public repositories — as are Actions minutes — so
# this restores automatic coverage at zero cost. It is complementary, not
# identical: CodeQL follows taint across the WHOLE codebase rather than reading
# one diff, but it cannot reason about authorization semantics ("this callable
# never checks the caller's role"). That gap is covered behaviourally by the
# Firestore/Storage rules emulator jobs in ci.yml, and the `security-review`
# label remains as the escape hatch when an AI opinion is actually wanted.
#
# NOT A REQUIRED CHECK, and it should not become one. Code scanning reports
# findings against the whole repository, so a pre-existing alert unrelated to a
# PR would block that PR from merging. Read the Security tab; do not gate on it.

on:
  pull_request:
    branches: [main]
  # Weekly, to refresh the default-branch baseline.
  #
  # Deliberately NO `push: [main]` trigger, for the reason ci.yml documents at
  # length: GitHub-hosted runners are a shared, capped pool, and jobs firing on
  # the merge commit make deploy-hosting / deploy-firebase queue behind them —
  # that queue wait, not the pipeline, was the bulk of the old "deploys are
  # slow" delay. CodeQL on a codebase this size is not a short job, so putting
  # it on the merge path would reintroduce exactly that.
  #
  # The cost of baselining weekly instead of per-merge: for up to seven days,
  # an alert already present on `main` can be reported on a PR as if the PR
  # introduced it, and an alert fixed on `main` stays open until the next
  # scheduled run. Both self-correct. Neither blocks anything, since this is
  # not a required check.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    # CodeQL indexes the whole tree, which is a lot slower than any ci.yml job.
    timeout-minutes: 45
    permissions:
      security-events: write   # upload the SARIF results to code scanning
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # JS/TS needs no compilation, so CodeQL indexes the source directly.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
