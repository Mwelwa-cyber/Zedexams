name: CodeQL

# GitHub's own semantic analysis engine, scanning JavaScript/TypeScript for
# XSS, injection, path traversal, prototype pollution, ReDoS, open redirect,
# unsafe deserialization, hard-coded credentials and clear-text logging of
# sensitive data. Findings land in the repository's Security tab.
#
# WHY THIS EXISTS: it replaces the per-PR AI security review. That reviewer
# billed the Anthropic API on every run and #2295 made it opt-in behind the
# `security-review` label, which left nothing looking at application logic by
# default. It is complementary, not identical: CodeQL follows taint across the
# WHOLE codebase rather than reading one diff, but it cannot reason about
# authorization semantics ("this callable never checks the caller's role").
# That gap is covered behaviourally by the Firestore/Storage rules emulator
# jobs in ci.yml, and the `security-review` label remains as the escape hatch
# when an AI opinion is actually wanted.
#
# ⚠️ DORMANT SINCE 2026-08-18 — automatic triggers are OFF. Read this before
# turning them back on.
#
# This workflow was written for a PUBLIC repository, where code scanning and
# Actions minutes are both free. The repository went PRIVATE on 2026-08-18, and
# on a private repository code scanning requires a paid Code Security plan. The
# analysis itself still succeeds — it indexed all 2,399 JavaScript files — and
# then the upload is rejected:
#
#     Code scanning is not enabled for this repository.
#
# So every run burned ~7 minutes of now-METERED Actions time, produced no
# finding anywhere, and posted a red X on the PR. A permanently failing check
# is worse than an absent one, because it teaches everyone to stop reading the
# check list. Hence dormant rather than deleted: the scan configuration and its
# scope guard are still correct and still tested, they simply have nowhere to
# publish results to.
#
# TO RESTORE, once EITHER Code Security is enabled on the private repository OR
# the repository is public again:
#
#   1. put back the two triggers below —
#          pull_request:
#            branches: [main]
#          schedule:
#            - cron: "0 3 * * 1"
#   2. run `npm run test:codeql-scope`; it asserts the restored triggers are
#      unfiltered, and stops accepting the dormant state automatically.
#
# Note on the schedule: there is deliberately NO `push: [main]` trigger, for
# the runner-contention reason ci.yml documents at length — jobs firing on the
# merge commit make deploy-hosting / deploy-firebase queue behind them. The
# weekly cron is what baselines the default branch instead. Its cost is that
# for up to seven days an alert already on `main` can surface on a PR as if
# that PR introduced it, and one fixed on `main` stays open until the next run.
# Both self-correct; neither blocks anything.
#
# NOT A REQUIRED CHECK, and it should not become one. Code scanning reports
# findings against the whole repository, so a pre-existing alert unrelated to a
# PR would block that PR from merging. Read the Security tab; do not gate on it.

on:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    # CodeQL indexes the whole tree, which is a lot slower than any ci.yml job.
    timeout-minutes: 45
    permissions:
      security-events: write   # upload the SARIF results to code scanning
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # JS/TS needs no compilation, so CodeQL indexes the source directly.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
