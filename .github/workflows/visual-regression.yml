name: Visual regression

# The §4.6 rendering gate. READ-ONLY with respect to committed baselines — this
# workflow can fail a pull request and can never change what it is comparing
# against. Writing a baseline is a separate, privileged, reviewed action:
# visual-baseline-update.yml replaces an approved appearance, and
# visual-baseline-bootstrap.yml records ones that do not exist yet. Neither can
# be reached from a pull request.
#
# ## Why it starts on every pull request, and why that is the point
#
# It used to carry a `paths:` filter naming everything that can affect printed
# output. That made it impossible to REQUIRE: a path-filtered workflow does not
# run on a pull request that touches nothing on the list, and a check that never
# runs is not passed, it is missing — branch protection would hold every such
# pull request open forever, waiting for a result that will never arrive.
#
# So the classification moved inside. The workflow starts on every pull request;
# the `scope` job decides whether printed output can be affected (the same list,
# now in scripts/visual/printAffectingPaths.js where it can be tested); the
# `visual` job renders only when it can matter; and `gate` reports ONE check
# under a stable name whatever happened. The expensive part still only runs when
# it can change a paper — the difference is that the answer is always reported.
#
# ## Which check to require in branch protection
#
#     Visual regression gate
#
# NOT "Visual regression (Chromium + LibreOffice)": that job is legitimately
# skipped on most pull requests, and requiring a job that skips is the same
# deadlock in a different place. The gate job runs `if: always()` and turns
# every combination of outcomes into pass or fail — see gateVerdict.js, where
# the rule is tested rather than expressed as an untestable `if:`.
#
# ## Scope narrowing for reviewed baseline pull requests
#
# A normal product PR runs every fixture. A reviewed baseline-update PR is a
# special case: it changes exactly one fixture/family and therefore validates
# exactly that target. Running all 18 targets on six serial baseline PRs creates
# a deadlock where each correct PR fails because the other five replacements are
# not merged yet. The scope resolver refuses application-code changes, multiple
# targets, mismatched branch names and renderer-identity drift before narrowing.
#
# ## The gate watches itself
#
# The workflows, the fixtures and the baselines are in
# scripts/visual/printAffectingPaths.js on purpose. Without that, a pull request
# could weaken this gate — widen a tolerance, drop a fixture, remove a path —
# WITHOUT running the gate that proves it is still safe. Editing the gate must
# exercise the gate.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Run the full visual suite regardless of which paths changed'
        type: boolean
        default: true

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

# Read-only. This workflow needs to read the repository and write a check
# result; it has no business writing to the repository, and the baseline update
# path deliberately lives in another workflow with its own permissions.
permissions:
  contents: read

jobs:
  # ── Always runs. Classifies the pull request and narrows a baseline one. ──
  scope:
    name: Visual scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      requires_visual: ${{ steps.scope.outputs.requires_visual }}
      reason: ${{ steps.scope.outputs.reason }}
      summary: ${{ steps.scope.outputs.summary }}
      fixture: ${{ steps.scope.outputs.fixture }}
      family: ${{ steps.scope.outputs.family }}
      requires_screen: ${{ steps.scope.outputs.requires_screen }}
      screen_summary: ${{ steps.scope.outputs.screen_summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit and its first parent are needed to derive the exact
          # changed-file set without granting this read-only job API write access.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The scope rules are proved before they are used. Both suites run with no
      # dependencies installed — they are plain node scripts over pure modules,
      # which is why this job needs neither npm ci nor a browser.
      - name: Prove the scope rules
        run: |
          node scripts/visual/baselinePrScope.test.js
          node scripts/visual/printAffectingPaths.test.js
          node scripts/visual/gateVerdict.test.js
          node scripts/visual/screen/screenScope.test.js
          node scripts/visual/screen/screenFixtures.test.js
          node scripts/visual/screen/screenPurity.test.js

      - name: Resolve scope
        id: scope
        env:
          VISUAL_FORCE: ${{ inputs.force }}
        run: node scripts/visual/resolveGateScope.mjs

  # ── The expensive part. Runs only when printed output can be affected. ────
  visual:
    name: Visual regression (Chromium + LibreOffice)
    needs: scope
    if: needs.scope.outputs.requires_visual == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Explicit, because ci.yml skips the puppeteer browser download globally and
      # a copied-in default would silently leave this job with no browser. The gate
      # renders with the browser puppeteer downloads here, and records ITS version.
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "false"
        run: npm ci

      # The renderers. Pinned via the runner image plus the recorded version in
      # every comparison summary — a version change is an environment error
      # rather than several hundred unexplained page failures.
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation

      - name: Record the rendering environment
        run: node scripts/visual/reportEnvironment.mjs

      # Fixtures validate their own contents BEFORE anything renders: a fixture
      # whose subject was deleted must fail here, not render a consistent paper
      # with nothing in it and report green.
      - name: Validate fixtures
        run: |
          ARGS=()
          if [ -n "${{ needs.scope.outputs.fixture }}" ]; then
            ARGS+=(--fixture="${{ needs.scope.outputs.fixture }}")
          fi
          node scripts/visual/validateFixtures.mjs "${ARGS[@]}"

      # The print invariant the baselines cannot express: the paper code must
      # never cost a sheet, and body content must never be printed on top of it.
      # A baseline records how the paper LOOKS; it cannot say that the strip at
      # the foot of the page is reserved, so a diff of a paper with an answer
      # line through its paper code compares perfectly against a baseline of the
      # same defect. This renders through the Chromium the job already has.
      #
      # Run BEFORE the comparison, deliberately: a violated print invariant must
      # stop the run rather than produce a diff a reviewer might record.
      #
      # Full-suite runs only. A reviewed baseline PR is narrowed to one target
      # and cannot contain application code — the scope resolver refuses it — so
      # there is nothing there for this to protect.
      - name: Prove the footer band
        if: needs.scope.outputs.fixture == ''
        run: node scripts/visual/footerBand.test.js

      # ONE implementation, whichever way the job was triggered. Ordinary PRs and
      # manual runs leave the arguments empty and execute the complete suite. A
      # reviewed baseline-only PR receives the exact fixture/family proved by the
      # scope resolver; no second comparison implementation exists.
      - name: Compare against baselines
        id: compare
        run: |
          ARGS=(--mode=compare)
          if [ -n "${{ needs.scope.outputs.fixture }}" ]; then
            ARGS+=(--fixture="${{ needs.scope.outputs.fixture }}")
          fi
          if [ -n "${{ needs.scope.outputs.family }}" ]; then
            ARGS+=(--family="${{ needs.scope.outputs.family }}")
          fi
          node scripts/visual/runVisualGate.mjs "${ARGS[@]}"

      # Uploaded even on failure — especially on failure. A reviewer must be able
      # to see the whole candidate document and the complete page set, not only
      # the pages that changed, because surrounding pagination is what explains
      # a move.
      - name: Upload comparison artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            tests/visual/output/**

  # ── The learner SCREEN. Runs only when what a learner sees can be affected. ─
  #
  # Classified INSIDE the workflow, never by a `paths:` filter. The gate below
  # is a required check and must report on every pull request; a filtered job
  # is MISSING rather than passed, and branch protection then holds every
  # unrelated pull request open waiting for a result that never arrives.
  #
  # No LibreOffice: this family renders in Chromium only. Papers and screens
  # are separate renderers with separate baselines, and neither vouches for the
  # other.
  screen:
    name: Visual regression (learner screen)
    needs: scope
    if: needs.scope.outputs.requires_screen == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Explicit, because ci.yml skips the puppeteer browser download globally.
      # The gate renders with the browser puppeteer downloads here and records
      # ITS version into the baseline identity.
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "false"
        run: npm ci

      - name: Record the rendering environment
        run: node scripts/visual/reportEnvironment.mjs

      # Fixtures validate their own contents before anything renders — a
      # fixture whose subject was deleted must fail here rather than have its
      # empty page compared against a baseline nobody can read.
      - name: Validate the screen fixtures
        run: node scripts/visual/screen/screenFixtures.test.js

      - name: Compare against baselines
        run: node scripts/visual/screen/runScreenGate.mjs --mode=compare

      # Published whatever happened: a failed comparison is exactly when
      # someone needs to look at what was drawn.
      - name: Upload the rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screen-${{ github.run_id }}
          path: tests/visual/output/screen/**
          retention-days: 14
          if-no-files-found: warn

  # ── The one required check. Always runs, always reports, same name. ───────
  #
  # BOTH families report through it. A second required check would need a
  # second branch-protection entry with the same wedging risk, and the question
  # a pull request needs answered is one question, not two.
  gate:
    name: Visual regression gate
    needs: [scope, visual, screen]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The verdict is computed by a tested module rather than by an `if:`
      # expression. Every way this can be wrong is silent — passing on a
      # cancelled render, on a skip it should have refused, or when scope
      # resolution failed and nothing ran at all — and a GitHub expression
      # cannot be tested. See gateVerdict.test.js, which enumerates the whole
      # matrix and pins the only four passing combinations.
      - name: Decide
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
          REQUIRES_VISUAL: ${{ needs.scope.outputs.requires_visual }}
          SCOPE_SUMMARY: ${{ needs.scope.outputs.summary }}
          SCREEN_RESULT: ${{ needs.screen.result }}
          REQUIRES_SCREEN: ${{ needs.scope.outputs.requires_screen }}
          SCREEN_SUMMARY: ${{ needs.scope.outputs.screen_summary }}
        run: |
          node --input-type=module -e '
            import { gateVerdict } from "./scripts/visual/gateVerdict.js"
            import fs from "node:fs"
            const v = gateVerdict({
              scopeResult: process.env.SCOPE_RESULT,
              visualResult: process.env.VISUAL_RESULT,
              requiresVisual: process.env.REQUIRES_VISUAL,
              summary: process.env.SCOPE_SUMMARY,
              screenResult: process.env.SCREEN_RESULT,
              requiresScreen: process.env.REQUIRES_SCREEN,
              screenSummary: process.env.SCREEN_SUMMARY,
            })
            const line = `${v.passed ? "✓" : "✗"} ${v.conclusion}: ${v.message}`
            console.log(line)
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                `### Visual regression gate\n\n${line}\n`)
            }
            process.exit(v.passed ? 0 : 1)
          '
