name: Android Debug APK

# Builds an INSTALLABLE debug APK and uploads it as a workflow artifact.
#
# Why this exists (vs the two release workflows):
#   • android-release.yml      → SIGNED release APK → Firebase App Distribution
#   • android-play-release.yml → SIGNED release AAB  → Google Play
#   Both need the release keystore + Play secrets and only fire on v*.*.* tags.
#
# THIS workflow needs NO secrets to produce a working APK: the Gradle `debug`
# build type self-signs with the standard Android debug key, so the output is
# directly installable for testing (icon changes, UI tweaks, smoke checks)
# without setting up signing. Grab the APK from the run's "Artifacts" section.
#
# Triggers
#   • Manual run from the Actions tab (workflow_dispatch) — build on demand.
#   • Push to main that touches the native shell (android/**, capacitor config,
#     or the launcher icons) — so a change like a new app icon automatically
#     produces a testable APK without anyone remembering to kick it off.
#
# Notes
#   • The VITE_FIREBASE_* repo secrets are passed to `npm run build` so the
#     bundled app can actually reach Firebase at runtime. They're optional here:
#     if unset the build still succeeds (Vite no-ops), but the installed app
#     would fail to talk to Firebase — fine for pure icon/UI checks.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - ".github/workflows/android-debug-apk.yml"

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so android/app/build.gradle can derive versionCode
          # from `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Capacitor CLI requires Node >= 22 (cap sync aborts on 20).
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Must match android/variables.gradle (compileSdk/targetSdk = 36).
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          # Firebase config — baked into the JS bundle so the app can reach
          # Firebase at runtime. Optional for this workflow (build succeeds
          # without them), but pass them through when present so the debug
          # APK is actually usable, not just installable.
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID:     ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY:          ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY }}
          VITE_SENTRY_DSN:                  ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION:                 ${{ secrets.VITE_APP_VERSION }}
          # Same stamp as the release workflows (Codex P1 on #2159): a debug
          # APK exercising production still reports which commit built it.
          VITE_BUILD_SHA:                 ${{ github.sha }}
          VITE_POSTHOG_KEY:                 ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST:                ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_GOOGLE_MAPS_STATIC_KEY:      ${{ secrets.VITE_GOOGLE_MAPS_STATIC_KEY }}
        run: npm run build

      # Firebase native config for the Android shell. Required for the
      # @capacitor-firebase/authentication plugin (Google sign-in): without it
      # the google-services Gradle plugin in android/app/build.gradle never
      # applies, no default_web_client_id resource is generated, and native
      # Google sign-in can't mint a Firebase ID token — the app shows
      # "Google sign-in failed". Optional here: if the secret is unset the build
      # still succeeds (build.gradle skips the plugin), but Google sign-in in
      # the installed app won't work.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret is unset — Google sign-in will NOT work in this APK."
            exit 0
          fi
          # The secret may be raw JSON or base64-encoded JSON; accept both.
          if printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d 2>/dev/null | grep -q '"project_info"'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          if ! grep -q '"project_info"' android/app/google-services.json; then
            echo "::error::GOOGLE_SERVICES_JSON did not decode to a valid google-services.json."
            exit 1
          fi
          echo "google-services.json written ($(stat -c%s android/app/google-services.json) bytes)."

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate built APK
        id: apk
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Expected debug APK not found at $apk"
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "Built $(du -h "$apk" | cut -f1) debug APK."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: zedexams-debug-apk-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
