name: Deploy Firebase

# Runs automatically on every push to main that touches any Firebase-related
# file. Also supports manual runs from the Actions tab (workflow_dispatch).
#
# Requires one GitHub repository secret:
#   FIREBASE_TOKEN — generated once locally with `firebase login:ci`
#
# The Vite frontend deploys separately via the sibling `deploy-hosting.yml`
# workflow. This one only handles Firebase: Firestore rules + indexes,
# Storage rules, and Cloud Functions.

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - firestore
          - functions
          - storage

# Prevent two deploys running over each other.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Explicit minimum permissions — some org settings restrict actions
    # unless this is stated explicitly.
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      # Stability gates — added 2026-05. Rules + functions deploys must
      # also pass the same lint + test suite as a hosting deploy. This
      # blocks a malformed firestore.rules or a regression in the quiz
      # importer / schema test from reaching production.
      - name: Lint
        run: npm run lint

      - name: Tests (importer + sanitize + schema)
        run: npm run test:all

      - name: Install function dependencies
        working-directory: functions
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify FIREBASE_TOKEN secret is set
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set in repository secrets."
            echo "::error::Generate one locally with: npx firebase-tools login:ci"
            echo "::error::Then add it as a secret at Settings > Secrets and variables > Actions."
            echo "::error::See DEPLOY.md for step-by-step instructions."
            exit 1
          fi
          echo "Token is present (length: ${#FIREBASE_TOKEN})"

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.target }}" in
              all)        echo "only=firestore,storage,functions" >> "$GITHUB_OUTPUT" ;;
              firestore)  echo "only=firestore"                    >> "$GITHUB_OUTPUT" ;;
              functions)  echo "only=functions"                    >> "$GITHUB_OUTPUT" ;;
              storage)    echo "only=storage"                      >> "$GITHUB_OUTPUT" ;;
            esac
          else
            # On push, deploy everything. Path filters already ensure this
            # workflow only runs when a Firebase-relevant file changed.
            echo "only=firestore,storage,functions" >> "$GITHUB_OUTPUT"
          fi

      # Deploy with a TARGETED retry on transient per-function failures.
      #
      # Deploying all ~136 functions in one shot makes Cloud Functions (Gen 2)
      # return "HTTP Error: 409, unable to queue the operation" for a handful of
      # them: there is a per-region cap on concurrent create/update operations,
      # and a full deploy blows past it. firebase-tools LOGS those per-function
      # failures but STILL EXITS 0 — so a green deploy could silently leave
      # functions running stale code. That is exactly what bit the past-paper
      # importer: #1418, #1425 and #1427 all reported a successful deploy while
      # importPastPaperQuestions never actually updated (it kept the old
      # 40-question cap in production).
      #
      # So we don't trust the exit code: we scan the output for the per-function
      # failure markers. On a retry we re-deploy ONLY the functions that failed,
      # NOT the whole set. Re-running the full deploy just re-saturates the
      # concurrency cap and fails a *different* 2-3 functions on every pass, so
      # it never converges (that was the bug in #1433). A handful of targeted
      # operations stays well under Firebase's recommended batch of 10, so the
      # transient 409 clears and the failed set shrinks to zero. If functions are
      # still failing after every attempt we fail the job loudly, so a green
      # check genuinely means "deployed".
      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # Un-coloured, deterministic output so the failure-line parser below
          # never has to step around ANSI escape codes.
          NO_COLOR: "1"
        run: |
          set -uo pipefail

          # Names of the functions firebase-tools reported as failed. It logs
          # each as "failed to update/create function .../functions/<name>" and
          # sometimes STILL exits 0, so we always scan, regardless of exit code.
          parse_failed() {
            grep -iE "failed to (update|create) function" \
              | grep -oiE "/functions/[A-Za-z0-9_-]+" \
              | sed 's#/functions/##' \
              | sort -u
          }

          only="${{ steps.target.outputs.only }}"
          max=6
          attempt=0
          while : ; do
            attempt=$((attempt + 1))
            echo "::group::Firebase deploy attempt ${attempt}/${max} (--only ${only})"
            set +e
            out=$(npx firebase-tools@latest deploy \
              --only "${only}" \
              --non-interactive \
              --project examsprepzambia \
              --force 2>&1)
            code=$?
            set -e
            echo "${out}"
            echo "::endgroup::"

            failed=$(printf '%s\n' "${out}" | parse_failed) || true

            # Clean only when the CLI exited 0 AND no per-function failure slipped
            # through behind that exit 0.
            if [ "${code}" -eq 0 ] && [ -z "${failed}" ]; then
              echo "Firebase deploy clean on attempt ${attempt}."
              break
            fi

            if [ "${attempt}" -ge "${max}" ]; then
              echo "::error::Firebase deploy still reporting failures after ${attempt} attempts. Some functions may be running stale code."
              [ -n "${failed}" ] && printf '%s\n' "${failed}" | sed 's/^/::error::  unresolved function: /'
              exit 1
            fi

            # Narrow the NEXT attempt to ONLY the functions that just failed.
            # (If the failure wasn't function-specific — e.g. a firestore.rules
            # error — failed is empty, so we retry the original target as-is.)
            if [ -n "${failed}" ]; then
              only=$(printf '%s\n' "${failed}" | sed 's/^/functions:/' | paste -sd, -)
            fi

            wait=$((attempt * 15))
            echo "Deploy reported transient failure(s); retrying [--only ${only}] in ${wait}s…"
            sleep "${wait}"
          done
