name: Deploy Firebase

# Runs automatically on every push to main that touches any Firebase-related
# file. Also supports manual runs from the Actions tab (workflow_dispatch).
#
# Requires one GitHub repository secret:
#   FIREBASE_TOKEN — generated once locally with `firebase login:ci`
#
# The Vite frontend deploys separately via the sibling `deploy-hosting.yml`
# workflow. This one only handles Firebase: Firestore rules + indexes,
# Storage rules, and Cloud Functions.

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - firestore
          - functions
          - storage

# Prevent two deploys running over each other.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fail-fast: one full deploy plus a single quick retry of any functions that
    # report a transient failure. A clean deploy finishes well under 10 minutes;
    # a failing one surfaces in a few minutes rather than tying up a runner.
    timeout-minutes: 20

    # Explicit minimum permissions — some org settings restrict actions
    # unless this is stated explicitly.
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      # Stability gates — added 2026-05. Rules + functions deploys must
      # also pass the same lint + test suite as a hosting deploy. This
      # blocks a malformed firestore.rules or a regression in the quiz
      # importer / schema test from reaching production.
      - name: Lint
        run: npm run lint

      - name: Tests (importer + sanitize + schema)
        run: npm run test:all

      - name: Install function dependencies
        working-directory: functions
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify FIREBASE_TOKEN secret is set
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set in repository secrets."
            echo "::error::Generate one locally with: npx firebase-tools login:ci"
            echo "::error::Then add it as a secret at Settings > Secrets and variables > Actions."
            echo "::error::See DEPLOY.md for step-by-step instructions."
            exit 1
          fi
          echo "Token is present (length: ${#FIREBASE_TOKEN})"

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.target }}" in
              all)        echo "only=firestore,storage,functions" >> "$GITHUB_OUTPUT" ;;
              firestore)  echo "only=firestore"                    >> "$GITHUB_OUTPUT" ;;
              functions)  echo "only=functions"                    >> "$GITHUB_OUTPUT" ;;
              storage)    echo "only=storage"                      >> "$GITHUB_OUTPUT" ;;
            esac
          else
            # On push, deploy everything. Path filters already ensure this
            # workflow only runs when a Firebase-relevant file changed.
            echo "only=firestore,storage,functions" >> "$GITHUB_OUTPUT"
          fi

      # Deploy once, fail fast, never trust a 0 exit code.
      #
      # Deploying the Gen 2 functions can make Cloud Functions return
      # "HTTP Error: 409, unable to queue the operation" for a handful of them.
      # firebase-tools LOGS those per-function failures but STILL EXITS 0 — so a
      # green deploy could silently leave functions running stale code. That is
      # exactly what bit the past-paper importer: #1418/#1425/#1427 all reported
      # a successful deploy while importPastPaperQuestions kept the old
      # 40-question cap. So we scan the output for the per-function failure
      # markers regardless of the exit code, retry only the failed set ONCE, and
      # then fail the job loudly listing anything unresolved — a green check
      # genuinely means "deployed".
      #
      # NOTE: when the 409 is widespread and sticky (a random handful failing on
      # every push for hours, even in tiny batches), it is NOT something this
      # workflow can fix — it is a server-side condition (stuck/pending Cloud
      # Functions operations, an exhausted operations quota, or a regional
      # incident). Throwing more retries / chunking at it from CI only ties up a
      # runner and submits more operations; we tried a 15-75s backoff (#1439), a
      # 2-4min backoff (#1445), and sequential chunking (#1446), and none
      # converged. So this step deliberately fails fast: one full deploy + one
      # quick retry of the failed set, then a loud failure that points at the
      # functions left stale, so the operator can clear the GCP-side backlog
      # (cancel stuck operations / check quota) rather than wait out a 40-minute
      # job that gets cancelled mid-deploy.
      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # Un-coloured, deterministic output so the failure-line parser below
          # never has to step around ANSI escape codes.
          NO_COLOR: "1"
        run: |
          set -uo pipefail

          only="${{ steps.target.outputs.only }}"

          # Functions firebase-tools reported as failed. It logs each as
          # "failed to update/create function .../functions/<name>" and can still
          # EXIT 0, so we always scan, regardless of exit code.
          parse_failed() {
            grep -iE "failed to (update|create) function" \
              | grep -oiE "/functions/[A-Za-z0-9_-]+" \
              | sed 's#/functions/##' \
              | sort -u
          }

          # Subset of failures whose error was specifically the transient
          # "HTTP Error: 409, unable to queue the operation" race. Investigation
          # on 2026-06-30 (zero pending operations in either region, healthy
          # operations quota, no regional incident, and every function left
          # ACTIVE with a fresh updateTime) established that these operations
          # COMPLETE server-side — firebase-tools simply races its own in-flight
          # operation and gives up reporting. So a 409 here is cosmetic, not a
          # stale deploy. Any OTHER failure (build error, bad config, the gen1
          # "Failed to update" with no 409, a quota/permission error) is still
          # treated as fatal.
          parse_409() {
            grep -iE "HTTP Error: 409, unable to queue the operation" \
              | grep -oiE "/functions/[A-Za-z0-9_-]+" \
              | sed 's#/functions/##' \
              | sort -u
          }

          max=2            # one full deploy + one quick retry of the failed set
          attempt=0
          code=0
          out=""
          while : ; do
            attempt=$((attempt + 1))
            echo "::group::Firebase deploy attempt ${attempt}/${max} (--only ${only})"
            set +e
            out=$(npx firebase-tools@latest deploy \
              --only "${only}" \
              --non-interactive \
              --project examsprepzambia \
              --force 2>&1)
            code=$?
            set -e
            echo "${out}"
            echo "::endgroup::"

            failed=$(printf '%s\n' "${out}" | parse_failed) || true
            # Stop once the deploy is clean, or after the final attempt.
            if { [ "${code}" -eq 0 ] && [ -z "${failed}" ]; } || [ "${attempt}" -ge "${max}" ]; then
              break
            fi

            # Narrow the retry to ONLY the functions that just failed. (If the
            # failure wasn't function-specific — e.g. a firestore.rules error —
            # failed is empty, so we retry the original target as-is.)
            if [ -n "${failed}" ]; then
              only=$(printf '%s\n' "${failed}" | sed 's/^/functions:/' | paste -sd, -)
            fi
            echo "Deploy reported failure(s); retrying [--only ${only}] in 30s…"
            sleep 30
          done

          # ---- Classify the final attempt's result -------------------------
          failed=$(printf '%s\n' "${out}" | parse_failed) || true

          if [ -z "${failed}" ]; then
            if [ "${code}" -eq 0 ]; then
              echo "Firebase deploy clean — all targets deployed."
              exit 0
            fi
            echo "::error::Firebase deploy exited ${code} with no per-function failure markers — likely a firestore.rules / indexes / storage or CLI error. See the log above."
            exit 1
          fi

          # Split the remaining failures: cosmetic 409 race vs. everything else.
          cosmetic=$(printf '%s\n' "${out}" | parse_409) || true
          if [ -z "${cosmetic}" ]; then
            genuine="${failed}"
          else
            genuine=$(comm -23 <(printf '%s\n' "${failed}") <(printf '%s\n' "${cosmetic}") || true)
          fi

          if [ -n "${genuine}" ]; then
            echo "::error::Firebase deploy failed for function(s) with a non-transient error (NOT the cosmetic 409 race) — these may be running stale code:"
            printf '%s\n' "${genuine}" | sed 's/^/::error::  failed: /'
            exit 1
          fi

          # Everything left is the transient 409 "unable to queue the operation"
          # race, which completes server-side. Downgrade to a warning so a green
          # check is not blocked by a cosmetic race. (Follow-up: a verify-by-state
          # step gated on a read-only cloudfunctions.viewer service-account key
          # will confirm each of these is ACTIVE with a fresh updateTime.)
          echo "::warning::Firebase deploy hit the transient 409 'unable to queue the operation' race on the function(s) below. These operations complete server-side (verified 2026-06-30), so this is treated as non-fatal:"
          printf '%s\n' "${cosmetic}" | sed 's/^/::warning::  transient-409: /'
          echo "Firebase deploy complete (some functions finished via the async 409 path)."
