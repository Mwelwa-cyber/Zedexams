name: Deploy Firebase

# Runs automatically on every push to main that touches any Firebase-related
# file. Also supports manual runs from the Actions tab (workflow_dispatch).
#
# Requires one GitHub repository secret:
#   FIREBASE_TOKEN — generated once locally with `firebase login:ci`
#
# The Vite frontend deploys separately via the sibling `deploy-hosting.yml`
# workflow. This one only handles Firebase: Firestore rules + indexes,
# Storage rules, and Cloud Functions.

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - firestore
          - functions
          - storage

# Prevent two deploys running over each other.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Explicit minimum permissions — some org settings restrict actions
    # unless this is stated explicitly.
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      # Stability gates — added 2026-05. Rules + functions deploys must
      # also pass the same lint + test suite as a hosting deploy. This
      # blocks a malformed firestore.rules or a regression in the quiz
      # importer / schema test from reaching production.
      - name: Lint
        run: npm run lint

      - name: Tests (importer + sanitize + schema)
        run: npm run test:all

      - name: Install function dependencies
        working-directory: functions
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify FIREBASE_TOKEN secret is set
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set in repository secrets."
            echo "::error::Generate one locally with: npx firebase-tools login:ci"
            echo "::error::Then add it as a secret at Settings > Secrets and variables > Actions."
            echo "::error::See DEPLOY.md for step-by-step instructions."
            exit 1
          fi
          echo "Token is present (length: ${#FIREBASE_TOKEN})"

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.target }}" in
              all)        echo "only=firestore,storage,functions" >> "$GITHUB_OUTPUT" ;;
              firestore)  echo "only=firestore"                    >> "$GITHUB_OUTPUT" ;;
              functions)  echo "only=functions"                    >> "$GITHUB_OUTPUT" ;;
              storage)    echo "only=storage"                      >> "$GITHUB_OUTPUT" ;;
            esac
          else
            # On push, deploy everything. Path filters already ensure this
            # workflow only runs when a Firebase-relevant file changed.
            echo "only=firestore,storage,functions" >> "$GITHUB_OUTPUT"
          fi

      # Deploy with retry on transient per-function failures.
      #
      # Deploying all ~136 functions at once makes Firebase return
      # "Error: 409, unable to queue the operation" for some of them when too
      # many update operations are queued concurrently. firebase-tools LOGS
      # those per-function failures but STILL EXITS 0 — so a green deploy could
      # silently leave functions running stale code. This is exactly what
      # happened to the past-paper importer: #1418, #1425 and #1427 all reported
      # a successful deploy while importPastPaperQuestions never actually
      # updated (it kept the old 40-question cap in production).
      #
      # So we don't trust the exit code alone: we scan the output for the
      # per-function failure markers and RE-RUN the deploy when we see them. A
      # re-run skips the already-updated functions as unchanged (so far fewer
      # operations are queued) and re-queues only the ones that failed, which
      # rides out the transient 409. If failures persist after all attempts we
      # fail the job loudly so a green check genuinely means "deployed".
      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          attempt=0
          max=4
          while : ; do
            attempt=$((attempt + 1))
            echo "::group::Firebase deploy attempt ${attempt}/${max}"
            set +e
            out=$(npx firebase-tools@latest deploy \
              --only "${{ steps.target.outputs.only }}" \
              --non-interactive \
              --project examsprepzambia \
              --force 2>&1)
            code=$?
            set -e
            echo "${out}"
            echo "::endgroup::"

            # Treat BOTH a non-zero exit AND any per-resource failure line as a
            # failure — the latter is the case firebase-tools hides behind exit 0.
            if [ "${code}" -eq 0 ] && \
               ! echo "${out}" | grep -qiE "failed to update function|failed to create function|unable to queue the operation|Error: 409"; then
              echo "Firebase deploy clean on attempt ${attempt}."
              break
            fi

            if [ "${attempt}" -ge "${max}" ]; then
              echo "::error::Firebase deploy still reported function failures after ${attempt} attempts. Some functions may be running stale code."
              exit 1
            fi

            wait=$((attempt * 20))
            echo "Deploy reported transient function failure(s); retrying in ${wait}s…"
            sleep "${wait}"
          done
