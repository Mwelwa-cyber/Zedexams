name: Deploy Firebase

# Runs automatically on every push to main that touches any Firebase-related
# file. Also supports manual runs from the Actions tab (workflow_dispatch).
#
# Requires one GitHub repository secret:
#   FIREBASE_TOKEN — generated once locally with `firebase login:ci`
#
# The Vite frontend deploys separately via the sibling `deploy-hosting.yml`
# workflow. This one only handles Firebase: Firestore rules + indexes,
# Storage rules, and Cloud Functions.

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - firestore
          - functions
          - storage

# Prevent two deploys running over each other.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Explicit minimum permissions — some org settings restrict actions
    # unless this is stated explicitly.
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history lets the deploy classifier inspect the exact push diff
          # before deciding whether a stale legacy auth trigger should block the
          # whole release.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      # Stability gates — added 2026-05. Rules + functions deploys must
      # also pass the same lint + test suite as a hosting deploy. This
      # blocks a malformed firestore.rules or a regression in the quiz
      # importer / schema test from reaching production.
      - name: Lint
        run: npm run lint

      - name: Tests (importer + sanitize + schema)
        run: npm run test:all

      - name: Install function dependencies
        working-directory: functions
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify FIREBASE_TOKEN secret is set
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set in repository secrets."
            echo "::error::Generate one locally with: npx firebase-tools login:ci"
            echo "::error::Then add it as a secret at Settings > Secrets and variables > Actions."
            echo "::error::See DEPLOY.md for step-by-step instructions."
            exit 1
          fi
          echo "Token is present (length: ${#FIREBASE_TOKEN})"

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.target }}" in
              all)        echo "only=firestore,storage,functions" >> "$GITHUB_OUTPUT" ;;
              firestore)  echo "only=firestore"                    >> "$GITHUB_OUTPUT" ;;
              functions)  echo "only=functions"                    >> "$GITHUB_OUTPUT" ;;
              storage)    echo "only=storage"                      >> "$GITHUB_OUTPUT" ;;
            esac
          else
            # On push, deploy everything. Path filters already ensure this
            # workflow only runs when a Firebase-relevant file changed.
            echo "only=firestore,storage,functions" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail

          only="${{ steps.target.outputs.only }}"

          run_deploy() {
            local deploy_only="$1"
            npx firebase-tools@latest deploy \
              --only "$deploy_only" \
              --non-interactive \
              --project examsprepzambia \
              --force 2>&1
          }

          parse_failed() {
            grep -iE "failed to update function .*/functions/[A-Za-z0-9_-]+|Failed to update function .*/functions/[A-Za-z0-9_-]+" \
              | grep -oiE "/functions/[A-Za-z0-9_-]+" \
              | sed 's#/functions/##' \
              | sort -u
          }

          parse_409() {
            grep -iE "HTTP Error: 409, unable to queue the operation" \
              | grep -oiE "/functions/[A-Za-z0-9_-]+" \
              | sed 's#/functions/##' \
              | sort -u
          }

          parse_already_exists() {
            grep -iE "HTTP Error: 409, Resource '[^']*/functions/[A-Za-z0-9_-]+' already exists" \
              | grep -oiE "/functions/[A-Za-z0-9_-]+" \
              | sed 's#/functions/##' \
              | sort -u
          }

          auth_trigger_touched=false
          if [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
              if git diff --unified=0 "$base" "${{ github.sha }}" -- functions/index.js \
                | grep -Eq 'resolveInitialUserRole|setUserRole'; then
                auth_trigger_touched=true
              fi
            fi
          else
            # Manual runs are explicit operator intent, so keep the stricter
            # behaviour and surface any setUserRole failure.
            auth_trigger_touched=true
          fi

          out=""
          status=0
          attempt=1
          while [ "$attempt" -le 2 ]; do
            echo "::group::Firebase deploy attempt ${attempt}/2 (--only ${only})"
            set +e
            out="$(run_deploy "$only")"
            status=$?
            set -e
            printf '%s\n' "$out"
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "Firebase deploy completed successfully."
              exit 0
            fi

            failed="$(printf '%s\n' "$out" | parse_failed || true)"
            if [ -z "${failed}" ]; then
              break
            fi

            if [ "$attempt" -eq 2 ]; then
              break
            fi

            if printf '%s\n' "$failed" | grep -qx 'setUserRole' && [ "$auth_trigger_touched" != "true" ]; then
              echo "::warning::setUserRole failed on an unrelated push; skipping retry because the auth-trigger code was not touched."
              break
            fi

            only="$(printf '%s\n' "${failed}" | sed 's/^/functions:/' | paste -sd, -)"
            echo "Deploy reported failure(s); retrying [--only ${only}] in 30s..."
            sleep 30
            attempt=$((attempt + 1))
          done

          failed="$(printf '%s\n' "$out" | parse_failed || true)"
          cosmetic="$(printf '%s\n' "$out" | parse_409 || true)"
          existing="$(printf '%s\n' "$out" | parse_already_exists || true)"
          cosmetic="$(printf '%s\n' "${cosmetic}" "${existing}" | grep -v '^$' | sort -u || true)"

          genuine=""
          if [ -n "${failed}" ]; then
            if [ -z "${cosmetic}" ]; then
              genuine="${failed}"
            else
              genuine="$(comm -23 \
                <(printf '%s\n' "${failed}" | sort -u) \
                <(printf '%s\n' "${cosmetic}" | sort -u) \
              )"
            fi
          fi

          if [ -n "${genuine}" ] && [ "$auth_trigger_touched" != "true" ]; then
            genuine_without_set_user_role="$(printf '%s\n' "${genuine}" | grep -vx 'setUserRole' || true)"
            if [ -n "${genuine_without_set_user_role}" ] || printf '%s\n' "${genuine}" | grep -qxv 'setUserRole'; then
              genuine="${genuine_without_set_user_role}"
            elif printf '%s\n' "${genuine}" | grep -qx 'setUserRole'; then
              echo "::warning::Ignoring stale setUserRole deploy failure because this push did not touch the auth-trigger logic."
              genuine=""
            fi
          fi

          if [ -n "${genuine}" ]; then
            echo "::error::Firebase deploy failed for function(s) with a non-transient error:"
            printf '%s\n' "${genuine}" | sed 's/^/::error::  failed: /'
            exit 1
          fi

          if [ -n "${cosmetic}" ]; then
            echo "::warning::Firebase deploy hit a cosmetic 409 on the function(s) below. These operations complete server-side, so this is treated as non-fatal:"
            printf '%s\n' "${cosmetic}" | sed 's/^/::warning::  cosmetic-409: /'
          fi

          if printf '%s\n' "${failed}" | grep -qx 'setUserRole' && [ "$auth_trigger_touched" != "true" ]; then
            echo "::warning::setUserRole is a stale legacy auth trigger failure on this push; unrelated functions, rules, and indexes were still allowed through."
          fi

          echo "Firebase deploy complete."
