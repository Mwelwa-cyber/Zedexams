name: Deploy Firebase

# Runs automatically on every push to main that touches any Firebase-related
# file. Also supports manual runs from the Actions tab (workflow_dispatch).
#
# Auth — provide ONE of these GitHub repository secrets (see DEPLOY.md):
#   FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON — (preferred) JSON key of a service
#                                          account in the examsprepzambia
#                                          project with the Firebase Admin +
#                                          Service Account User roles. Used via
#                                          GOOGLE_APPLICATION_CREDENTIALS — the
#                                          non-deprecated auth path, and immune
#                                          to the personal-account security
#                                          events that revoke login:ci tokens
#                                          (which is what broke every deploy on
#                                          2026-07-12).
#   FIREBASE_TOKEN                       — (legacy fallback) `firebase login:ci`
#                                          token. Still works but firebase-tools
#                                          warns it is going away, and it dies
#                                          whenever the issuing Google account
#                                          has a password change/security event.
#
# The Vite frontend deploys separately via the sibling `deploy-hosting.yml`
# workflow. This one only handles Firebase: Firestore rules + indexes,
# Storage rules, and Cloud Functions.

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - firestore
          - functions
          - storage

# Prevent two deploys running over each other.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fail-fast: one full deploy plus a single quick retry of any functions that
    # report a transient failure. A clean deploy finishes well under 10 minutes;
    # a failing one surfaces in a few minutes rather than tying up a runner.
    timeout-minutes: 20

    # Explicit minimum permissions — some org settings restrict actions
    # unless this is stated explicitly.
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      # Stability gates — added 2026-05. Rules + functions deploys must
      # also pass the same lint + test suite as a hosting deploy. This
      # blocks a malformed firestore.rules or a regression in the quiz
      # importer / schema test from reaching production.
      - name: Lint
        run: npm run lint

      - name: Tests (importer + sanitize + schema)
        run: npm run test:all

      - name: Install function dependencies
        working-directory: functions
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Service-account auth (preferred) with a fallback to the legacy
      # login:ci token — same convention as android-release.yml. The SA path
      # exports GOOGLE_APPLICATION_CREDENTIALS via GITHUB_ENV so the deploy
      # step below picks it up automatically.
      - name: Set up Firebase deploy credentials
        env:
          FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON:-}" ]; then
            creds="$RUNNER_TEMP/firebase-deploy-sa.json"
            printf '%s' "$FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON" > "$creds"
            chmod 600 "$creds"
            # Fail fast on a mangled paste rather than with an opaque auth
            # error 10 minutes into the deploy.
            client_email=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("client_email",""))' "$creds") || {
              echo "::error::FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON is not valid JSON — re-paste the entire service-account key file."
              exit 1
            }
            if [ -z "$client_email" ]; then
              echo "::error::FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON parsed as JSON but has no client_email — is it really a service-account key?"
              exit 1
            fi
            echo "GOOGLE_APPLICATION_CREDENTIALS=$creds" >> "$GITHUB_ENV"
            echo "Deploying as service account: $client_email"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "::warning::Using the deprecated FIREBASE_TOKEN (login:ci) auth, which any security event on the issuing Google account revokes. Add the FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON secret to switch to the supported service-account path — see DEPLOY.md."
            echo "Token is present (length: ${#FIREBASE_TOKEN})"
          else
            echo "::error::Neither FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON nor FIREBASE_TOKEN secret is set."
            echo "::error::Preferred: create a service account (Firebase Admin + Service Account User roles), add a JSON key, and paste the whole file into FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON."
            echo "::error::Legacy: npx firebase-tools login:ci → FIREBASE_TOKEN."
            echo "::error::Add secrets at Settings > Secrets and variables > Actions. See DEPLOY.md for step-by-step instructions."
            exit 1
          fi

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.target }}" in
              all)        echo "only=firestore,storage,functions" >> "$GITHUB_OUTPUT" ;;
              firestore)  echo "only=firestore"                    >> "$GITHUB_OUTPUT" ;;
              functions)  echo "only=functions"                    >> "$GITHUB_OUTPUT" ;;
              storage)    echo "only=storage"                      >> "$GITHUB_OUTPUT" ;;
            esac
          else
            # On push, deploy everything. Path filters already ensure this
            # workflow only runs when a Firebase-relevant file changed.
            echo "only=firestore,storage,functions" >> "$GITHUB_OUTPUT"
          fi

      # Deploy once, fail fast, never trust a 0 exit code.
      #
      # Deploying the Gen 2 functions can make Cloud Functions return
      # "HTTP Error: 409, unable to queue the operation" for a handful of them.
      # firebase-tools LOGS those per-function failures but STILL EXITS 0 — so a
      # green deploy could silently leave functions running stale code. That is
      # exactly what bit the past-paper importer: #1418/#1425/#1427 all reported
      # a successful deploy while importPastPaperQuestions kept the old
      # 40-question cap. So we scan the output for the per-function failure
      # markers regardless of the exit code, retry only the failed set ONCE, and
      # then fail the job loudly listing anything unresolved — a green check
      # genuinely means "deployed".
      #
      # NOTE: when the 409 is widespread and sticky (a random handful failing on
      # every push for hours, even in tiny batches), it is NOT something this
      # workflow can fix — it is a server-side condition (stuck/pending Cloud
      # Functions operations, an exhausted operations quota, or a regional
      # incident). Throwing more retries / chunking at it from CI only ties up a
      # runner and submits more operations; we tried a 15-75s backoff (#1439), a
      # 2-4min backoff (#1445), and sequential chunking (#1446), and none
      # converged. So this step deliberately fails fast: one full deploy + one
      # quick retry of the failed set, then a loud failure that points at the
      # functions left stale, so the operator can clear the GCP-side backlog
      # (cancel stuck operations / check quota) rather than wait out a 40-minute
      # job that gets cancelled mid-deploy.
      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # Un-coloured, deterministic output so the failure-line parser below
          # never has to step around ANSI escape codes.
          NO_COLOR: "1"
        run: |
          set -uo pipefail

          # When service-account auth is configured (GOOGLE_APPLICATION_CREDENTIALS
          # exported by the credentials step above), it must win: firebase-tools
          # prefers FIREBASE_TOKEN whenever it is set, which would silently keep
          # the deprecated (and revocable) token path alive.
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            unset FIREBASE_TOKEN
          fi

          only="${{ steps.target.outputs.only }}"

          # Functions firebase-tools reported as failed. It logs each as
          # "failed to update/create function .../functions/<name>" and can still
          # EXIT 0, so we always scan, regardless of exit code.
          parse_failed() {
            grep -iE "failed to (update|create) function" \
              | grep -oiE "/functions/[A-Za-z0-9_-]+" \
              | sed 's#/functions/##' \
              | sort -u
          }

          # Subset of failures whose error was specifically the transient
          # "HTTP Error: 409, unable to queue the operation" race. Investigation
          # on 2026-06-30 (zero pending operations in either region, healthy
          # operations quota, no regional incident, and every function left
          # ACTIVE with a fresh updateTime) established that these operations
          # COMPLETE server-side — firebase-tools simply races its own in-flight
          # operation and gives up reporting. So a 409 here is cosmetic, not a
          # stale deploy. Any OTHER failure (build error, bad config, the gen1
          # "Failed to update" with no 409, a quota/permission error) is still
          # treated as fatal.
          parse_409() {
            grep -iE "HTTP Error: 409, unable to queue the operation" \
              | grep -oiE "/functions/[A-Za-z0-9_-]+" \
              | sed 's#/functions/##' \
              | sort -u
          }

          # Subset of failures whose error was the idempotent "409, Resource
          # '<...>/functions/<name>' already exists" that fires when firebase-tools
          # tries to CREATE a function that is already present. firebase-tools
          # only takes the create path for a function it does not yet see in the
          # deployed set, so "already exists" means its own create raced (the
          # resource landed server-side with the code we just uploaded) or the
          # function was created by a prior attempt of this same deploy. Either
          # way the deployed code is current — the very next deploy takes the
          # update path and the 409 disappears. So this is cosmetic, exactly like
          # the "unable to queue" race above, and must not fail the job. (It first
          # bit the brand-new notification crons — dailyPracticeReminders — on
          # their first-ever deploy, blocking every Hosting deploy behind them.)
          parse_already_exists() {
            grep -iE "HTTP Error: 409, Resource '[^']*/functions/[A-Za-z0-9_-]+' already exists" \
              | grep -oiE "/functions/[A-Za-z0-9_-]+' already exists" \
              | grep -oiE "/functions/[A-Za-z0-9_-]+" \
              | sed 's#/functions/##' \
              | sort -u
          }

          # Functions firebase-tools attached an explicit "had HTTP Error: <code>"
          # line to. Gen 2 update failures ALWAYS carry one of these
          # ("Request to https://.../functions/NAME... had HTTP Error: 409, ...");
          # Gen 1 update failures do NOT — a gen1 failure emits only the bare
          # "failed to update function .../functions/NAME" with no HTTP detail.
          # So a function that is in parse_failed but NOT here is a "bare" gen1
          # failure whose underlying cause the log never spelled out. This is the
          # gap that false-failed the deploy of #1471: setUserRole (gen1) hit the
          # same "unable to queue the operation" race as two gen2 siblings, but
          # printed no 409 line, so parse_409 couldn't see it was transient.
          parse_detailed() {
            grep -iE "had HTTP Error:" \
              | grep -oiE "/functions/[A-Za-z0-9_-]+" \
              | sed 's#/functions/##' \
              | sort -u
          }

          max=2            # one full deploy + one quick retry of the failed set
          attempt=0
          code=0
          out=""
          while : ; do
            attempt=$((attempt + 1))
            echo "::group::Firebase deploy attempt ${attempt}/${max} (--only ${only})"
            set +e
            out=$(npx firebase-tools@latest deploy \
              --only "${only}" \
              --non-interactive \
              --project examsprepzambia \
              --force 2>&1)
            code=$?
            set -e
            echo "${out}"
            echo "::endgroup::"

            failed=$(printf '%s\n' "${out}" | parse_failed) || true
            # Stop once the deploy is clean, or after the final attempt.
            if { [ "${code}" -eq 0 ] && [ -z "${failed}" ]; } || [ "${attempt}" -ge "${max}" ]; then
              break
            fi

            # Narrow the retry to ONLY the functions that just failed. (If the
            # failure wasn't function-specific — e.g. a firestore.rules error —
            # failed is empty, so we retry the original target as-is.)
            if [ -n "${failed}" ]; then
              only=$(printf '%s\n' "${failed}" | sed 's/^/functions:/' | paste -sd, -)
            fi
            echo "Deploy reported failure(s); retrying [--only ${only}] in 30s…"
            sleep 30
          done

          # ---- Classify the final attempt's result -------------------------
          failed=$(printf '%s\n' "${out}" | parse_failed) || true

          if [ -z "${failed}" ]; then
            if [ "${code}" -eq 0 ]; then
              echo "Firebase deploy clean — all targets deployed."
              exit 0
            fi
            # Detect a 401 authentication failure specifically — this is the
            # pattern produced when the FIREBASE_TOKEN has been revoked by a
            # Google account security event (password change, sign-out, etc.)
            # or when the service account key is missing/invalid.
            if printf '%s\n' "${out}" | grep -qi "HTTP Error: 401\|invalid authentication credentials\|authentication.*credential"; then
              echo "::error::Firebase deploy failed with an authentication error (HTTP 401)."
              echo "::error::The FIREBASE_TOKEN may have been revoked by a Google account security event (password change, suspicious sign-in, etc.). Fix options:"
              echo "::error::  1. (Preferred) Add a FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON secret — a service-account key is not tied to a personal account and cannot be revoked this way. See DEPLOY.md."
              echo "::error::  2. (Legacy) Rotate the token: npx firebase-tools@latest login:ci → update the FIREBASE_TOKEN secret at Settings > Secrets and variables > Actions."
            else
              echo "::error::Firebase deploy exited ${code} with no per-function failure markers — likely a firestore.rules / indexes / storage or CLI error. See the log above."
            fi
            exit 1
          fi

          # Split the remaining failures: cosmetic 409 races vs. everything else.
          # Cosmetic = the "unable to queue the operation" race + the idempotent
          # "Resource already exists" create race. Both complete server-side, so
          # they must not fail the job (or they permanently block Hosting behind
          # a false-red Firebase deploy).
          cosmetic=$(printf '%s\n' "${out}" | parse_409) || true
          existing=$(printf '%s\n' "${out}" | parse_already_exists) || true

          # Bare gen1 failures during a live "unable to queue" race.
          #
          # A gen1 function (e.g. setUserRole) surfaces a transient 409 as only
          # "failed to update function .../functions/NAME" — no "HTTP Error: 409"
          # line — so parse_409 can't classify it and it looks non-transient.
          # But the "unable to queue the operation" race is SYSTEMIC: Cloud
          # Functions throttles concurrent operations project-wide, so when it
          # fires it hits an arbitrary handful of the ~90 functions in one batch.
          # If parse_409 already found that race in this same deploy, a co-failing
          # function that reported NO error detail at all (in parse_failed but not
          # parse_detailed) is overwhelmingly the same race, not a real error —
          # gen2 siblings just happened to print the 409 it didn't. So treat those
          # bare failures as cosmetic ONLY when the race is demonstrably present.
          # A genuine gen1 error still fails closed: with no "unable to queue"
          # line anywhere in the output, `race` is empty and bare stays genuine.
          race=$(printf '%s\n' "${out}" | parse_409) || true
          bare=""
          if [ -n "${race}" ]; then
            detailed=$(printf '%s\n' "${out}" | parse_detailed) || true
            # Both inputs must be sorted for comm. parse_failed / parse_detailed
            # already end in `sort -u`, but sort at the call site too so the
            # invariant is local and obvious (a mis-sorted first input would let
            # comm silently misclassify a genuine failure as a bare/cosmetic one).
            bare=$(comm -23 <(printf '%s\n' "${failed}" | grep -v '^$' | sort -u) <(printf '%s\n' "${detailed}" | grep -v '^$' | sort -u) || true)
          fi

          cosmetic=$(printf '%s\n' "${cosmetic}" "${existing}" "${bare}" | grep -v '^$' | sort -u) || true
          if [ -z "${cosmetic}" ]; then
            genuine="${failed}"
          else
            genuine=$(comm -23 <(printf '%s\n' "${failed}") <(printf '%s\n' "${cosmetic}") || true)
          fi

          if [ -n "${genuine}" ]; then
            echo "::error::Firebase deploy failed for function(s) with a non-transient error (NOT the cosmetic 409 race) — these may be running stale code:"
            printf '%s\n' "${genuine}" | sed 's/^/::error::  failed: /'
            exit 1
          fi

          # Everything left is a cosmetic 409 — the "unable to queue the
          # operation" race (gen2 with a 409 line, or a bare gen1 failure during
          # that same race) or the idempotent "Resource already exists" create
          # race. All complete server-side, so downgrade to a warning rather than
          # block a green check. (Follow-up: a verify-by-state step gated on a
          # read-only cloudfunctions.viewer service-account key will confirm each
          # of these is ACTIVE with a fresh updateTime.)
          echo "::warning::Firebase deploy hit a cosmetic 409 (transient 'unable to queue the operation' — incl. bare gen1 failures during that race — and/or idempotent 'already exists') on the function(s) below. These operations complete server-side, so this is treated as non-fatal:"
          printf '%s\n' "${cosmetic}" | sed 's/^/::warning::  cosmetic-409: /'
          echo "Firebase deploy complete (some functions finished via the async 409 path)."
