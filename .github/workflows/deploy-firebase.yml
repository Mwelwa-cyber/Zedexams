name: Deploy Firebase

# Runs automatically on every push to main that touches any Firebase-related
# file. Also supports manual runs from the Actions tab (workflow_dispatch).
#
# Auth — provide ONE of these GitHub repository secrets (see DEPLOY.md):
#   FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON — (preferred) JSON key of a service
#                                          account in the examsprepzambia
#                                          project with the Firebase Admin +
#                                          Service Account User roles. Used via
#                                          GOOGLE_APPLICATION_CREDENTIALS — the
#                                          non-deprecated auth path, and immune
#                                          to the personal-account security
#                                          events that revoke login:ci tokens
#                                          (which is what broke every deploy on
#                                          2026-07-12).
#   FIREBASE_TOKEN                       — (legacy fallback) `firebase login:ci`
#                                          token. Still works but firebase-tools
#                                          warns it is going away, and it dies
#                                          whenever the issuing Google account
#                                          has a password change/security event.
#
# The Vite frontend deploys separately via the sibling `deploy-hosting.yml`
# workflow. This one only handles Firebase: Firestore rules + indexes,
# Storage rules, and Cloud Functions.

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - firestore
          - functions
          - storage

# Prevent two deploys running over each other.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fail-fast: one full deploy plus a single quick retry of any functions that
    # report a transient failure.
    #
    # This cap is DERIVED, not guessed, and `npm run test:deploy-timeouts`
    # fails the build if it stops covering the work below it:
    #
    #   ~5min  lint + test:all + both npm ci, before the deploy starts
    #   20min  attempt 1, the full deploy   (FIREBASE_ATTEMPT_TIMEOUT_MINUTES)
    #    1min  the backoff between attempts
    #    8min  attempt 2, narrowed to the failed functions
    #                                       (FIREBASE_RETRY_TIMEOUT_MINUTES)
    #   ~2min  the Storage-rules read-back and job teardown
    #   = 36 required; set to 40 so the budget is not sitting exactly on its
    #        own line — which is precisely the state that failed below.
    #
    # It was 20, and that was NOT enough for even ONE attempt: the pre-deploy
    # steps take a measured ~4min, leaving 16 for a full deploy of ~190
    # functions that measurably takes 15m29s. The last green run (#783,
    # 2026-08-20) finished with 23 SECONDS to spare; the very next one (#784,
    # the spelling merge) went 40s over and GitHub killed the job. A killed
    # job reports `cancelled`, deploy-hosting.yml correctly refuses to ship a
    # frontend over functions that may not have landed, and production stays
    # on the previous commit. Nothing in the deploy was wrong — the budget was.
    #
    # Raising this cascades into deploy-hosting.yml, which WAITS for this run:
    # its FIREBASE_DEPLOY_TIMEOUT_SECONDS and its own job cap both have to grow
    # with it. That is exactly the inequality test:deploy-timeouts enforces.
    timeout-minutes: 40

    # Explicit minimum permissions — some org settings restrict actions
    # unless this is stated explicitly.
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      # Stability gates — added 2026-05. Rules + functions deploys must
      # also pass the same lint + test suite as a hosting deploy. This
      # blocks a malformed firestore.rules or a regression in the quiz
      # importer / schema test from reaching production.
      - name: Lint
        run: npm run lint

      - name: Tests (importer + sanitize + schema)
        run: npm run test:all

      # The deploy verdict decides whether a functions deploy stands, and every
      # way it can be wrong is quiet — passing a stale function, or failing a
      # deploy that finished and thereby skipping the Hosting deploy behind it.
      # Prove it before trusting it, the same way the visual gate does.
      - name: Test the deploy-log classifier
        run: npm run test:deploy-log

      - name: Install function dependencies
        working-directory: functions
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Service-account auth (preferred) with a fallback to the legacy
      # login:ci token — same convention as android-release.yml. The SA path
      # exports GOOGLE_APPLICATION_CREDENTIALS via GITHUB_ENV so the deploy
      # step below picks it up automatically.
      - name: Set up Firebase deploy credentials
        env:
          FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON:-}" ]; then
            creds="$RUNNER_TEMP/firebase-deploy-sa.json"
            printf '%s' "$FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON" > "$creds"
            chmod 600 "$creds"
            # Fail fast on a mangled paste rather than with an opaque auth
            # error 10 minutes into the deploy.
            client_email=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("client_email",""))' "$creds") || {
              echo "::error::FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON is not valid JSON — re-paste the entire service-account key file."
              exit 1
            }
            if [ -z "$client_email" ]; then
              echo "::error::FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON parsed as JSON but has no client_email — is it really a service-account key?"
              exit 1
            fi
            echo "GOOGLE_APPLICATION_CREDENTIALS=$creds" >> "$GITHUB_ENV"
            echo "Deploying as service account: $client_email"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "::warning::Using the deprecated FIREBASE_TOKEN (login:ci) auth, which any security event on the issuing Google account revokes. Add the FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON secret to switch to the supported service-account path — see DEPLOY.md."
            echo "Token is present (length: ${#FIREBASE_TOKEN})"
          else
            echo "::error::Neither FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON nor FIREBASE_TOKEN secret is set."
            echo "::error::Preferred: create a service account (Firebase Admin + Service Account User roles), add a JSON key, and paste the whole file into FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON."
            echo "::error::Legacy: npx firebase-tools login:ci → FIREBASE_TOKEN."
            echo "::error::Add secrets at Settings > Secrets and variables > Actions. See DEPLOY.md for step-by-step instructions."
            exit 1
          fi

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.target }}" in
              all)        echo "only=firestore,storage,functions" >> "$GITHUB_OUTPUT" ;;
              firestore)  echo "only=firestore"                    >> "$GITHUB_OUTPUT" ;;
              functions)  echo "only=functions"                    >> "$GITHUB_OUTPUT" ;;
              storage)    echo "only=storage"                      >> "$GITHUB_OUTPUT" ;;
            esac
          else
            # On push, deploy everything. Path filters already ensure this
            # workflow only runs when a Firebase-relevant file changed.
            echo "only=firestore,storage,functions" >> "$GITHUB_OUTPUT"
          fi

      # Deploy once, fail fast, never trust a 0 exit code.
      #
      # Deploying the Gen 2 functions can make Cloud Functions return
      # "HTTP Error: 409, unable to queue the operation" for a handful of them.
      # firebase-tools LOGS those per-function failures but STILL EXITS 0 — so a
      # green deploy could silently leave functions running stale code. That is
      # exactly what bit the past-paper importer: #1418/#1425/#1427 all reported
      # a successful deploy while importPastPaperQuestions kept the old
      # 40-question cap. So we scan the output for the per-function failure
      # markers regardless of the exit code, retry only the failed set ONCE, and
      # then fail the job loudly listing anything unresolved — a green check
      # genuinely means "deployed".
      #
      # NOTE: when the 409 is widespread and sticky (a random handful failing on
      # every push for hours, even in tiny batches), it is NOT something this
      # workflow can fix — it is a server-side condition (stuck/pending Cloud
      # Functions operations, an exhausted operations quota, or a regional
      # incident). Throwing more retries / chunking at it from CI only ties up a
      # runner and submits more operations; we tried a 15-75s backoff (#1439), a
      # 2-4min backoff (#1445), and sequential chunking (#1446), and none
      # converged. So this step deliberately fails fast: one full deploy + one
      # quick retry of the failed set, then a loud failure that points at the
      # functions left stale, so the operator can clear the GCP-side backlog
      # (cancel stuck operations / check quota) rather than wait out a 40-minute
      # job that gets cancelled mid-deploy.
      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # Un-coloured, deterministic output so the failure-line parser below
          # never has to step around ANSI escape codes.
          NO_COLOR: "1"
          # Each ATTEMPT gets its own clock, so an over-running deploy fails
          # with a diagnosis instead of the job being killed under it. The job
          # cap above is derived from these two numbers plus the work around
          # them; test:deploy-timeouts holds them together.
          FIREBASE_ATTEMPT_TIMEOUT_MINUTES: "20"
          FIREBASE_RETRY_TIMEOUT_MINUTES: "8"
        run: |
          set -uo pipefail

          # When service-account auth is configured (GOOGLE_APPLICATION_CREDENTIALS
          # exported by the credentials step above), it must win: firebase-tools
          # prefers FIREBASE_TOKEN whenever it is set, which would silently keep
          # the deprecated (and revocable) token path alive.
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            unset FIREBASE_TOKEN
          fi

          only="${{ steps.target.outputs.only }}"

          # firebase-tools logs per-function failures and can still EXIT 0, so
          # the output is always scanned regardless of the exit code.
          #
          # Which functions actually still need work is decided by
          # scripts/deploy/functionsDeployLog.js, a tested module, NOT by a grep
          # over the output.
          #
          # The grep it replaces asked "does the failure text appear anywhere",
          # which is the wrong question: firebase-tools retries a throttled
          # operation ITSELF, inside one deploy, and prints both the failure and
          # the later success for the same function. On 2026-07-29 that read a
          # finished deploy as failed and skipped the Hosting deploy behind it
          # for 35 minutes. The module reads the log in ORDER — a function is
          # unresolved only when its LAST event is a failure — and keeps every
          # pre-existing 409 rule (queue race, idempotent "already exists", bare
          # gen1 during a live race) applied to what is genuinely still failing.
          # See functionsDeployLog.test.js, which enumerates the cases.
          classify() { node scripts/deploy/classifyFunctionsDeploy.mjs "$@"; }


          max=2            # one full deploy + one quick retry of the failed set
          attempt=0
          code=0
          out=""
          all_out=""       # accumulated across attempts — a first-attempt
                           # scheduler-trigger failure must survive the retry's
                           # "no changes detected" masking (see the fatal check).
          # The log is STREAMED through tee, not captured into `out=$(...)`.
          # Command substitution buffers the whole deploy and only prints it
          # once the command returns — so when run #784 hit the job cap, all
          # 16 minutes of output died with the process and the log read:
          #
          #     ::group::Firebase deploy attempt 1/2
          #     ##[error]The operation was canceled.
          #
          # Nothing about what was slow, which functions had landed, or whether
          # it was progressing at all. A deploy that cannot be watched cannot be
          # diagnosed, and a timeout is precisely when you need the tail.
          # tee gives the classifier the same bytes it had before while the
          # operator sees them live.
          logdir="${RUNNER_TEMP}/firebase-deploy-logs"
          mkdir -p "${logdir}"

          while : ; do
            attempt=$((attempt + 1))
            # Attempt 1 deploys everything; any retry is narrowed to the
            # functions still unresolved, so it needs far less wall clock.
            if [ "${attempt}" -eq 1 ]; then
              attempt_minutes="${FIREBASE_ATTEMPT_TIMEOUT_MINUTES}"
            else
              attempt_minutes="${FIREBASE_RETRY_TIMEOUT_MINUTES}"
            fi

            echo "::group::Firebase deploy attempt ${attempt}/${max} (--only ${only}, cap ${attempt_minutes}min)"
            logfile="${logdir}/attempt-${attempt}.log"
            set +e
            # --kill-after gives firebase-tools 30s to exit on TERM before KILL.
            timeout --kill-after=30s "${attempt_minutes}m" \
              npx firebase-tools@latest deploy \
              --only "${only}" \
              --non-interactive \
              --project examsprepzambia \
              --force 2>&1 | tee "${logfile}"
            code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            out=$(cat "${logfile}")
            all_out=$(printf '%s\n%s' "${all_out}" "${out}")

            # 124 is `timeout` reporting it killed the command (137 if it had to
            # escalate to KILL). This is NOT the transient per-function 409 the
            # retry below exists for, and retrying a full deploy that just ran
            # out of clock only submits more operations and ties up the runner
            # — the same dead end #1439/#1445/#1446 already proved. Stop here
            # and say so, with the log above intact.
            if [ "${code}" -eq 124 ] || [ "${code}" -eq 137 ]; then
              echo "::error::Firebase deploy attempt ${attempt} exceeded its ${attempt_minutes}-minute cap and was stopped. The streamed log above is the deploy up to that point — read its last lines to see what it was waiting on. If a clean deploy has simply grown past this budget, raise FIREBASE_ATTEMPT_TIMEOUT_MINUTES and the job's timeout-minutes together (test:deploy-timeouts enforces the relationship). If it is stuck, clear the GCP-side backlog: cancel pending Cloud Functions operations and check the operations quota."
              exit 1
            fi

            # Functions still unresolved after THIS attempt — a function that
            # failed and then succeeded within the attempt is already done, and
            # retrying it would spend more of the very mutation quota whose
            # exhaustion caused the failure.
            failed=$(printf '%s\n' "${out}" | classify --retry-set) || true
            # Stop once the deploy is clean, or after the final attempt.
            if { [ "${code}" -eq 0 ] && [ -z "${failed}" ]; } || [ "${attempt}" -ge "${max}" ]; then
              break
            fi

            # A failure with no per-function marker is not what the retry is
            # for. The retry exists for the transient Cloud Functions 409
            # ("unable to queue the operation"), which is per-function and
            # which the classifier can name. When it can name nothing, the
            # failure is a firestore.rules / indexes / storage / CLI error —
            # deterministic, and a second full deploy fails the same way ~16
            # minutes later. This used to retry the original target as-is;
            # that only mattered once per-attempt clocks existed, because the
            # retry would then blow its own (much smaller) cap and report a
            # timeout for what was really a rules error. Fail with the real
            # reason instead; workflow_dispatch re-runs it in one click if the
            # cause was genuinely transient.
            if [ -z "${failed}" ]; then
              break
            fi

            # Narrow the retry to ONLY the functions still unresolved.
            only=$(printf '%s\n' "${failed}" | sed 's/^/functions:/' | paste -sd, -)
            echo "Deploy reported unresolved failure(s); retrying [--only ${only}] in 30s…"
            sleep 30
          done

          # ---- Verdict ------------------------------------------------------
          # Handed EVERY attempt's output, in order. Two reasons it must be the
          # accumulated log rather than just the last attempt:
          #   • a first-attempt Cloud Scheduler upsert failure must survive the
          #     retry's "no changes detected" masking (that is how the backup
          #     checkers once shipped green-but-dead), and
          #   • a function the narrowed retry never mentions keeps whatever its
          #     last reported state was, which fails closed.
          # The verdict itself (order-aware resolution + the 409 rules + the
          # scheduler rule) lives in scripts/deploy/functionsDeployLog.js and is
          # tested; this step only decides WHAT to hand it.
          if ! printf '%s\n' "${all_out}" | classify --verdict; then
            exit 1
          fi

          # A non-function failure — firestore.rules, indexes, storage, or the
          # CLI itself — leaves no per-function marker for the classifier to
          # find, so a non-zero exit still has to be honoured here.
          if [ "${code}" -ne 0 ]; then
            # Detect a 401 authentication failure specifically — this is the
            # pattern produced when the FIREBASE_TOKEN has been revoked by a
            # Google account security event (password change, sign-out, etc.)
            # or when the service account key is missing/invalid.
            if printf '%s\n' "${out}" | grep -qi "HTTP Error: 401\|invalid authentication credentials\|authentication.*credential"; then
              echo "::error::Firebase deploy failed with an authentication error (HTTP 401)."
              echo "::error::The FIREBASE_TOKEN may have been revoked by a Google account security event (password change, suspicious sign-in, etc.). Fix options:"
              echo "::error::  1. (Preferred) Add a FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON secret — a service-account key is not tied to a personal account and cannot be revoked this way. See DEPLOY.md."
              echo "::error::  2. (Legacy) Rotate the token: npx firebase-tools@latest login:ci → update the FIREBASE_TOKEN secret at Settings > Secrets and variables > Actions."
            else
              echo "::error::Firebase deploy exited ${code} with no unresolved per-function failure — likely a firestore.rules / indexes / storage or CLI error. See the log above."
            fi
            exit 1
          fi

          echo "Firebase deploy clean — all targets deployed."

      # ---- Read back what production is actually enforcing (#2276) --------
      # Deploying storage.rules proves we sent it. It does not prove the live
      # ruleset still matches this repository: a rules edit made in the
      # Firebase console never reaches git, so there is no push, no deploy and
      # no signal at all, until an admin is denied a read that storage.rules
      # allows. That is #2276 -- and nothing anywhere compared the two.
      #
      # GET only. The only write to production in this workflow is still the
      # deploy above; this step reads the live ruleset back and compares it.
      # Authentication is that deploy's own service account, so there is no
      # second credential to provision or leak.
      #
      # A proven difference fails the job. "Could not check" does NOT:
      # deploy-hosting.yml waits on this workflow, so reporting an unanswered
      # question as drift would strand the frontend exactly the way the
      # grep-based deploy verdict did on 2026-07-29. Exit 2 is that third
      # state and it is a warning, not a failure.
      #
      # The comparison itself is scripts/deploy/storageRulesDrift.js, already
      # proven by the Tests step above (test:storage-rules-drift, picked up by
      # run-all-tests.mjs) before this step is trusted -- same reason the
      # deploy-log classifier is tested before the deploy relies on it.
      - name: Verify the deployed Storage rules match the repository
        if: contains(steps.target.outputs.only, 'storage')
        run: |
          set -uo pipefail

          code=0
          node scripts/check-storage-rules-drift.mjs || code=$?

          case "${code}" in
            0)
              ;;
            2)
              echo "::warning::Could not verify the deployed Storage rules - see the step summary. This is NOT a drift finding: the rules may well be correct, we were unable to read them back."
              ;;
            *)
              exit 1
              ;;
          esac
