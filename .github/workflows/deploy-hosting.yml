name: Deploy Hosting

# Builds the Vite frontend and deploys it to Firebase Hosting on every push
# to main. Replaces the Netlify deploy pipeline.
#
# Required repository secrets:
#
#   Firebase deploy auth — provide ONE of (see DEPLOY.md):
#   FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON — (preferred) service-account JSON key,
#                                           used via GOOGLE_APPLICATION_CREDENTIALS;
#                                           immune to the personal-account
#                                           security events that revoke login:ci
#                                           tokens (broke every deploy 2026-07-12)
#   FIREBASE_TOKEN                       — (legacy fallback) `firebase login:ci`
#
#   VITE_FIREBASE_API_KEY                — from your local .env
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_FIREBASE_MEASUREMENT_ID         — optional (analytics)
#   VITE_GOOGLE_MAPS_STATIC_KEY          — optional (Maps Static API; map-based games show a fallback if missing)
#   VITE_SENTRY_DSN                      — optional (error monitoring; without it the @sentry/react package is tree-shaken out of the build)
#   (VITE_APP_VERSION is NOT read here — vite.config.js sets it from package.json)
#   SENTRY_AUTH_TOKEN                    — optional (build-time source-map upload; org:releases + project:read/write scope). With SENTRY_ORG + SENTRY_PROJECT, hidden maps upload to Sentry then get stripped from dist/ so minified stack traces resolve to original JSX. Unset ⇒ no upload, build unchanged.
#   SENTRY_ORG                           — optional (Sentry org slug; required with SENTRY_AUTH_TOKEN)
#   SENTRY_PROJECT                       — optional (Sentry project slug; required with SENTRY_AUTH_TOKEN)
#   VITE_FIREBASE_VAPID_KEY              — optional (web-push public key from Firebase Console → Cloud Messaging → Web Push certificates; without it the in-app permission prompt no-ops and no FCM tokens are minted)
#
# The sibling `deploy-firebase.yml` workflow handles Firestore rules,
# Storage rules, and Cloud Functions. This one is hosting-only.

on:
  push:
    branches: [main]
    # Only skip paths that are unambiguously not part of the frontend build.
    paths-ignore:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "functions/**"
      - ".github/workflows/deploy-firebase.yml"
      - "**/*.md"
  workflow_dispatch:

# Kill in-flight builds when a newer commit lands so an older build can't
# overwrite a newer one (the race that bit us on Netlify).
concurrency:
  group: hosting-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Must outlast the Deploy Firebase run this job WAITS for, not just its own
    # work. Budget: ~4min lint+test+build+prerender, then up to 25min waiting on
    # deploy-firebase (its own cap is 20min plus queueing), then ~4min to deploy
    # Hosting. At 15 minutes the job was cancelled mid-wait whenever a functions
    # deploy ran long — which ships the API without the client that matches it,
    # the one skew direction that breaks users. scripts/test-deploy-timeouts.mjs
    # fails if this stops covering the wait window below.
    timeout-minutes: 40

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so the "Detect Firebase deploy dependency" step can
          # `git diff` against github.event.before — a shallow (depth-1)
          # checkout doesn't contain the before commit, which would make the
          # diff fail and silently mis-detect the change as hosting-only.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify required secrets
        env:
          FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY }}
        run: |
          missing=()
          # Deploy auth is satisfied by EITHER a service-account key
          # (preferred) OR the legacy login:ci token.
          if [ -z "$FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON" ] && [ -z "$FIREBASE_TOKEN" ]; then
            missing+=("FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON or FIREBASE_TOKEN")
          fi
          [ -z "$VITE_FIREBASE_API_KEY" ] && missing+=("VITE_FIREBASE_API_KEY")
          [ -z "$VITE_FIREBASE_AUTH_DOMAIN" ] && missing+=("VITE_FIREBASE_AUTH_DOMAIN")
          [ -z "$VITE_FIREBASE_PROJECT_ID" ] && missing+=("VITE_FIREBASE_PROJECT_ID")
          [ -z "$VITE_FIREBASE_STORAGE_BUCKET" ] && missing+=("VITE_FIREBASE_STORAGE_BUCKET")
          [ -z "$VITE_FIREBASE_MESSAGING_SENDER_ID" ] && missing+=("VITE_FIREBASE_MESSAGING_SENDER_ID")
          [ -z "$VITE_FIREBASE_APP_ID" ] && missing+=("VITE_FIREBASE_APP_ID")
          # App Check enforcement is ON for Cloud Storage (2026-08). Without
          # this key initAppCheck() returns early, the Storage write gate
          # fails open (it can only fail closed when App Check is CONFIGURED),
          # and every upload leaves carrying no attestation token — which an
          # enforced bucket answers with 401 "Firebase App Check token is
          # invalid", surfaced to the user as `storage/unauthorized`. That
          # breaks every upload path in the app (past papers, quiz images,
          # visual studio, branding, syllabus) while the deploy stays green,
          # so this is as load-bearing as the API key, not an optional extra.
          [ -z "$VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY" ] && missing+=("VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "::error::Add them at Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All required build-time secrets are set."

      # Service-account auth (preferred) with a fallback to the legacy
      # login:ci token — same convention as android-release.yml and
      # deploy-firebase.yml. The SA path exports GOOGLE_APPLICATION_CREDENTIALS
      # via GITHUB_ENV so the hosting deploy step below picks it up.
      - name: Set up Firebase deploy credentials
        env:
          FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::warning::Using the deprecated FIREBASE_TOKEN (login:ci) auth, which any security event on the issuing Google account revokes. Add the FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON secret to switch to the supported service-account path — see DEPLOY.md."
            exit 0
          fi
          creds="$RUNNER_TEMP/firebase-deploy-sa.json"
          printf '%s' "$FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON" > "$creds"
          chmod 600 "$creds"
          # Fail fast on a mangled paste rather than with an opaque auth error
          # after the full build + prerender.
          client_email=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("client_email",""))' "$creds") || {
            echo "::error::FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON is not valid JSON — re-paste the entire service-account key file."
            exit 1
          }
          if [ -z "$client_email" ]; then
            echo "::error::FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON parsed as JSON but has no client_email — is it really a service-account key?"
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$creds" >> "$GITHUB_ENV"
          echo "Deploying as service account: $client_email"

      - name: Install dependencies
        run: npm ci

      # Stability gates — added 2026-05. The same lint + test suite a
      # contributor would run locally now blocks every production deploy.
      # If either step fails the build never runs and nothing reaches
      # examsprepzambia.web.app. To run the same checks locally before
      # pushing: `npm run lint && npm run test:all`.
      - name: Lint
        run: npm run lint

      - name: Tests (importer + sanitize + schema)
        run: npm run test:all

      - name: Build
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID:     ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GOOGLE_MAPS_STATIC_KEY:      ${{ secrets.VITE_GOOGLE_MAPS_STATIC_KEY }}
          VITE_SENTRY_DSN:                  ${{ secrets.VITE_SENTRY_DSN }}
          # NOTE: VITE_APP_VERSION is no longer read from a secret — vite.config.js
          # sets it from package.json. The secret sat at 1.1.0 for months while the
          # repo's tags moved on, so every deploy shipped the same Sentry release id.
          # The secret can be deleted; leaving it set has no effect.
          #
          # The commit this shell was built from. It tells two shells apart during a
          # rollout hold, AND is what makes each deploy's Sentry release unique —
          # see src/utils/releaseName.js.
          VITE_BUILD_SHA:                   ${{ github.sha }}
          VITE_FIREBASE_VAPID_KEY:          ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY }}
          VITE_POSTHOG_KEY:                 ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST:                ${{ secrets.VITE_POSTHOG_HOST }}
          # Sentry source-map upload (build-time only — NOT VITE_ vars, so they
          # never enter the browser bundle). When all three are set the build
          # emits hidden maps, uploads them under release
          # zedexams@<package.json version>+<short sha>-production, then deletes
          # them from dist/
          # so nothing ships to the CDN. Unset ⇒ upload is skipped, build is
          # unchanged. See maybeSentryPlugin() in vite.config.js.
          SENTRY_AUTH_TOKEN:                ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:                       ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:                   ${{ secrets.SENTRY_PROJECT }}
        run: npm run build

      # Static prerendering (SEO) — snapshot the content-only public routes
      # (/pricing, /privacy, /terms, /blog + posts) to dist/<route>/index.html
      # so crawlers get real HTML + the correct per-route canonical on first
      # fetch. Boots the built app in the Chromium that `npm ci` downloaded
      # with puppeteer. The homepage stays the neutral SPA fallback on
      # purpose — see scripts/prerender.mjs. Fails the deploy if any route
      # renders an empty/crash shell or the wrong canonical.
      - name: Prerender public routes
        run: npm run prerender

      - name: Detect Firebase deploy dependency
        id: firebase_changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          # On a brand-new branch / first push, before is the all-zero SHA and
          # there is no prior commit to diff against.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Run the diff as its own command (not piped into grep) so that a
          # genuine git failure aborts the step under `set -e` instead of being
          # swallowed by the pipe and silently mis-reported as required=false.
          # fetch-depth: 0 above guarantees both endpoints are present.
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          if printf '%s\n' "$changed" | grep -Eq '^(firestore\.rules|firestore\.indexes\.json|storage\.rules|firebase\.json|\.firebaserc|functions/|\.github/workflows/deploy-firebase\.yml)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Deploy Firebase run
        if: steps.firebase_changes.outputs.required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 25min: deploy-firebase's job cap is 20min and it can sit queued for
          # a few more, so a shorter window here abandons a functions deploy
          # that was still going to succeed.
          FIREBASE_DEPLOY_TIMEOUT_SECONDS: "1500"
          FIREBASE_DEPLOY_POLL_SECONDS: "20"
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          timeout_seconds = int(os.environ["FIREBASE_DEPLOY_TIMEOUT_SECONDS"])
          poll_seconds = int(os.environ["FIREBASE_DEPLOY_POLL_SECONDS"])
          url = (
            f"https://api.github.com/repos/{repo}/actions/workflows/"
            f"deploy-firebase.yml/runs?head_sha={sha}&event=push&per_page=5"
          )
          headers = {
            "Authorization": "Bearer " + token,
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          }

          deadline = time.time() + timeout_seconds
          while time.time() < deadline:
            req = urllib.request.Request(url, headers=headers)
            try:
              with urllib.request.urlopen(req, timeout=30) as response:
                payload = json.load(response)
            except urllib.error.HTTPError as err:
              # A 401/403/404 here is configuration, not weather: it will still
              # be true in 25 minutes, so fail now and name the remedy instead
              # of burning the whole wait window to reach a timeout that
              # explains nothing.
              if err.code in (401, 403, 404):
                print(
                  f"::error::The Deploy Firebase run lookup returned {err.code}, "
                  "so this job cannot tell whether the functions deploy "
                  "succeeded. Grant this job `actions: read` in the workflow's "
                  "permissions block."
                )
                sys.exit(1)
              print(
                "::warning::Deploy Firebase run lookup failed with "
                f"{err.code} {err.reason}; retrying in {poll_seconds}s..."
              )
              time.sleep(poll_seconds)
              continue
            except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as err:
              print(
                f"::warning::Deploy Firebase run lookup failed ({err}); "
                f"retrying in {poll_seconds}s..."
              )
              time.sleep(poll_seconds)
              continue

            runs = payload.get("workflow_runs", [])
            if not runs:
              print(
                f"Deploy Firebase run not visible yet; retrying in {poll_seconds}s..."
              )
              time.sleep(poll_seconds)
              continue

            run = runs[0]
            status = run.get("status")
            conclusion = run.get("conclusion")
            print(
              f"Deploy Firebase run {run.get('id')} status={status} conclusion={conclusion}"
            )

            if status != "completed":
              time.sleep(poll_seconds)
              continue

            if conclusion == "success":
              print("Deploy Firebase completed successfully.")
              sys.exit(0)

            print(
              f"::error::Deploy Firebase concluded with '{conclusion}'. "
              "Skipping Hosting deploy."
            )
            sys.exit(1)

          print("::error::Timed out waiting for Deploy Firebase to complete.")
          sys.exit(1)
          PY

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # When service-account auth is configured (GOOGLE_APPLICATION_CREDENTIALS
          # exported by the credentials step above), it must win: firebase-tools
          # prefers FIREBASE_TOKEN whenever it is set, which would silently keep
          # the deprecated (and revocable) token path alive.
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            unset FIREBASE_TOKEN
          fi
          # Stream output in real-time (visible in logs) AND write to a file so
          # we can grep it afterward. PIPESTATUS[0] gives firebase-tools' exit
          # code; tee always exits 0, so `set -e` won't abort the script here.
          npx firebase-tools@latest deploy \
            --only hosting \
            --non-interactive \
            --project examsprepzambia \
            --force 2>&1 | tee /tmp/firebase-deploy.log
          firebase_exit=${PIPESTATUS[0]}
          if [ "$firebase_exit" -ne 0 ] && grep -q "is the current active version" /tmp/firebase-deploy.log; then
            echo "Version already live — no-op deploy, treating as success."
            exit 0
          fi
          exit "$firebase_exit"
