name: Visual baseline update (reviewed)

# The ONLY way a committed visual baseline changes.
#
# Deliberately a separate workflow from visual-regression.yml rather than a flag
# on it. The comparison workflow runs on pull requests, which means it can run
# code from a fork; it must therefore never hold credentials capable of writing
# to the repository. This workflow can write, and so it is manual-only and never
# triggered by pull_request.
#
# ## A legitimate change still fails first
#
# That is the point of the design. A reviewer sees the visual gate fail, looks at
# the diff artefacts, decides the new appearance is correct, and then runs THIS
# workflow naming the fixture and the reason. The failure is the review
# prompt — it is not an obstacle to route around.
#
# ## What it will not do
#
#  - update more than the one fixture and one renderer family named,
#    EXCEPT in `scope: every-moved-baseline` (see below)
#  - update anything without a written reason and a source reference
#  - update a baseline whose fixture no longer validates
#  - update from an incomplete render
#  - push to main
#
# ## The sweep, and why it does not reopen the hole
#
# A change that legitimately moves EVERY fixture — the paper's header wording,
# the Word export's margins — turns the one-fixture rule into sixteen dispatches
# and sixteen pull requests, which the bootstrap validator already names, in
# those words, as "how a gate ends up permanently red".
#
# `scope: every-moved-baseline` re-records them in one run, and what replaces the
# one-fixture rule is three conditions the recorder enforces
# (validateSweepUpdateRequest / assertBaselineDestination):
#
#  - it REQUIRES a pull request number, and commits the baselines to that pull
#    request's own branch. The new appearance is still reviewed — alongside the
#    code change that caused it, which tells a reviewer more than a standalone
#    baseline pull request, where changed pixels arrive with no explanation of
#    what moved them.
#  - it refuses to write to the default branch, so branch protection still
#    applies to the result.
#  - reason and source stay required and unchanged.
#
# The result is a branch and a pull request, so a baseline change is reviewed
# like any other change. A baseline committed without review is indistinguishable
# from a regression that nobody noticed.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'One baseline, or every baseline this change moved'
        required: true
        default: one-baseline
        type: choice
        options:
          - one-baseline
          - every-moved-baseline
      pull_request:
        description: 'PR number the baselines belong to. REQUIRED for every-moved-baseline; that is where they are reviewed.'
        required: false
        type: string
      fixture:
        description: 'Fixture ID (e.g. vr-003). Required for one-baseline; narrows a sweep.'
        required: false
        type: string
      family:
        description: 'Renderer family. Required for one-baseline; narrows a sweep.'
        required: false
        type: choice
        options:
          - ''
          - browser-print
          - docx
          # NOT `screen` yet. Replacing an approved baseline goes through the
          # sweep path (`validateSweepUpdateRequest`, `--allow-failure`, the
          # before/after audit record), and none of that is routed to the
          # screen runner. An option that reached an unrouted path would
          # silently record nothing while reporting success, which is worse
          # than its absence. Screen baselines are BOOTSTRAP-only until that
          # path exists — and a baseline that does not exist cannot be
          # replaced, so nothing is currently blocked by this.
      reason:
        description: 'Why is the new appearance correct? Recorded in the commit.'
        required: true
        type: string
      source:
        description: 'PR number or commit that produced the change'
        required: true
        type: string

concurrency:
  # Shared with visual-baseline-bootstrap.yml: two runs writing to
  # tests/visual/baselines at once would each branch from a tree the other was
  # changing, and the loser's pull request would quietly drop the winner's pages.
  group: visual-baseline-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Re-record one baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Writing is scoped to this job, which only a maintainer can start.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A branch, never main. Branch protection applies to the result.
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Explicit, because ci.yml skips the puppeteer browser download globally and
      # a copied-in default would silently leave this job with no browser. The gate
      # renders with the browser puppeteer downloads here, and records ITS version.
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "false"
        run: npm ci

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation

      - name: Validate the fixture(s) before re-recording
        run: |
          if [ "${{ inputs.scope }}" = "every-moved-baseline" ] && [ -z "${{ inputs.fixture }}" ]; then
            node scripts/visual/validateFixtures.mjs
          else
            node scripts/visual/validateFixtures.mjs --fixture="${{ inputs.fixture }}"
          fi

      # Compare BEFORE replacing, so the audit record can state what changed
      # rather than only that something was replaced.
      #
      # Allowed to fail, for two reasons: a difference is the normal case here
      # (that is why the run was started), and the FIRST recording of a fixture
      # has nothing to compare against — the comparison refuses to invent a
      # baseline, which is correct and must not stop the recording.
      - name: Record what is changing
        continue-on-error: true
        run: |
          node scripts/visual/runVisualGate.mjs \
            --mode=compare \
            --fixture="${{ inputs.fixture }}" \
            --family="${{ inputs.family }}" \
            --allow-failure

      - name: Re-record the selected baseline(s)
        run: |
          ARGS=(--mode=update --reason="${{ inputs.reason }}" --source="${{ inputs.source }}")
          if [ -n "${{ inputs.fixture }}" ]; then ARGS+=(--fixture="${{ inputs.fixture }}"); fi
          if [ -n "${{ inputs.family }}" ]; then ARGS+=(--family="${{ inputs.family }}"); fi
          if [ "${{ inputs.scope }}" = "every-moved-baseline" ]; then
            # The recorder re-checks every one of these itself; passing them is
            # not what authorises the sweep, validateSweepUpdateRequest is.
            ARGS+=(--sweep --pull-request="${{ inputs.pull_request }}" --branch="${{ github.ref_name }}")
          fi
          node scripts/visual/runVisualGate.mjs "${ARGS[@]}"

      - name: Upload the before/after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-update-${{ inputs.fixture }}-${{ inputs.family }}-${{ github.run_id }}
          path: tests/visual/output/**
          retention-days: 30
          if-no-files-found: warn

      # A SWEEP commits to the branch it was dispatched against — the pull
      # request whose change moved the baselines. That is where they get
      # reviewed, next to the diff that explains them. The recorder has already
      # refused the default branch (assertBaselineDestination), so this can only
      # ever be a feature branch; the guard is repeated here because a step that
      # pushes should not rely on a previous step having checked.
      - name: Commit the baselines to this pull request's branch
        if: inputs.scope == 'every-moved-baseline'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "${{ github.event.repository.default_branch }}" ]; then
            echo "Refusing to push baselines to the default branch."
            exit 1
          fi
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add tests/visual/baselines
          if git diff --cached --quiet; then
            echo "The baselines already match this render — nothing to update."
            exit 0
          fi
          git commit -m "Visual baselines: re-recorded for #${{ inputs.pull_request }}

          Reason: ${{ inputs.reason }}
          Source: ${{ inputs.source }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Recorded in one sweep because this change moves every fixture. The new
          appearance is reviewed on #${{ inputs.pull_request }}, alongside the
          code change that caused it."
          git push origin HEAD:"$BRANCH"
          echo "Pushed to $BRANCH."
          echo
          echo "The visual gate will NOT start by itself on this commit. A push made"
          echo "with GITHUB_TOKEN does not trigger workflows (GitHub's loop"
          echo "prevention), and on a bot-authored pull request the run that does"
          echo "appear lands in action_required until a maintainer approves it."
          echo
          echo "So do ONE of these, or the baselines sit unverified:"
          echo "  - press 'Approve and run workflows' on pull request #${{ inputs.pull_request }}, or"
          echo "  - push any further commit to $BRANCH from a normal account."

      - name: Open a pull request for the baseline change
        if: inputs.scope != 'every-moved-baseline'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="baseline/${{ inputs.fixture }}-${{ inputs.family }}-${{ github.run_id }}"
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git checkout -b "$BRANCH"
          git add tests/visual/baselines
          # Nothing to commit is a legitimate outcome: the appearance already
          # matched. Reported rather than forced into an empty commit.
          if git diff --cached --quiet; then
            echo "The baseline already matches this render — nothing to update."
            exit 0
          fi
          git commit -m "Visual baseline: ${{ inputs.fixture }} (${{ inputs.family }})

          Reason: ${{ inputs.reason }}
          Source: ${{ inputs.source }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Only this fixture and this renderer family were re-recorded."
          git push -u origin "$BRANCH"

          # The review sheet is BUILT BY THE RECORDER, not assembled here: a
          # reviewer approving a paper's first appearance needs the environment,
          # the page count, the anchor map, the figure proof and the file hashes
          # in front of them, and a shell heredoc is where such a list quietly
          # loses an item. See writeBaselineSummary in runVisualGate.mjs.
          BODY=tests/visual/output/baseline-summary.md
          if [ ! -f "$BODY" ]; then
            echo "The recorder produced no review sheet, so this baseline cannot be reviewed."
            exit 1
          fi
          {
            echo ""
            echo "**Audit:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Only this fixture and family were touched; every other baseline is unchanged."
          } >> "$BODY"
          gh pr create \
            --title "Visual baseline: ${{ inputs.fixture }} (${{ inputs.family }})" \
            --body-file "$BODY" \
            --base main \
            --head "$BRANCH" \
            --draft
