name: Android Release (App Distribution)

# Builds a SIGNED release Capacitor APK and ships it to Firebase App
# Distribution. Replaces the old debug-beta workflow.
#
# Triggers
#   - Push of a release tag matching v*.*.*  (e.g. v1.1.2)
#   - Manual run from the Actions tab (workflow_dispatch) with a
#     release-notes input — useful for a hotfix without bumping the tag
#
# Required repository secrets
#   FIREBASE_ANDROID_APP_ID              — App ID for the Android app in
#                                           Firebase, looks like
#                                           1:NNNNNNNNNN:android:HEX.
#
#   Firebase App Distribution auth — service-account only. Provide ONE of:
#   FIREBASE_APPDIST_SERVICE_ACCOUNT_JSON — (optional override) the JSON key of a
#                                           dedicated service account, if you
#                                           ever want App Distribution on its own
#                                           narrowly-scoped identity.
#   FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON  — (default) the same key deploy-*.yml
#                                           already uses. `roles/firebase.admin`
#                                           on that account is a strict superset
#                                           of `roles/firebaseappdistro.admin`
#                                           (all six firebaseappdistro.*
#                                           permissions included), so no extra
#                                           IAM grant is needed.
#
#   FIREBASE_TOKEN is NO LONGER USED here. It was a `firebase login:ci` token —
#   user-scoped, never-expiring, with no key id to age and no coverage in
#   Policy Analyzer, logged as the human who minted it. This workflow was its
#   last consumer; removing it is what lets that credential be revoked.
#
#   NOTE: App Distribution must be ONBOARDED for the app first — open the
#   Firebase console → App Distribution → "Get started" once, and create a
#   tester group matching APP_DISTRIBUTION_GROUPS (default `testers`).
#   Until then, distribution fails with "could not find your app …"; the
#   signed APK artifact is still produced (this step is non-fatal).
#   VITE_FIREBASE_API_KEY                — same .env values used by the
#   VITE_FIREBASE_AUTH_DOMAIN              hosting build; baked into the
#   VITE_FIREBASE_PROJECT_ID               JS bundle that runs inside
#   VITE_FIREBASE_STORAGE_BUCKET           the Capacitor WebView
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_FIREBASE_MEASUREMENT_ID         — optional
#   VITE_GOOGLE_MAPS_STATIC_KEY          — optional
#
#   ZED_RELEASE_KEYSTORE_BASE64          — base64 of your release
#                                           keystore (.keystore / .jks).
#                                           See docs/ANDROID-RELEASE.md.
#   ZED_RELEASE_STORE_PASSWORD           — keystore password
#   ZED_RELEASE_KEY_ALIAS                — key alias inside the keystore
#                                           (typically "zedexams")
#   ZED_RELEASE_KEY_PASSWORD             — password for that key
#
# Optional repository variables
#   APP_DISTRIBUTION_GROUPS              — comma-separated tester groups
#                                           (defaults to `testers`).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes shown to testers"
        required: false
        default: "Release build from manual workflow dispatch"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so android/app/build.gradle can derive
          # versionCode from `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Verify required secrets
        env:
          FIREBASE_APPDIST_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_APPDIST_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          ZED_RELEASE_KEYSTORE_BASE64: ${{ secrets.ZED_RELEASE_KEYSTORE_BASE64 }}
          ZED_RELEASE_STORE_PASSWORD: ${{ secrets.ZED_RELEASE_STORE_PASSWORD }}
          ZED_RELEASE_KEY_ALIAS: ${{ secrets.ZED_RELEASE_KEY_ALIAS }}
          ZED_RELEASE_KEY_PASSWORD: ${{ secrets.ZED_RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          # App Distribution auth is a service-account key: a dedicated one if
          # you have wired it, otherwise the deploy key the other workflows use.
          if [ -z "$FIREBASE_APPDIST_SERVICE_ACCOUNT_JSON" ] && [ -z "$FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON" ]; then
            missing+=("FIREBASE_APPDIST_SERVICE_ACCOUNT_JSON or FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON")
          fi
          [ -z "$FIREBASE_ANDROID_APP_ID" ] && missing+=("FIREBASE_ANDROID_APP_ID")
          [ -z "$VITE_FIREBASE_API_KEY" ] && missing+=("VITE_FIREBASE_API_KEY")
          [ -z "$VITE_FIREBASE_AUTH_DOMAIN" ] && missing+=("VITE_FIREBASE_AUTH_DOMAIN")
          [ -z "$VITE_FIREBASE_PROJECT_ID" ] && missing+=("VITE_FIREBASE_PROJECT_ID")
          [ -z "$VITE_FIREBASE_STORAGE_BUCKET" ] && missing+=("VITE_FIREBASE_STORAGE_BUCKET")
          [ -z "$VITE_FIREBASE_MESSAGING_SENDER_ID" ] && missing+=("VITE_FIREBASE_MESSAGING_SENDER_ID")
          [ -z "$VITE_FIREBASE_APP_ID" ] && missing+=("VITE_FIREBASE_APP_ID")
          [ -z "$ZED_RELEASE_KEYSTORE_BASE64" ] && missing+=("ZED_RELEASE_KEYSTORE_BASE64")
          [ -z "$ZED_RELEASE_STORE_PASSWORD" ] && missing+=("ZED_RELEASE_STORE_PASSWORD")
          [ -z "$ZED_RELEASE_KEY_ALIAS" ] && missing+=("ZED_RELEASE_KEY_ALIAS")
          [ -z "$ZED_RELEASE_KEY_PASSWORD" ] && missing+=("ZED_RELEASE_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "::error::Add them at Settings ▸ Secrets and variables ▸ Actions."
            echo "::error::See docs/ANDROID-RELEASE.md \"Releasing via CI\" for setup."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Capacitor CLI requires Node >= 22 (cap sync aborts on 20).
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Must match android/variables.gradle (compileSdk/targetSdk = 36).
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ZED_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/zedexams-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          # Sanity-check: a valid JKS/PKCS12 file is at least a few hundred
          # bytes. A tiny file usually means the secret got truncated or the
          # value wasn't base64.
          size=$(stat -c%s "$keystore")
          if [ "$size" -lt 256 ]; then
            echo "::error::Decoded keystore is only ${size} bytes — ZED_RELEASE_KEYSTORE_BASE64 looks invalid."
            exit 1
          fi
          echo "ZED_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Compute release version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "ZED_VERSION_NAME=$version" >> "$GITHUB_ENV"
            echo "Release versionName: $version"
          else
            echo "Manual dispatch — leaving ZED_VERSION_NAME at the build.gradle default."
          fi
          # versionCode: commit-timestamp minutes-since-epoch — the SAME source
          # the Play AAB workflow (android-play-release.yml) uses, so both signed
          # channels emit the IDENTICAL monotonic code for a given tag. Without
          # this, build.gradle falls back to the git commit count (~1.4k) while
          # the Play AAB uses ~29M; since Android only installs updates with a
          # strictly greater versionCode (docs/ANDROID-RELEASE.md), a tester who
          # already has the Play build could not install this Firebase APK.
          code=$(( $(git log -1 --format=%ct) / 60 ))
          echo "ZED_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Release versionCode: $code"

      - name: Build web bundle
        env:
          # Firebase config — required for the JS SDK to initialise on
          # app launch. Missing any of the first six causes a hard crash
          # before the login screen renders.
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID:     ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY:          ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY }}
          # Observability — both initialisers guard against an unset
          # value and degrade to no-op, but bake them in when present
          # so error reports tag the right release.
          VITE_SENTRY_DSN:                  ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION:                 ${{ secrets.VITE_APP_VERSION }}
          # The commit this shell was built from — same stamp deploy-hosting
          # applies, so assessment_engine_path's `build` distinguishes Android
          # shells instead of collapsing every installed release into 'dev'
          # (Codex P1 on #2159, r3734454514).
          VITE_BUILD_SHA:                   ${{ github.sha }}
          VITE_POSTHOG_KEY:                 ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST:                ${{ secrets.VITE_POSTHOG_HOST }}
          # External services
          VITE_GOOGLE_MAPS_STATIC_KEY:      ${{ secrets.VITE_GOOGLE_MAPS_STATIC_KEY }}
          # Sentry source-map upload (build-time only — NOT VITE_ vars, so they
          # never enter the bundle). Without all three, maybeSentryPlugin() in
          # vite.config.js returns no plugin and this build's frames stay
          # MINIFIED in Sentry even though VITE_SENTRY_DSN above makes it report
          # errors — which is exactly the gap this closes. Unset ⇒ upload
          # skipped, build unchanged; an upload failure is non-fatal
          # (errorHandler), so a symbol hiccup can't block a release.
          SENTRY_AUTH_TOKEN:                ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:                       ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:                   ${{ secrets.SENTRY_PROJECT }}
        run: npm run build

      # Firebase native config — required for @capacitor-firebase/authentication
      # (Google sign-in). Without it android/app/build.gradle skips the
      # google-services plugin, no default_web_client_id is generated, and
      # native Google sign-in can't mint a Firebase ID token. This is a
      # distributable build, so a MISSING or WRONG-package file is a HARD
      # failure — we refuse to ship a release where Google sign-in is broken.
      # (The debug-APK workflow stays warn-only so it can build with no secrets.)
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is unset — refusing to build a release without it (Google sign-in would be broken). Set it to the project's google-services.json."
            exit 1
          fi
          # The secret may be raw JSON or base64-encoded JSON; accept both.
          if printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d 2>/dev/null | grep -q '"project_info"'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          if ! grep -q '"project_info"' android/app/google-services.json; then
            echo "::error::GOOGLE_SERVICES_JSON did not decode to a valid google-services.json."
            exit 1
          fi
          # Guard against a stale/wrong file: the app's applicationId is
          # com.zedexams.android and the google-services Gradle plugin matches by
          # package name. A file for another package (e.g. the old
          # com.zedexams.app) would fail the Gradle build or silently omit the
          # OAuth client — catch it here with an actionable message.
          if ! python3 -c 'import json,sys; d=json.load(open("android/app/google-services.json")); n=[c.get("client_info",{}).get("android_client_info",{}).get("package_name") for c in d.get("client",[])]; sys.exit(0 if "com.zedexams.android" in n else 1)'; then
            echo "::error::google-services.json has no client for com.zedexams.android (likely the old com.zedexams.app file). Re-download it from the Firebase Android app for com.zedexams.android and update the GOOGLE_SERVICES_JSON secret."
            exit 1
          fi
          echo "google-services.json written for com.zedexams.android ($(stat -c%s android/app/google-services.json) bytes)."

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        env:
          ZED_RELEASE_STORE_FILE: ${{ env.ZED_RELEASE_STORE_FILE }}
          ZED_RELEASE_STORE_PASSWORD: ${{ secrets.ZED_RELEASE_STORE_PASSWORD }}
          ZED_RELEASE_KEY_ALIAS: ${{ secrets.ZED_RELEASE_KEY_ALIAS }}
          ZED_RELEASE_KEY_PASSWORD: ${{ secrets.ZED_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Expected APK not found at $apk"
            exit 1
          fi
          apksigner="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            # Fallback: pick whichever build-tools version is installed.
            apksigner="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          fi
          "$apksigner" verify --print-certs "$apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ github.ref_name }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Compose release notes
        id: notes
        env:
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_NOTES" ]; then
            notes="$INPUT_NOTES"
          else
            short_sha="${SHORT_SHA:0:7}"
            first_line="$(printf '%s' "$COMMIT_MSG" | head -n1)"
            notes="${REF_NAME} @ ${short_sha} — ${first_line}"
          fi
          {
            echo "value<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Distribute to Firebase App Distribution
        id: distribute
        # FAILS THE JOB. This used to be `continue-on-error: true`, on the
        # reasoning that the signed APK (uploaded in the step above, so still
        # produced either way) is the primary deliverable and a distribution
        # problem should only warn.
        #
        # What that actually bought was silence. The tester group has existed
        # since onboarding with two testers and a release count of ZERO — this
        # step has never once succeeded, and every failure was swallowed into a
        # warning inside a green run. A channel nobody could tell was broken is
        # worse than a red build: the APK is still attached to the run, so the
        # cost of failing here is a red tick, and the benefit is knowing.
        env:
          FIREBASE_APPDIST_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_APPDIST_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          GROUPS: ${{ vars.APP_DISTRIBUTION_GROUPS || 'testers' }}
          RELEASE_NOTES: ${{ steps.notes.outputs.value }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          # A dedicated App Distribution SA if one is wired, else the deploy SA
          # every other workflow already authenticates with. Both go through
          # GOOGLE_APPLICATION_CREDENTIALS; there is no --token path any more.
          if [ -n "${FIREBASE_APPDIST_SERVICE_ACCOUNT_JSON:-}" ]; then
            sa_json="$FIREBASE_APPDIST_SERVICE_ACCOUNT_JSON"
            source_secret="FIREBASE_APPDIST_SERVICE_ACCOUNT_JSON"
          else
            sa_json="$FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON"
            source_secret="FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON"
          fi
          creds="$RUNNER_TEMP/firebase-appdist-sa.json"
          printf '%s' "$sa_json" > "$creds"
          chmod 600 "$creds"
          # Name the identity in the log, as deploy-firebase.yml does. The
          # secret name is not the account name — FIREBASE_DEPLOY_SERVICE_
          # ACCOUNT_JSON holds a github-deploy@ key, not a firebase-deploy@ one,
          # and reasoning from the name alone gets that backwards.
          client_email=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("client_email",""))' "$creds") || {
            echo "::error::$source_secret is not valid JSON — re-paste the entire service-account key file."
            exit 1
          }
          if [ -z "$client_email" ]; then
            echo "::error::$source_secret parsed as JSON but has no client_email — is it really a service-account key?"
            exit 1
          fi
          echo "Distributing as service account: $client_email (from $source_secret)"
          export GOOGLE_APPLICATION_CREDENTIALS="$creds"
          npx -y firebase-tools@latest appdistribution:distribute "$apk" \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "$GROUPS" \
            --release-notes "$RELEASE_NOTES"

      - name: Report distribution outcome
        # The step above now fails the job, so this needs failure() to run at
        # all. It stays because the three usual causes are not obvious from
        # firebase-tools' own error text.
        if: ${{ failure() && steps.distribute.outcome == 'failure' }}
        run: |
          echo "::error title=Firebase App Distribution failed::The signed APK artifact is still available on this run. Usual causes: App Distribution not onboarded (Firebase console → App Distribution → \"Get started\"); the '${{ vars.APP_DISTRIBUTION_GROUPS || 'testers' }}' tester group missing; FIREBASE_ANDROID_APP_ID wrong; or the service account named in the step log lacking App Distribution access. See the 'Distribute to Firebase App Distribution' step log for the exact error."
