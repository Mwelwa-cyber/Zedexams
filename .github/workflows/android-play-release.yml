name: Android Play Release (AAB)

# Builds a SIGNED release Android App Bundle (.aab) for Google Play Console.
#
# This is the counterpart to android-release.yml: that workflow ships a
# debug-track APK to Firebase App Distribution (testers); THIS one produces
# the .aab artifact Play requires for its internal/closed/production tracks.
#
# What it does
#   1. Builds the web bundle + syncs Capacitor (same commit-derived versionCode
#      as every other build — git rev-list --count HEAD).
#   2. Runs `gradlew bundleRelease`, signed with the release keystore.
#   3. Verifies the AAB signature and prints the signer certificate.
#   4. Uploads the .aab as a downloadable workflow artifact (always).
#   5. OPTIONALLY publishes to a Play track via the Play Developer API — only
#      when you tick `upload_to_play` AND the PLAY_SERVICE_ACCOUNT_JSON secret
#      exists. Defaults to the `internal` track as a draft, so it can never
#      surprise-push to production. See docs/ANDROID-RELEASE.md.
#
# Trigger: manual only (workflow_dispatch). Never fires on a tag/push, so a
# routine merge can't accidentally ship to Play.
#
# Required secrets (already present — shared with android-release.yml):
#   ZED_RELEASE_KEYSTORE_BASE64, ZED_RELEASE_STORE_PASSWORD,
#   ZED_RELEASE_KEY_ALIAS, ZED_RELEASE_KEY_PASSWORD, VITE_FIREBASE_*.
#
# Optional secret (only for auto-upload):
#   PLAY_SERVICE_ACCOUNT_JSON — Google Play service-account key JSON with the
#   "Release to testing tracks" permission. Setup steps are in
#   docs/ANDROID-RELEASE.md → "Auto-upload to Play".

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName for this release (e.g. 1.1.2). Blank = build.gradle default."
        required: false
        default: ""
      upload_to_play:
        description: "Publish to Play after building? (needs PLAY_SERVICE_ACCOUNT_JSON)"
        type: boolean
        required: false
        default: false
      track:
        description: "Play track (only used when upload_to_play = true)"
        type: choice
        required: false
        default: internal
        options: [internal, alpha, beta, production]
      release_status:
        description: "Release status on the chosen track"
        type: choice
        required: false
        default: draft
        options: [draft, completed]

concurrency:
  group: android-play-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history so build.gradle can derive versionCode from
          # `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Verify required secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          ZED_RELEASE_KEYSTORE_BASE64: ${{ secrets.ZED_RELEASE_KEYSTORE_BASE64 }}
          ZED_RELEASE_STORE_PASSWORD: ${{ secrets.ZED_RELEASE_STORE_PASSWORD }}
          ZED_RELEASE_KEY_ALIAS: ${{ secrets.ZED_RELEASE_KEY_ALIAS }}
          ZED_RELEASE_KEY_PASSWORD: ${{ secrets.ZED_RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          for v in \
            VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID \
            ZED_RELEASE_KEYSTORE_BASE64 ZED_RELEASE_STORE_PASSWORD ZED_RELEASE_KEY_ALIAS ZED_RELEASE_KEY_PASSWORD; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "::error::Add them at Settings ▸ Secrets and variables ▸ Actions. See docs/ANDROID-RELEASE.md."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Must match android/variables.gradle (compileSdk/targetSdk = 36).
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ZED_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/zedexams-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          size=$(stat -c%s "$keystore")
          if [ "$size" -lt 256 ]; then
            echo "::error::Decoded keystore is only ${size} bytes — ZED_RELEASE_KEYSTORE_BASE64 looks invalid."
            exit 1
          fi
          echo "ZED_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Compute release version
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          if [ -n "$INPUT_VERSION_NAME" ]; then
            echo "ZED_VERSION_NAME=$INPUT_VERSION_NAME" >> "$GITHUB_ENV"
            echo "versionName override: $INPUT_VERSION_NAME"
          else
            echo "versionName: build.gradle default"
          fi

      - name: Build web bundle
        env:
          # Firebase config — required for the JS SDK to initialise on launch.
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID:     ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY:          ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY }}
          VITE_SENTRY_DSN:                  ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION:                 ${{ secrets.VITE_APP_VERSION }}
          VITE_POSTHOG_KEY:                 ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST:                ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_GOOGLE_MAPS_STATIC_KEY:      ${{ secrets.VITE_GOOGLE_MAPS_STATIC_KEY }}
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Build release AAB
        working-directory: android
        env:
          ZED_RELEASE_STORE_FILE: ${{ env.ZED_RELEASE_STORE_FILE }}
          ZED_RELEASE_STORE_PASSWORD: ${{ secrets.ZED_RELEASE_STORE_PASSWORD }}
          ZED_RELEASE_KEY_ALIAS: ${{ secrets.ZED_RELEASE_KEY_ALIAS }}
          ZED_RELEASE_KEY_PASSWORD: ${{ secrets.ZED_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify AAB signature
        run: |
          set -euo pipefail
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$aab" ]; then
            echo "::error::Expected AAB not found at $aab"
            exit 1
          fi
          jarsigner -verify "$aab" | head -1
          echo "Signer certificate (match this against Play ▸ App integrity ▸ Upload key):"
          unzip -p "$aab" 'META-INF/*.RSA' | keytool -printcert | grep -iE 'Owner:|SHA256:' || true

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-run${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Check Play upload prerequisites
        id: play
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event.inputs.upload_to_play }}" = "true" ] && [ -z "$PLAY_SA" ]; then
            echo "::warning::upload_to_play=true but PLAY_SERVICE_ACCOUNT_JSON is not set — skipping Play upload. The AAB artifact is still available above."
          fi

      - name: Publish to Google Play
        if: ${{ github.event.inputs.upload_to_play == 'true' && steps.play.outputs.ready == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.zedexams.android
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.release_status }}
