name: Android Play Release (AAB)

# Builds a SIGNED release Android App Bundle (.aab) for Google Play Console.
#
# Counterpart to android-release.yml (which ships a debug-track APK to Firebase
# App Distribution); THIS one produces the .aab Play needs for its
# internal/closed/production tracks, and can publish via the Play Developer API.
#
# Two ways to run:
#   • Push a tag  v*.*.*  → auto-builds and AUTO-PROMOTES to TESTERS: uploads to
#     the closed-testing `alpha` track as a LIVE (completed) release, versionName
#     from the tag (v1.2.3 → 1.2.3). (Note: a tag also triggers android-release.yml's
#     Firebase App Distribution build — both run.)
#   • Manual "Run workflow" (workflow_dispatch) → full control: pick the track
#     (incl. production), draft vs completed, optional staged-rollout fraction.
#
# Either way: the signed .aab is always saved as a downloadable artifact, the
# signature is verified, and versionCode is the git commit count (auto-incrementing).
#
# Required secrets (shared with android-release.yml):
#   ZED_RELEASE_KEYSTORE_BASE64, ZED_RELEASE_STORE_PASSWORD,
#   ZED_RELEASE_KEY_ALIAS, ZED_RELEASE_KEY_PASSWORD, VITE_FIREBASE_*.
# Required for any Play upload:
#   PLAY_SERVICE_ACCOUNT_JSON — service-account key with "Release to testing
#   tracks" (and Production, if you publish there). See docs/ANDROID-RELEASE.md.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName for this release (e.g. 1.1.2). Blank = build.gradle default."
        required: false
        default: ""
      version_code:
        description: "Override versionCode (integer). Blank = git commit count. Set this when re-running on the same commit — Play requires a unique, higher code."
        required: false
        default: ""
      upload_to_play:
        description: "Publish to Play after building? (needs PLAY_SERVICE_ACCOUNT_JSON)"
        type: boolean
        required: false
        default: false
      track:
        description: "Play track (only used when upload_to_play = true). alpha = Closed testing."
        type: choice
        required: false
        default: alpha
        options: [internal, alpha, beta, production]
      release_status:
        description: "draft = upload only (you roll out); completed = live to that track's testers/users"
        type: choice
        required: false
        default: draft
        options: [draft, completed]
      user_fraction:
        description: "Production staged-rollout fraction, e.g. 0.1 = 10% (track=production only; blank = full)"
        required: false
        default: ""

concurrency:
  group: android-play-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so build.gradle can derive versionCode from
          # `git rev-list --count HEAD`.
          fetch-depth: 0

      # Guard against shipping a STALE / OFF-main build to testers. The app
      # bundles dist/ at build time, so whatever commit is built is exactly
      # what testers run. A tag cut from an old local checkout or a
      # feature branch (not on main) silently ships old code — that's how
      # v1.2.2 pushed a July-2 build to the closed track. Fail fast unless the
      # build commit is on origin/main's history, and warn if it isn't the tip.
      - name: Guard — release commit must be current main
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # origin/main isn't fetched by a tag checkout — pull it so we can test ancestry.
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$SHA" origin/main; then
            behind=$(git rev-list --count "${SHA}..origin/main")
            if [ "$behind" -gt 0 ]; then
              echo "::warning::Release commit $SHA is on main but $behind commit(s) behind origin/main. If you meant the latest code, re-tag origin/main's HEAD (git checkout main && git pull && git tag <v> && git push origin <v>)."
            fi
            echo "✓ Release commit $SHA is on main (origin/main is $behind commit(s) ahead)."
          else
            echo "::error::Release ref '$REF_NAME' ($SHA) is NOT on main's history — refusing to build."
            echo "::error::This prevents a stale/off-main tag from shipping old code to testers. Cut the tag from an up-to-date main: git checkout main && git pull && git tag <version> && git push origin <version>."
            exit 1
          fi

      - name: Verify required secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          ZED_RELEASE_KEYSTORE_BASE64: ${{ secrets.ZED_RELEASE_KEYSTORE_BASE64 }}
          ZED_RELEASE_STORE_PASSWORD: ${{ secrets.ZED_RELEASE_STORE_PASSWORD }}
          ZED_RELEASE_KEY_ALIAS: ${{ secrets.ZED_RELEASE_KEY_ALIAS }}
          ZED_RELEASE_KEY_PASSWORD: ${{ secrets.ZED_RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          for v in \
            VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID \
            ZED_RELEASE_KEYSTORE_BASE64 ZED_RELEASE_STORE_PASSWORD ZED_RELEASE_KEY_ALIAS ZED_RELEASE_KEY_PASSWORD; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "::error::Add them at Settings ▸ Secrets and variables ▸ Actions. See docs/ANDROID-RELEASE.md."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Capacitor CLI requires Node >= 22 (cap sync aborts on 20).
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Must match android/variables.gradle (compileSdk/targetSdk = 36).
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ZED_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/zedexams-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          size=$(stat -c%s "$keystore")
          if [ "$size" -lt 256 ]; then
            echo "::error::Decoded keystore is only ${size} bytes — ZED_RELEASE_KEYSTORE_BASE64 looks invalid."
            exit 1
          fi
          echo "ZED_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Compute release parameters
        id: cfg
        # Inputs come in via env (never interpolated into the script) to avoid
        # any shell-injection from free-text fields.
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          IN_UPLOAD: ${{ github.event.inputs.upload_to_play }}
          IN_TRACK: ${{ github.event.inputs.track }}
          IN_STATUS: ${{ github.event.inputs.release_status }}
          IN_VERSION: ${{ github.event.inputs.version_name }}
          IN_FRACTION: ${{ github.event.inputs.user_fraction }}
          IN_VERSIONCODE: ${{ github.event.inputs.version_code }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            # Tag push → auto-promote to testers: closed (alpha) track, live, version from tag.
            upload=true; track=alpha; status=completed; version="${TAG#v}"; fraction=""; code=""
          else
            upload="${IN_UPLOAD:-false}"; track="${IN_TRACK:-alpha}"; status="${IN_STATUS:-draft}"
            version="${IN_VERSION:-}"; fraction="${IN_FRACTION:-}"; code="${IN_VERSIONCODE:-}"
          fi
          # versionCode: default to the COMMIT timestamp in minutes-since-epoch
          # when not explicitly overridden. Commit count (build.gradle's fallback)
          # is NOT monotonic across this repo's divergent histories — a tag on a
          # longer branch line can outrank a newer main commit. That is exactly
          # why v1.2.3 (code 1432, on main) failed to supersede the stale v1.2.2
          # (code 1439) already live on the track: "existing users cannot
          # upgrade". Commit-timestamp minutes only ever increase (committer dates
          # advance with each merge) and stay far under Play's 2,100,000,000
          # ceiling for centuries. Using the COMMIT time (not wall-clock) makes it
          # deterministic and IDENTICAL to the code the companion Firebase App
          # Distribution workflow (android-release.yml) derives for the same tag,
          # so a device can move between the two signed channels without hitting a
          # version downgrade.
          if [ -z "$code" ]; then
            code=$(( $(git log -1 --format=%ct) / 60 ))
          fi
          # Staged rollout only applies to production with a fraction; otherwise ignore it.
          if [ "$track" = "production" ] && [ -n "$fraction" ]; then
            status=inProgress
          else
            fraction=""
          fi
          {
            echo "upload=$upload"
            echo "track=$track"
            echo "status=$status"
            echo "user_fraction=$fraction"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "ZED_VERSION_NAME=$version" >> "$GITHUB_ENV"
          fi
          # Always set — `code` is now guaranteed non-empty (override or the
          # minutes-since-epoch default above), so CI never falls back to the
          # non-monotonic commit count.
          echo "ZED_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Effective release → upload=$upload track=$track status=$status fraction=${fraction:-<full>} versionName=${version:-<gradle default>} versionCode=$code"

      - name: Build web bundle
        env:
          # Firebase config — required for the JS SDK to initialise on launch.
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID:     ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY:          ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_RECAPTCHA_KEY }}
          VITE_SENTRY_DSN:                  ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION:                 ${{ secrets.VITE_APP_VERSION }}
          VITE_POSTHOG_KEY:                 ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST:                ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_GOOGLE_MAPS_STATIC_KEY:      ${{ secrets.VITE_GOOGLE_MAPS_STATIC_KEY }}
          # Sentry source-map upload (build-time only — NOT VITE_ vars, so they
          # never enter the bundle). Without all three, maybeSentryPlugin() in
          # vite.config.js returns no plugin and this build's frames stay
          # MINIFIED in Sentry even though VITE_SENTRY_DSN above makes it report
          # errors — which is exactly the gap this closes. Unset ⇒ upload
          # skipped, build unchanged; an upload failure is non-fatal
          # (errorHandler), so a symbol hiccup can't block a release.
          SENTRY_AUTH_TOKEN:                ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:                       ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:                   ${{ secrets.SENTRY_PROJECT }}
        run: npm run build

      # Firebase native config — required for @capacitor-firebase/authentication
      # (Google sign-in). Without it android/app/build.gradle skips the
      # google-services plugin, no default_web_client_id is generated, and
      # native Google sign-in can't mint a Firebase ID token. This is a
      # distributable build, so a MISSING or WRONG-package file is a HARD
      # failure — we refuse to ship a release where Google sign-in is broken.
      # (The debug-APK workflow stays warn-only so it can build with no secrets.)
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is unset — refusing to build a release without it (Google sign-in would be broken). Set it to the project's google-services.json."
            exit 1
          fi
          # The secret may be raw JSON or base64-encoded JSON; accept both.
          if printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d 2>/dev/null | grep -q '"project_info"'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          if ! grep -q '"project_info"' android/app/google-services.json; then
            echo "::error::GOOGLE_SERVICES_JSON did not decode to a valid google-services.json."
            exit 1
          fi
          # Guard against a stale/wrong file: the app's applicationId is
          # com.zedexams.android and the google-services Gradle plugin matches by
          # package name. A file for another package (e.g. the old
          # com.zedexams.app) would fail the Gradle build or silently omit the
          # OAuth client — catch it here with an actionable message.
          if ! python3 -c 'import json,sys; d=json.load(open("android/app/google-services.json")); n=[c.get("client_info",{}).get("android_client_info",{}).get("package_name") for c in d.get("client",[])]; sys.exit(0 if "com.zedexams.android" in n else 1)'; then
            echo "::error::google-services.json has no client for com.zedexams.android (likely the old com.zedexams.app file). Re-download it from the Firebase Android app for com.zedexams.android and update the GOOGLE_SERVICES_JSON secret."
            exit 1
          fi
          echo "google-services.json written for com.zedexams.android ($(stat -c%s android/app/google-services.json) bytes)."

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Build release AAB
        working-directory: android
        env:
          ZED_RELEASE_STORE_FILE: ${{ env.ZED_RELEASE_STORE_FILE }}
          ZED_RELEASE_STORE_PASSWORD: ${{ secrets.ZED_RELEASE_STORE_PASSWORD }}
          ZED_RELEASE_KEY_ALIAS: ${{ secrets.ZED_RELEASE_KEY_ALIAS }}
          ZED_RELEASE_KEY_PASSWORD: ${{ secrets.ZED_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify AAB signature
        run: |
          set -euo pipefail
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$aab" ]; then
            echo "::error::Expected AAB not found at $aab"
            exit 1
          fi
          jarsigner -verify "$aab" | head -1
          echo "Signer certificate (match this against Play ▸ App integrity ▸ Upload key):"
          unzip -p "$aab" 'META-INF/*.RSA' | keytool -printcert | grep -iE 'Owner:|SHA256:' || true

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab-run${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Check Play upload prerequisites
        id: play
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ steps.cfg.outputs.upload }}" = "true" ] && [ -z "$PLAY_SA" ]; then
            echo "::warning::Play upload requested but PLAY_SERVICE_ACCOUNT_JSON is not set — skipping. The AAB artifact is still available above."
          fi

      - name: Publish to Google Play
        if: ${{ steps.cfg.outputs.upload == 'true' && steps.play.outputs.ready == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.zedexams.android
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.cfg.outputs.track }}
          status: ${{ steps.cfg.outputs.status }}
          userFraction: ${{ steps.cfg.outputs.user_fraction }}
          # Release notes shown to testers in the Play Store "What's new"
          # panel. One file per listing language: distribution/whatsnew/
          # whatsnew-<lang> (<= 500 chars each). en-US is the store's default
          # listing language — add more files here to localise. If the notes'
          # language isn't an active listing language the Play API rejects the
          # upload, so keep this in sync with the Play Console listing.
          whatsNewDirectory: distribution/whatsnew
