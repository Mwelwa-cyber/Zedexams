# Dependabot — automated dependency + GitHub-Actions update PRs.
# Addresses production-readiness findings CICD-002 (dependency scanning) and
# CICD-007 (mutable action tags): Dependabot opens grouped update PRs weekly,
# and the `github-actions` ecosystem below keeps our third-party actions
# current (and, once any are SHA-pinned, bumps the pin deliberately).
#
# Scanning that *blocks* a merge on a newly-introduced critical prod vuln lives
# in ci.yml's `dependency-audit` job; Dependabot is the remediation half — it
# raises the PR that clears whatever the audit (or a new advisory) surfaces.
version: 2
updates:
  # Frontend / root package.json (the Vite SPA + all repo-level tooling).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Split low-risk patch/minor bumps into small, logically-related groups
      # so each PR is reviewable on its own — a single all-in-one group produced
      # a 38-package batch (closed #1870) that couldn't be reviewed or bisected.
      # A dependency lands in the FIRST group whose patterns match; the trailing
      # misc-minor-and-patch catch-all keeps everything else from splintering
      # into dozens of single-package PRs. Majors are never grouped here — they
      # come as their own PRs to be assessed individually.
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "react-router"
          - "react-router-dom"
          - "scheduler"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      firebase-sdk:
        applies-to: version-updates
        patterns:
          - "firebase"
          - "@firebase/*"
        update-types:
          - "minor"
          - "patch"
      build-tooling:
        applies-to: version-updates
        patterns:
          - "vite"
          - "vite-plugin-*"
          - "@vitejs/*"
          - "rollup"
          - "@rollup/*"
          - "rolldown"
          - "esbuild"
          - "@esbuild/*"
          - "postcss"
          - "autoprefixer"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "workbox-*"
        update-types:
          - "minor"
          - "patch"
      testing:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
          - "happy-dom"
          - "puppeteer"
        update-types:
          - "minor"
          - "patch"
      linting:
        applies-to: version-updates
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "eslint-config-*"
          - "globals"
          - "lint-staged"
          - "husky"
          - "prettier"
        update-types:
          - "minor"
          - "patch"
      editor:
        applies-to: version-updates
        patterns:
          - "@tiptap/*"
          - "prosemirror-*"
          - "katex"
          - "marked"
          - "dompurify"
        update-types:
          - "minor"
          - "patch"
      i18n:
        applies-to: version-updates
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
        update-types:
          - "minor"
          - "patch"
      observability:
        applies-to: version-updates
        patterns:
          - "@sentry/*"
          - "@sentry-internal/*"
          - "posthog-js"
        update-types:
          - "minor"
          - "patch"
      misc-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Firebase SDK majors are coordinated, breaking migrations (auth
      # persistence, App Check, Firestore cache) — never take them automatically.
      - dependency-name: "firebase"
        update-types: ["version-update:semver-major"]

  # Cloud Functions (functions/ has its own package.json + lockfile).
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "functions"
    groups:
      functions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # firebase-functions / firebase-admin majors change the runtime contract
      # (v2 triggers, region pinning) — take them deliberately, not automatically.
      - dependency-name: "firebase-functions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used across .github/workflows/ (CICD-007). Keeps third-party
  # actions (android-actions/setup-android, r0adkll/upload-google-play,
  # anthropics/*) current and surfaces upstream changes as reviewable PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "github-actions"
