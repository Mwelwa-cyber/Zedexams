name: "ZedExams CodeQL config"

# `security-extended` rather than the default `security` suite: this scanner
# REPLACED a per-PR AI security reviewer (#2295 made that opt-in), so the point
# is coverage, and its findings land in the Security tab rather than blocking a
# PR — a false positive costs a dismissal, a false negative costs a
# vulnerability. `security-and-quality` is deliberately NOT used: it folds in
# maintainability queries that have nothing to do with security and would bury
# the findings this exists to surface.
queries:
  - uses: security-extended

# Generated or build output only — plus one reference-document exception.
# Everything hand-written that SHIPS is scanned, including public/*.js
# (boot.js, sw-reload-clients.js and the messaging SW are real source, not
# vendored libraries) and scripts/ (they run in CI with repo credentials, so
# they are worth scanning, not less so).
#
# docs/learner holds the owner's design-pack prototypes: self-contained HTML
# mockups whose inline demo JS (innerHTML string concatenation throughout) is
# a reference artefact, never served or bundled — hosting ships dist/, built
# from src/ + public/. Scanning it files permanent "high" alerts against a
# document, and the weekly baseline then replays them onto unrelated PRs.
# test:codeql-scope pins this exclusion to exactly this directory.
paths-ignore:
  - android
  - dist
  - coverage
  - coverage-src
  - coverage-functions
  - docs/learner
