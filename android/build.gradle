// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // EVERY version in this block is a hardcoded literal, and has to be.
        // Gradle evaluates `buildscript {}` BEFORE the rest of the script
        // regardless of where it sits in the file, so `apply from:
        // "variables.gradle"` — wherever it is placed, above this block
        // included — has not run yet and `rootProject.ext` does not exist.
        // Referencing $someVersion here fails the build outright with
        // "Could not get unknown property". variables.gradle is for the
        // MODULE dependency blocks (app/build.gradle), which are evaluated
        // later; see firebaseCrashlyticsVersion there for the SDK half of
        // Crashlytics. Guarded by scripts/test-android-buildscript-versions.mjs.
        // AGP 9.0.1 — see android/gradle.properties for the two AGP-9
        // compatibility flags this upgrade required (android.newDsl,
        // android.r8.strictFullModeForKeepRules) and android/AGENTS.md for
        // the paired Gradle wrapper version (9.1.0, AGP 9.0's declared
        // minimum/default pairing).
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath 'com.google.gms:google-services:4.4.4'
        // Crashlytics Gradle plugin — uploads the R8 mapping file so release
        // crash reports symbolicate. Release builds run minifyEnabled +
        // shrinkResources, so WITHOUT this every native stack trace in the
        // console is obfuscated and effectively unreadable. Applied
        // conditionally in app/build.gradle (it requires google-services to
        // have run first).
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
