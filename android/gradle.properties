# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# R8 compatibility mode (NOT full mode).
#
# AGP 8 defaults android.enableR8.fullMode=true — an aggressive whole-program
# optimizer that does cross-class field/argument propagation. It cannot see
# that Capacitor invokes plugin methods REFLECTIVELY (Method.invoke on the
# "CapacitorPlugins" thread), so it wrongly concludes the write to
# com.getcapacitor.Plugin's `bridge` field is dead and eliminates it. The field
# is then null at runtime, and the first plugin call that dereferences it —
#   FirebaseMessagingPlugin.checkPermissions()
#     -> Plugin.checkPermissions() -> Plugin.getPermissionStates()
#     -> `return bridge.getPermissionStates(this)`   // bridge == null
# throws NullPointerException and crashes the app. The app calls the FCM
# plugin's checkPermissions() on sign-in (AuthContext -> refreshTokenIfGranted
# -> nativePush.checkPermissions), so the crash fires immediately after login;
# logged-out users never hit it. Release-only: debug builds use D8 (no R8).
#
# Compat mode still shrinks + obfuscates (minifyEnabled/shrinkResources stay
# on) — it just skips the reflection-hostile optimizations, which is the
# Capacitor-recommended setting. Do not set this back to true without a full
# signed-release smoke test of a logged-in session on a real device.
#
# This is independent of the AGP 9.0.1 upgrade below: AGP 9.0 does not change
# android.enableR8.fullMode's default (still false/compat), and R8 full mode
# stays off here regardless of AGP version until that device smoke test
# happens. scripts/test-android-release-config.mjs asserts this line stays
# `false` — it is not a knob to flip as part of an "enable full mode" task.
android.enableR8.fullMode=false

# Optimized resource shrinking (R8 treats resources as part of the same
# code/resource reference graph, instead of AAPT2's separate keep-rule pass —
# catches resources only reachable from already-dead code that basic
# shrinkResources leaves behind). Opt-in flag for AGP 8.12–8.13; AGP 9.0+
# applies it automatically whenever shrinkResources is true, so this becomes
# a no-op once fully on AGP 9, but is declared explicitly rather than relying
# on that implicit default. Works in R8 compatibility mode — it does not
# require android.enableR8.fullMode=true above.
android.r8.optimizedResourceShrinking=true

# ── AGP 9.0.1 compatibility flags ───────────────────────────────────────
#
# Both below are documented, official temporary opt-outs (not hacks) for two
# real, reported incompatibilities between AGP 9 and the exact
# firebase-crashlytics-gradle version this project pins (3.0.6, see
# android/build.gradle's buildscript block) — Crashlytics applies
# unconditionally whenever google-services.json exists, on every build type,
# so either failure mode reaches assembleDebug too, not just release:
#
#   1. Plugin construction fails outright — "Could not create plugin of type
#      'CrashlyticsPlugin' ... ApplicationAndroidComponentsExtension" — because
#      AGP 9's new DSL removes the old BaseExtension-shaped internals the
#      pinned plugin version casts to (firebase/firebase-android-sdk#7652).
#      android.newDsl=false keeps the pre-9.0 DSL surface available for
#      third-party plugins (google-services, firebase-crashlytics-gradle) that
#      haven't been rebuilt against the new one yet. This is a *temporary*
#      escape hatch — Google removes the ability to opt out in AGP 10.0 — so
#      revisit this once both plugins ship an AGP-9-native release.
#   2. Even past that, AGP 9's new default android.r8.strictFullModeForKeepRules
#      breaks Crashlytics initialisation on a signed release build with
#      `NullPointerException: FirebaseCrashlytics component is not present`
#      (firebase/firebase-android-sdk#7367) — reported against this same
#      plugin version. Setting it back to false is Firebase's own documented
#      workaround. Unrelated to android.enableR8.fullMode above: this fired
#      even with full mode off, because it governs R8's keep-rule handling
#      more broadly, not only the full-mode optimizer passes.
#
# Remove both once firebase-crashlytics-gradle (and google-services, which the
# AGP 9 migration guide names as needing an update too) publish a release that
# no longer needs them — re-test without the flags before deleting either.
android.newDsl=false
android.r8.strictFullModeForKeepRules=false

# A third, observed (not just documented) AGP 9 incompatibility: AGP 9.0
# defaults android.builtInKotlin=true, which auto-registers a `kotlin`
# extension on any module Gradle detects Kotlin sources in. That collides
# with a dependency module that still applies the classic
# `org.jetbrains.kotlin.android` plugin itself —
# node_modules/@capacitor-community/safe-area/android/build.gradle — and
# assembleDebug on this branch failed on exactly that:
#   > Failed to apply plugin 'kotlin-android'.
#   > Cannot add extension with name 'kotlin', as there is an extension
#     already registered with that name.
# (github.com/Mwelwa-cyber/Zedexams/actions/runs/33251988699, job
# build-debug-apk). The plugin's script throws before reaching its own
# `compileSdk` line, which is what the build's second, seemingly unrelated
# failure ("does not specify `compileSdk`") actually traces back to — one
# root cause, not two. android.builtInKotlin=false defers to the classic
# Kotlin Gradle Plugin exactly as AGP 8 did, which is what this app's own
# module tree already assumes (there is no Kotlin source directly in
# android/app/ — see AGENTS.md's "Never write Java/Kotlin" note — so this
# flag has nothing to disable there; it only affects dependency modules
# like this one). Revisit once @capacitor-community/safe-area (or
# Capacitor's own AGP-9 migration) stops applying the classic plugin.
android.builtInKotlin=false

# A fourth observed AGP 9 incompatibility, same dependency module, same
# pattern: AGP 9 defaults android.r8.proguardAndroidTxt.disallowed=true,
# removing support for the non-optimizing `proguard-android.txt` default
# (it bundles `-dontoptimize`, which blocks R8's optimizer passes — the AGP
# 9 migration guide's replacement is `proguard-android-optimize.txt`, which
# is what this app's own app/build.gradle already uses). Observed on this
# branch's second CI run:
#   Build file '.../node_modules/@capacitor-community/safe-area/android/
#   build.gradle' line: 38
#   > `getDefaultProguardFile('proguard-android.txt')` is no longer
#     supported since it includes `-dontoptimize` ...
# This is the dependency module's own consumer proguard config, not
# something this repo's build.gradle files reference — see the correct
# assertion of proguard-android-optimize.txt already pinned by
# scripts/test-android-release-config.mjs. Setting the flag back to false
# is the documented AGP-9 escape hatch until the plugin updates.
android.r8.proguardAndroidTxt.disallowed=false

# A fifth observed AGP 9 incompatibility, this time in a transitive AAR
# rather than a Capacitor plugin: AGP 9 defaults
# android.uniquePackageNames=true, enforcing that no two modules/libraries
# share an Android namespace. It fails the manifest merge on Google's own
# Cronet artifacts (pulled in transitively — likely via reCAPTCHA
# Enterprise and/or Play Integrity, neither of which this repo controls the
# internals of):
#   Namespace 'org.chromium.net' is used in multiple modules and/or
#   libraries: org.chromium.net:cronet-fallback:119.6045.31,
#   org.chromium.net:cronet-common:119.6045.31,
#   org.chromium.net:cronet-api:119.6045.31.
#   > Task :app:processDebugMainManifest FAILED
# There is nothing in this repo to fix — three sibling artifacts of the
# same third-party library intentionally share one namespace, which AGP 8
# tolerated. Reverting to that tolerance is the documented AGP-9 escape
# hatch; revisit once the Cronet/reCAPTCHA/Play-Integrity dependency chain
# ships namespace-unique artifacts (or AGP stops flagging same-library
# siblings as a conflict).
android.uniquePackageNames=false
