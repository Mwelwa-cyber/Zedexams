ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    // androidx.activity, androidx.appcompat and androidx.core were bumped to
    // 1.13.0 / 1.8.0 / 1.19.0 on 2026-08-29 (#2604) to chase a future
    // upstream fix for Play Console's "deprecated APIs for edge-to-edge"
    // pre-launch warning (setStatusBarColor/setNavigationBarColor/
    // LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES, traced to obfuscated
    // androidx.activity.* classes rather than any class in this app — see
    // the AGENTS.md note on this). That bump was never actually compiled:
    // no required CI check builds the Android project, and it landed after
    // the AGP 9.0.1 upgrade (#2603) had already been verified through three
    // real, CI-dispatched builds — all on the OLD trio below. The first real
    // release build after both changes (the v1.5.0 production cut,
    // 2026-09-07) failed `:app:checkReleaseAarMetadata`:
    // androidx.core:core(-ktx):1.19.0's own AAR metadata requires AGP 9.1.0+
    // and compileSdk 37, neither of which this project is on.
    //
    // Reverted to the trio AGP 9.0.1's three CI-verified builds actually
    // used. This is a straight revert, not a downgrade below anything ever
    // shipped: v1.4.0 (the last release actually published) built on these
    // same versions. The edge-to-edge warning is informational only — it was
    // already present (and accepted) on v1.4.0 — and Google has not yet
    // shipped an androidx.activity release that removes those calls anyway
    // (tracked upstream: https://github.com/flutter/flutter/issues/183349,
    // https://github.com/dotnet/maui/issues/26788), so the 2026-08-29 bump
    // bought nothing but an untested dependency graph. Re-attempting it
    // means bumping AGP to 9.1.0+ and compileSdk/targetSdk to 37 together,
    // verified by an actual dispatched build — not a version bump alone.
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // reCAPTCHA Enterprise Android SDK — mints per-action bot-score tokens
    // for sensitive flows (login/signup). Consumed by ZedExamsApplication +
    // RecaptchaPlugin; scored server-side by the assessRecaptcha function.
    // Pin >= 18.9.0 (earlier builds crash on iOS 27 beta; Android is fine
    // either way but stay current). See docs/RECAPTCHA-ENTERPRISE-SETUP.md.
    recaptchaVersion = '18.9.0'
    // Firebase Crashlytics — NATIVE crash + ANR reporting for the Capacitor
    // wrapper. Deliberately complementary to Sentry rather than overlapping
    // it: Sentry (src/utils/sentry.js) runs INSIDE the WebView and sees
    // JavaScript errors, which means it cannot see the two failure classes
    // that actually sink a Play Store listing — a native crash in the
    // wrapper/plugin layer, and an ANR, where the process is killed by the
    // platform and no JS handler ever runs. Those are also what Play Console
    // vitals grade a new listing on.
    //
    // Two artefacts, two coordinates — and only ONE of them can live here.
    // The SDK version below is read by app/build.gradle's dependencies block,
    // which is evaluated after this file is applied. The Gradle PLUGIN version
    // (which uploads the R8 mapping file so release stack traces are readable)
    // is a hardcoded literal in android/build.gradle's buildscript block,
    // because Gradle evaluates buildscript BEFORE applying this file — a
    // $variable there fails the build with "Could not get unknown property",
    // which is exactly how this shipped broken on 2026-08-16. Do not "tidy"
    // the plugin version into this file; scripts/test-android-buildscript-
    // versions.mjs fails the build if anyone does.
    //
    // The SDK carries NO user identifier: setUserId is never called, so a
    // report is a stack trace and device metadata, consistent with the
    // children's-privacy posture that keeps PostHog on identify:false for
    // learners.
    firebaseCrashlyticsVersion = '20.0.0'
    // @capacitor-firebase/authentication: ship the native Google sign-in
    // dependencies (play-services-auth, androidx.credentials, googleid) as
    // implementation instead of compileOnly. capacitor.config.json enables
    // the google.com provider and AuthContext's signInWithGoogleNative()
    // calls it, but without this flag the classes never reach the APK — the
    // plugin dies loading GoogleAuthProviderHandler and JS surfaces "Google
    // sign-in is not available in this app build". R8 (minified release)
    // also refuses to build at all while they're missing. The disabled
    // Facebook provider stays compileOnly; see the -dontwarn in
    // app/proguard-rules.pro.
    rgcfaIncludeGoogle = true
}