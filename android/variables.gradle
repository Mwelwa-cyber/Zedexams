ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // reCAPTCHA Enterprise Android SDK — mints per-action bot-score tokens
    // for sensitive flows (login/signup). Consumed by ZedExamsApplication +
    // RecaptchaPlugin; scored server-side by the assessRecaptcha function.
    // Pin >= 18.9.0 (earlier builds crash on iOS 27 beta; Android is fine
    // either way but stay current). See docs/RECAPTCHA-ENTERPRISE-SETUP.md.
    recaptchaVersion = '18.9.0'
    // Firebase Crashlytics — NATIVE crash + ANR reporting for the Capacitor
    // wrapper. Deliberately complementary to Sentry rather than overlapping
    // it: Sentry (src/utils/sentry.js) runs INSIDE the WebView and sees
    // JavaScript errors, which means it cannot see the two failure classes
    // that actually sink a Play Store listing — a native crash in the
    // wrapper/plugin layer, and an ANR, where the process is killed by the
    // platform and no JS handler ever runs. Those are also what Play Console
    // vitals grade a new listing on.
    //
    // Two artefacts, two coordinates: the Gradle PLUGIN (classpath in
    // android/build.gradle) uploads the R8 mapping file so release stack
    // traces are readable, and the SDK below is what actually reports. Both
    // are pinned here so a bump is one file, matching recaptchaVersion above.
    //
    // The SDK carries NO user identifier: setUserId is never called, so a
    // report is a stack trace and device metadata, consistent with the
    // children's-privacy posture that keeps PostHog on identify:false for
    // learners.
    firebaseCrashlyticsVersion = '20.0.0'
    firebaseCrashlyticsGradleVersion = '3.0.6'
    // @capacitor-firebase/authentication: ship the native Google sign-in
    // dependencies (play-services-auth, androidx.credentials, googleid) as
    // implementation instead of compileOnly. capacitor.config.json enables
    // the google.com provider and AuthContext's signInWithGoogleNative()
    // calls it, but without this flag the classes never reach the APK — the
    // plugin dies loading GoogleAuthProviderHandler and JS surfaces "Google
    // sign-in is not available in this app build". R8 (minified release)
    // also refuses to build at all while they're missing. The disabled
    // Facebook provider stays compileOnly; see the -dontwarn in
    // app/proguard-rules.pro.
    rgcfaIncludeGoogle = true
}