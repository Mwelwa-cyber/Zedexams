apply plugin: 'com.android.application'

// ── versionCode / versionName ────────────────────────────────────────
// Manual override via ZED_VERSION_CODE / ZED_VERSION_NAME env vars
// (CI typically sets ZED_VERSION_CODE from the build number). Falls
// back to deriving versionCode from the git commit count so every
// commit produces a unique, monotonically-increasing APK version,
// avoiding the "Android won't install my new APK because versionCode
// hasn't changed" footgun documented in docs/ANDROID-RELEASE.md.
// Last fallback is a hardcoded number for shallow clones / tarball
// builds where git isn't available. Keep hardcodedVersionName in sync
// with the latest shipped release so a build with no ZED_VERSION_NAME
// override (e.g. a blank manual dispatch) doesn't ship a stale label.
def hardcodedVersionCode = 3
def hardcodedVersionName = "1.4.0"

def resolvedVersionCode = {
    def envOverride = System.getenv("ZED_VERSION_CODE")
    if (envOverride != null && envOverride.isInteger()) return envOverride.toInteger()
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = out
            ignoreExitValue = true
        }
        def n = out.toString().trim()
        if (n.isInteger() && (n as int) > 0) return n.toInteger()
    } catch (Exception ignored) {
        // Fall through to hardcoded
    }
    return hardcodedVersionCode
}()

def resolvedVersionName = {
    def envOverride = System.getenv("ZED_VERSION_NAME")
    if (envOverride != null && envOverride.trim().length() > 0) return envOverride.trim()
    return hardcodedVersionName
}()

println "ZedExams Android — versionCode=${resolvedVersionCode}, versionName=${resolvedVersionName}"

// ── Release signing ──────────────────────────────────────────────────
// Reads from ZED_RELEASE_STORE_FILE / ZED_RELEASE_STORE_PASSWORD /
// ZED_RELEASE_KEY_ALIAS / ZED_RELEASE_KEY_PASSWORD. All four must be
// set, otherwise the release build still runs but produces an unsigned
// APK that Play Store rejects. We print a clear warning so the failure
// mode is obvious instead of "looks fine until you upload".
def releaseSigningReady = (
    System.getenv("ZED_RELEASE_STORE_FILE")?.trim() &&
    System.getenv("ZED_RELEASE_STORE_PASSWORD")?.trim() &&
    System.getenv("ZED_RELEASE_KEY_ALIAS")?.trim() &&
    System.getenv("ZED_RELEASE_KEY_PASSWORD")?.trim()
)
if (!releaseSigningReady) {
    println "Release signing is not configured. Set ZED_RELEASE_STORE_FILE, ZED_RELEASE_STORE_PASSWORD, ZED_RELEASE_KEY_ALIAS, and ZED_RELEASE_KEY_PASSWORD to build a signed release APK/AAB."
}

android {
    namespace = "com.zedexams.android"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.zedexams.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (releaseSigningReady) {
        signingConfigs {
            release {
                storeFile file(System.getenv("ZED_RELEASE_STORE_FILE"))
                storePassword System.getenv("ZED_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("ZED_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("ZED_RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // R8 shrinking + optimization. The APK is mostly web assets, but
            // the native side still packages the full Capacitor + AndroidX +
            // Firebase class graph — R8 strips the unused majority of it, and
            // shrinkResources drops res/ entries nothing references. Keep
            // rules come from two places AGP merges automatically: the
            // consumer rules shipped inside each dependency's AAR (Capacitor's
            // cover the @CapacitorPlugin/Cordova reflection surface), and the
            // app-level rules in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Provides androidx.activity.EdgeToEdge for MainActivity (capacitor-android
    // pulls activity via implementation, so it isn't on the app classpath).
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // reCAPTCHA Enterprise SDK — see recaptchaVersion in variables.gradle and
    // ZedExamsApplication/RecaptchaPlugin for the init + execute wiring.
    implementation "com.google.android.recaptcha:recaptcha:$recaptchaVersion"
    // Firebase Crashlytics — native crash + ANR reporting. No init code: the
    // SDK registers itself through Firebase's ContentProvider and starts
    // catching uncaught native exceptions and ANRs on first launch, which is
    // precisely the surface Sentry cannot reach from inside the WebView.
    //
    // Declared unconditionally even though the Gradle plugin below is applied
    // only when google-services.json exists. Without that file Firebase simply
    // fails to initialise and Crashlytics stays dormant — the same way the
    // three @capacitor-firebase plugins already in this APK behave — so a
    // developer build with no secret still compiles and runs.
    implementation "com.google.firebase:firebase-crashlytics:$firebaseCrashlyticsVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // MUST stay inside this block, and after google-services. The
        // Crashlytics plugin reads the Firebase application id that
        // google-services generates, so applying it unconditionally would turn
        // "no google-services.json" from a warning that still builds (the
        // documented behaviour of android-debug-apk.yml when the
        // GOOGLE_SERVICES_JSON secret is unset) into a hard build failure.
        // Both release workflows refuse to build without the file, so release
        // APKs/AABs always get this — which is what matters, since it is the
        // release build that is minified and needs the mapping upload.
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications and Crashlytics won't work")
}
