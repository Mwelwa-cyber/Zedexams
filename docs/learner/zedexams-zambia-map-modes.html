<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZedExams — Know Zambia: five more map modes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ind:#5b5bd6;--ind-soft:#ececfb;--ink:#1c2333;--muted:#6b7392;--bg:#eef0fb;
--coral:#ff7a4d;--coral-2:#f4592c;--gold:#f5b820;--line:#e6e8f5;--r:18px;
/* Okabe-Ito, and the same rule as the sibling prototype: correct and wrong are
   told apart by GLYPH and PATTERN first. These two greens and oranges sit at
   almost the same grey, which is exactly why the glyph is not optional. */
--ok:#009e73;--ok-ink:#04674c;--ok-soft:#e7f5f0;--ok-line:#bfe4d8;
--no:#d55e00;--no-ink:#8f3f00;--no-soft:#fdeee4;--no-line:#f6d3ba;
--anchor:#a8b3d6;--anchor-ink:#333a58;--land:#d7dff2;
--live:#8fa8e8;--live-ink:#25315c;--road:#0072b2;--road-soft:#e6f0f8}
*{box-sizing:border-box}
body{margin:0;background:#dfe3f5;font-family:Nunito,system-ui,sans-serif;color:var(--ink);padding:22px 14px 50px}
h1.pt{text-align:center;margin:0 0 4px;font-size:25px}
p.ps{text-align:center;color:#5a6180;margin:0 0 16px;font-size:13.5px}

/* ---- prototype control strip (not part of the app) ---- */
.rig{max-width:1180px;margin:0 auto 18px;background:#fff;border-radius:14px;padding:12px 15px;
display:flex;gap:13px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:#4b5270}
.rig b{color:var(--ink)}
.rig label{display:flex;gap:6px;align-items:center;font-weight:800}
.rig select,.rig button{font:inherit;font-weight:800;font-size:12.5px;border-radius:9px;border:1.5px solid var(--line);
background:#fff;color:var(--ind);padding:6px 10px;cursor:pointer}
.rig .sep{flex:1}
.rig .chk{background:var(--ok-soft);color:var(--ok-ink);border:1px solid var(--ok-line);border-radius:999px;padding:4px 11px;font-weight:800}
.rig .chk.bad{background:var(--no-soft);color:var(--no-ink);border-color:var(--no-line)}
.rig .chk.idle{background:var(--bg);color:var(--muted);border-color:var(--line)}

.stage{display:flex;gap:22px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:356px;height:752px;background:var(--bg);border-radius:34px;overflow:hidden;position:relative;
box-shadow:0 14px 40px rgba(40,44,90,.22);border:7px solid #12142a;display:flex;flex-direction:column}
.phone.w320{width:320px}.phone.w360{width:360px}.phone.w412{width:412px}
.notes{width:356px}
.note{background:#fff;border-radius:14px;padding:13px 15px;font-size:12.5px;line-height:1.6;color:#4b5270;border-left:4px solid var(--ind);margin-bottom:11px}
.note b{color:var(--ink)} .note h3{margin:0 0 5px;font-size:13.5px;color:var(--ink)} .note.warn{border-left-color:#e0a020}
.note code{background:#f2f3fb;border-radius:5px;padding:1px 5px;font-size:11.5px}

.top{padding:11px 14px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex:0 0 auto}
.back{width:32px;height:32px;border-radius:10px;background:var(--bg);border:none;display:grid;place-items:center;color:var(--ind);font-size:16px;font-family:inherit;cursor:pointer}
.ttl{font-weight:900;font-size:15px;line-height:1.2}
.ttl small{display:block;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.chip{margin-left:auto;background:var(--ok-soft);color:var(--ok-ink);border:1px solid var(--ok-line);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.body{padding:12px;flex:1;overflow-y:auto}.body::-webkit-scrollbar{width:0}
.card{background:#fff;border-radius:var(--r);padding:13px;margin-bottom:10px}
.card.tight{padding:8px 8px 6px}
.kick{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.q{font-size:15.5px;font-weight:800;line-height:1.45}
.q b{color:var(--ind)}

/* ---- the map ---- */
svg.map{width:100%;display:block;touch-action:manipulation;overflow:visible}
.prov{fill:var(--land);stroke:#fff;stroke-width:.5;transition:fill .18s}
.prov[data-hit]{cursor:pointer}
.prov[data-hit]:hover{fill:#c3cdea}
.prov.anchor{fill:var(--anchor)}
.prov.ok{fill:var(--ok)}
.prov.no{fill:url(#hatch)}
.prov.dim{fill:#eef1fa}
.prov.live{fill:var(--live)}
.prov.live[data-hit]:hover{fill:#7d99e2}
.prov.step{fill:var(--road)}
.prov:focus{outline:none;stroke:var(--ind);stroke-width:1.4}
.zone{fill:#fff;stroke:#b9c0da;stroke-width:.7;stroke-dasharray:2.4 2;cursor:pointer}
.zone.ok{fill:var(--ok);stroke:var(--ok)}
.zone.no{fill:url(#hatch);stroke:var(--no)}
.zone:focus{outline:none;stroke:var(--ind);stroke-width:1.6}
.zlab{font-size:3.1px;font-weight:800;fill:var(--muted);text-anchor:middle;pointer-events:none}
.zlab.on{fill:#fff}
.plab{font-weight:900;fill:#fff;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.18);stroke-width:.35}
.plab.dark{fill:var(--anchor-ink);stroke:rgba(255,255,255,.7)}
.mark{font-weight:900;text-anchor:middle;pointer-events:none;font-size:4.2px;paint-order:stroke;stroke:#fff;stroke-width:.9}
.mark.ok{fill:#fff;stroke:rgba(0,0,0,.25)}
.mark.no{fill:var(--no-ink)}
.mark.step{fill:#fff;stroke:rgba(0,0,0,.3)}
.pin circle{fill:var(--coral-2);stroke:#fff;stroke-width:.6}
.pin text{font-size:3.1px;font-weight:900;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:1.1}
.halo{fill:transparent;cursor:pointer}
.halo:focus{outline:none}
body.nocolour svg.map{filter:grayscale(1)}

/* ---- chips, options, feedback ---- */
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.pc{background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:13px;font-weight:800;
cursor:pointer;color:var(--ink);box-shadow:0 2px 0 #ccd2e6;min-height:44px;touch-action:manipulation}
.pc:active{transform:translateY(2px);box-shadow:none}
.pc.sel{border-color:var(--ind);background:var(--ind-soft);color:var(--ind);box-shadow:0 0 0 3px rgba(91,91,214,.16)}
.pc.gone{opacity:.4;pointer-events:none;background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-ink);box-shadow:none}
.hint{text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin:9px 0 3px}
.hint b{color:var(--ind)}
.opts{display:grid;gap:8px;margin-top:2px}
.opt{background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:13px;font:inherit;font-size:15px;font-weight:800;
cursor:pointer;color:var(--ink);text-align:left;min-height:48px;display:flex;gap:9px;align-items:center;width:100%}
.opt .g{width:22px;flex:0 0 auto;font-size:15px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.opt.no{border-color:var(--no);background:var(--no-soft);color:var(--no-ink)}
.fb{border-radius:14px;padding:12px;margin-top:10px;font-size:13px;line-height:1.6}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--ok-ink)}
.fb.no{background:var(--no-soft);border:1px solid var(--no-line);color:var(--no-ink)}
.fb.say{background:var(--bg);border:1px solid var(--line);color:#4b5270}
.fb .t{font-weight:900;font-size:14px;margin-bottom:3px;display:flex;gap:6px;align-items:baseline}
.btn{width:100%;padding:13px;border:none;border-radius:14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px;min-height:48px}
.btn-coral{background:linear-gradient(180deg,var(--coral),var(--coral-2));color:#fff}
.btn-ghost{background:#fff;color:var(--ind);border:1.5px solid var(--line);font-size:14px}

/* ---- mode menu ---- */
.mode{background:#fff;border-radius:14px;padding:12px;margin-bottom:9px;display:flex;gap:11px;align-items:center;width:100%;
border:2px solid transparent;font:inherit;text-align:left;cursor:pointer;min-height:48px}
.mode:hover{border-color:var(--ind-soft)}
.mi{width:40px;height:40px;border-radius:12px;background:var(--ind-soft);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.mn{font-weight:900;font-size:14px}
.md{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.arw{margin-left:auto;color:#b9bfd8;font-weight:900;flex:0 0 auto}

/* ---- journey route strip ---- */
.route{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:9px}
.rs{background:var(--bg);border-radius:9px;padding:6px 9px;font-size:11px;font-weight:800;color:var(--muted);display:flex;gap:5px;align-items:center}
.rs.on{background:var(--road);color:#fff}
.rs .n{opacity:.7;font-size:10px}
.leg{font-size:12px;color:#4b5270;line-height:1.55;margin-top:8px;padding-left:10px;border-left:3px solid var(--road-soft)}
.leg b{color:var(--road)}

/* ---- acceptance panel ---- */
.panel{max-width:1180px;margin:22px auto 0;background:#161b30;color:#c8cfe8;border-radius:16px;padding:16px 18px;font-size:12.5px;line-height:1.6}
.panel h3{margin:0 0 4px;font-size:14.5px;color:#fff}
.panel p.lead{margin:0 0 12px;color:#939cc0}
.panel table{width:100%;border-collapse:collapse}
.panel td{padding:5px 8px 5px 0;vertical-align:top;border-bottom:1px solid #232945}
.panel td.v{white-space:nowrap;font-weight:800}
.panel .pass{color:#4fd6a6}.panel .fail{color:#ff9a6b}.panel .warn{color:#f3c65f}
.panel code{background:#232945;border-radius:5px;padding:1px 5px;color:#dfe4f7}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:820px){.stage{display:block}.phone,.notes{width:100%;max-width:360px;margin:0 auto 22px}}
</style></head><body>

<h1 class="pt">Know Zambia — five more map modes</h1>
<p class="ps">One traced map, five sets of rules. Journey mode is the one that teaches something the others cannot.</p>

<div class="rig">
  <label>Mode
    <select id="rMode"></select>
  </label>
  <label>Phone
    <select id="rWidth"><option value="w320">320px</option><option value="w360" selected>360px</option><option value="">356px</option><option value="w412">412px</option></select>
  </label>
  <button id="rMenu" type="button">Back to the menu</button>
  <label><input type="checkbox" id="rMono"> Drop the colour</label>
  <span class="sep"></span>
  <span class="chk idle" id="rSrc">loading…</span>
  <span class="chk bad" id="rVerify">unverified</span>
</div>

<div class="stage">
  <div class="phone w360" id="phone">
    <div class="top">
      <button class="back" id="hBack" type="button" aria-label="Back to the mode menu">‹</button>
      <div class="ttl" id="hTtl">Map games<small id="hSub">five modes</small></div>
      <div class="chip" id="hChip"></div>
    </div>
    <div class="body" id="scr"></div>
  </div>

  <div class="notes" id="notes"></div>
</div>

<div class="panel" id="panel"></div>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i);};
var TOUCH_MIN=44;                       /* px — the smallest allowed target */
var PKEYS=['nw','cb','ce','lu','so','we','no','mu','ea','lp'];
var VB_MAIN='0 0 100 81.5';
var VB_WORLD='-27 -23 154 130';
var STATES={ok:{glyph:'✓',word:'correct'},no:{glyph:'✗',word:'wrong'},
  anchor:{glyph:'',word:'already named'},step:{glyph:'',word:'on the route'},
  live:{glyph:'',word:'in this question'},dim:{glyph:'',word:'not in this question'}};

var PROV=null,FACTS=null,ADJ=null,SRCNAME='inline mirror',SRCFETCHED=false;
var G={};

/* ---------- geometry, all pure ---------- */
function parsePath(d){var pts=[],re=/[ML]\s*(-?[\d.]+),(-?[\d.]+)/g,m;while((m=re.exec(d))){pts.push([+m[1],+m[2]]);}return pts;}
function bbox(pts){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pts.forEach(function(p){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];});return{x0:x0,y0:y0,x1:x1,y1:y1,w:x1-x0,h:y1-y0};}
function areaOf(pts){var a=0;for(var i=0,j=pts.length-1;i<pts.length;j=i++){a+=(pts[j][0]+pts[i][0])*(pts[j][1]-pts[i][1]);}return Math.abs(a/2);}
function inside(pt,pts){var x=pt[0],y=pt[1],r=false;for(var i=0,j=pts.length-1;i<pts.length;j=i++){var xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))r=!r;}return r;}
function proj(lon,lat){var p=PROV.projection;return[(lon-p.lon.min)*p.lon.scale+p.lon.offset,(lat-p.lat.min)*p.lat.scale+p.lat.offset];}
function whichProvince(pt){for(var i=0;i<PKEYS.length;i++){if(inside(pt,G[PKEYS[i]].pts))return PKEYS[i];}return null;}
function segDist(p,a,b){var dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;
  var t=l?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l)):0;
  var x=a[0]+t*dx-p[0],y=a[1]+t*dy-p[1];return Math.sqrt(x*x+y*y);}
function distToPoly(p,pts){var d=1e9;for(var i=0,j=pts.length-1;i<pts.length;j=i++){d=Math.min(d,segDist(p,pts[j],pts[i]));}return d;}
/* How much boundary two provinces really share, in vertices of one lying on the
   other. It is what turns the declared adjacency graph into something the trace
   can contradict. */
function sharedBoundary(a,b){
  var eps=0.6,n=0,i;
  for(i=0;i<G[a].pts.length;i++)if(distToPoly(G[a].pts[i],G[b].pts)<eps)n++;
  for(i=0;i<G[b].pts.length;i++)if(distToPoly(G[b].pts[i],G[a].pts)<eps)n++;
  return n;
}
function nameOf(k){return PROV.provinces[k].n;}
function esc(s){return String(s).replace(/&(?!\w+;)/g,'&amp;').replace(/</g,'&lt;');}
function touches(a,b){return (ADJ[a]||[]).indexOf(b)>=0;}
function countryName(code){var n=code;FACTS.neighbours.forEach(function(z){if(z.code===code)n=z.name;});return n;}
function zoneOf(code){var r=null;FACTS.neighbours.forEach(function(z){if(z.code===code)r=z;});return r;}

/* ---------- data ---------- */
function readMirror(id){return JSON.parse($(id).textContent);}
function loadData(){
  /* Served over http:// this reads the real files. Double-clicked from the
     filesystem the browser blocks that, so the page falls back to the inline
     mirrors written by `npm run sync:zambia-game`. The strip above says which. */
  var m0=readMirror('mirror-provinces'),m1=readMirror('mirror-facts');
  if(m0&&m0.provinces){PROV=m0;FACTS=m1;}
  return Promise.all(['zambia_provinces.json','zambia_facts.json'].map(function(u){
    return fetch(u).then(function(r){return r.ok?r.json():null;});
  })).then(function(r){
    if(r[0]&&r[1]){PROV=r[0];FACTS=r[1];SRCNAME='zambia_provinces.json + zambia_facts.json';SRCFETCHED=true;}
  }).catch(function(){});
}

/* ---------- the five modes, built out of the datasets ---------- */
var MODES=[];
function buildModes(){
  var F=FACTS;
  MODES=[
    {id:'capital',icon:'📍',name:"Where's the capital?",
     sub:'ten provincial capitals',
     blurb:'A town appears on the map. Tap the province it is the capital of.',
     items:F.capitals.map(function(c){return{k:c.province,town:c.town,lon:c.lon,lat:c.lat,fact:c.fact,hint:c.hint};})},

    {id:'journey',icon:'🚌',name:'Journey',
     sub:'four bus routes',
     blurb:'Travel from one town to another. Tap each province you pass through, in order.',
     routes:F.journeys},

    {id:'odd',icon:'🧩',name:'Odd one out',
     sub:'four questions',
     blurb:'Four provinces are lit and the rest are dimmed. One of the four does not belong.',
     items:F.oddOneOut},

    {id:'neighbours',icon:'🌍',name:'Our neighbours',
     sub:'eight countries',
     blurb:'Place the eight countries that touch Zambia around the outline.',
     items:F.neighbours},

    {id:'ceremony',icon:'🥁',name:"Where's the ceremony?",

     blurb:'Kuomboka, N’cwala, Mutomboko, Likumbi Lya Mize — where, whose, and when.',

}
function modeOf(id){for(var i=0;i<MODES.length;i++)if(MODES[i].id===id)return MODES[i];return null;}

/* ---------- map ---------- */
/* Font size comes from the INSCRIBED RADIUS at the label anchor — the radius of
   the largest circle that fits inside the province at that point — not from the
   width of the bounding box. It is the same mistake as using a box centre for a
   position, one step along: North-Western's box is nearly half the country wide
   while the room around its anchor is not, so box-derived sizing printed its
   name straight across Copperbelt's. The anchor is already the pole of
   inaccessibility, so its distance to the boundary IS that radius. */
function labelSize(k){
  var n=nameOf(k).length;
  return Math.max(1.9,Math.min(3.1,(G[k].inscribed*2*0.95)/(n*0.55)));
}
function svgMap(o){
  o=o||{};
  var vb=o.viewBox||VB_MAIN,st=o.state||{},s='';
  s+='<svg class="map" viewBox="'+vb+'" role="group" aria-label="Map of Zambia and its ten provinces">';
  s+='<defs><pattern id="hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
     '<rect width="3" height="3" fill="#fbe3d2"></rect><rect width="1.4" height="3" fill="#d55e00"></rect></pattern></defs>';

  if(o.zones){
    FACTS.neighbours.forEach(function(z){
      var on=st['z_'+z.code],r=z.zone,tappable=o.hit==='zone'&&!on;
      s+='<rect class="zone '+(on||'')+'" x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" rx="2"'+
         (tappable?' data-hit="zone:'+z.code+'" role="button" tabindex="0"':'')+
         ' aria-label="'+esc(z.name)+', to the '+esc(z.side)+' of Zambia'+(on?', '+STATES[on].word:'')+'"><title>'+esc(z.name)+'</title></rect>';
      var cx=r[0]+r[2]/2,cy=r[1]+r[3]/2;
      if(on==='ok'){s+='<text class="zlab on" x="'+cx+'" y="'+(cy+1)+'">'+esc(z.name)+'</text>'+
        '<text class="mark ok" x="'+cx+'" y="'+(cy-3.4)+'">✓</text>';}
      else if(on==='no'){s+='<text class="mark no" x="'+cx+'" y="'+(cy+1.4)+'">✗</text>';}
      else s+='<text class="zlab" x="'+cx+'" y="'+(cy+1)+'">?</text>';
    });
  }

  /* Provinces. `o.tappable` is the whitelist — odd-one-out passes the four it
     lit, so the six dimmed ones carry no data-hit, no tabindex and no halo, and
     a tap on them cannot reach the handler at all. */
  PKEYS.forEach(function(k){
    var c=st[k]||'',hit=o.hit==='prov'&&(!o.tappable||o.tappable.indexOf(k)>=0);
    s+='<path id="p_'+k+'" class="prov '+c+'" d="'+PROV.provinces[k].d+'"'+
       (hit?' data-hit="prov:'+k+'" role="button" tabindex="0"':'')+
       ' aria-label="'+esc(nameOf(k))+' Province'+(c&&STATES[c]?', '+STATES[c].word:'')+'"><title>'+esc(nameOf(k))+' Province</title></path>';
  });

  /* Names sit on the pole of inaccessibility carried in the dataset as `c`,
     never on the middle of the bounding box. Central wraps around Copperbelt,
     so its box centre lands on a different province — and so do Eastern's and
     Luapula's. The acceptance panel prints all three. */
  PKEYS.forEach(function(k){
    var c=st[k]||'',want=(c==='ok'||c==='anchor'||c==='step'||(o.labels&&o.labels.indexOf(k)>=0));
    if(!want)return;
    var a=PROV.provinces[k].c,fs=labelSize(k);
    s+='<text class="plab'+(c==='anchor'||c==='live'||!c?' dark':'')+'" x="'+a[0]+'" y="'+a[1]+'" style="font-size:'+fs.toFixed(2)+'px">'+esc(nameOf(k))+'</text>';
    if(c==='ok')s+='<text class="mark ok" x="'+a[0]+'" y="'+(a[1]-fs-1.2)+'">✓</text>';
    if(c==='step'&&o.order&&o.order[k])s+='<text class="mark step" x="'+a[0]+'" y="'+(a[1]-fs-1.2)+'">'+o.order[k]+'</text>';
  });
  PKEYS.forEach(function(k){
    if((st[k]||'')!=='no')return;var a=PROV.provinces[k].c;
    s+='<text class="mark no" x="'+a[0]+'" y="'+a[1]+'">✗</text>';
  });

  if(o.pin){
    var p=proj(o.pin.lon,o.pin.lat);
    s+='<g class="pin" aria-hidden="true"><circle cx="'+p[0].toFixed(2)+'" cy="'+p[1].toFixed(2)+'" r="1.5"></circle>'+
       '<text x="'+p[0].toFixed(2)+'" y="'+(p[1]-2.6).toFixed(2)+'">'+esc(o.pin.label)+'</text></g>';
  }

  /* Touch halos, sized by fitHalos() at the width actually rendered. Stacked
     smallest-last so Lusaka wins the tap over Central. */
  if(o.hit==='prov'){
    s+='<g class="halos">';
    PKEYS.filter(function(k){return !o.tappable||o.tappable.indexOf(k)>=0;})
      .sort(function(a,b){return G[b].area-G[a].area;}).forEach(function(k){
      var a=PROV.provinces[k].c,b=G[k].bbox;
      s+='<circle class="halo" data-hit="prov:'+k+'" data-min="'+Math.min(b.w,b.h).toFixed(2)+'" cx="'+a[0]+'" cy="'+a[1]+'" r="0" aria-hidden="true"></circle>';
    });
    s+='</g>';
  }
  if(o.hit==='zone'){
    s+='<g class="halos">';
    FACTS.neighbours.slice().sort(function(a,b){return(b.zone[2]*b.zone[3])-(a.zone[2]*a.zone[3]);}).forEach(function(z){
      if(st['z_'+z.code])return;var r=z.zone;
      s+='<circle class="halo" data-hit="zone:'+z.code+'" data-min="'+Math.min(r[2],r[3])+'" cx="'+(r[0]+r[2]/2)+'" cy="'+(r[1]+r[3]/2)+'" r="0" aria-hidden="true"></circle>';
    });
    s+='</g>';
  }
  return s+'</svg>';
}
function fitHalos(){
  var svgs=document.querySelectorAll('svg.map'),i,measured=[];
  for(i=0;i<svgs.length;i++){
    var svg=svgs[i],w=svg.getBoundingClientRect().width;if(!w)continue;
    var vb=svg.getAttribute('viewBox').split(/\s+/).map(Number),scale=w/vb[2];
    var hs=svg.querySelectorAll('circle.halo'),j;
    for(j=0;j<hs.length;j++){
      var minPx=parseFloat(hs[j].getAttribute('data-min'))*scale;
      var r=minPx>=TOUCH_MIN?0:(TOUCH_MIN/2)/scale;
      /* Round the radius UP, not to nearest. At 320px the ideal radius is
         8.270677 user units and toFixed(2) gives 8.27 — a 43.996px target,
         which fails the 44px rule this line exists to keep, and turns the
         page's own acceptance row red at the narrowest width it supports.
         Two hundredths of a unit too big costs nothing; a hair too small
         costs the guarantee. */
      hs[j].setAttribute('r',r?(Math.ceil(r*100)/100).toFixed(2):'0');
      measured.push({id:hs[j].getAttribute('data-hit'),px:Math.max(minPx,r*2*scale)});
    }
  }
  return measured;
}

function fbHtml(){
  if(!fb)return'';
  return '<div class="fb '+fb.k+'"><div class="t"><span aria-hidden="true">'+fb.g+'</span><span>'+fb.t+'</span></div>'+fb.b+'</div>';
}
function menu(){view='menu';M=null;render();}
function startMode(id){
  M=modeOf(id);view='mode';pass=1;tricky=[];qi=0;score=0;asked=0;routeIx=null;reset();
  if(M.id==='journey'){view='routes';}
  else if(M.id==='neighbours'){Q=[{one:true}];}
  else Q=M.items.slice();
  render();
}
function startRoute(ix){routeIx=ix;view='mode';Q=[{route:M.routes[ix]}];qi=0;reset();render();}

/* An item missed on the first attempt comes back once the queue empties. This
   is the whole of the "tricky pool" — it is not a spaced-repetition schedule,
   and it does not pretend to be one. */
function nextItem(){
  qi++;reset();
  if(qi>=Q.length&&pass===1&&tricky.length){Q=tricky.slice();tricky=[];qi=0;pass=2;}
  render();
}
function missed(item){if(pass===1&&tricky.indexOf(item)<0)tricky.push(item);}
function done(){return qi>=Q.length;}

/* ---------- render ---------- */
function render(){
  if(view==='menu')return renderMenu();
  if(view==='routes')return renderRoutes();
  if(done())return renderDone();
  if(M.id==='capital')renderCapital();
  else if(M.id==='journey')renderJourney();
  else if(M.id==='odd')renderOdd();
  else if(M.id==='neighbours')renderNeighbours();
  else if(M.id==='ceremony')renderCeremony();
  fitHalos();runChecks();
}
function head(title,sub,chip){
  $('hTtl').innerHTML=esc(title)+'<small>'+esc(sub)+'</small>';
  $('hChip').textContent=chip||'';
  $('hChip').style.display=chip?'':'none';
}
function renderMenu(){
  head('Map games','five modes','');
  $('scr').innerHTML=MODES.map(function(m){
    return '<button class="mode" type="button" data-act="mode:'+m.id+'">'+
      '<span class="mi" aria-hidden="true">'+m.icon+'</span>'+
      '<span><span class="mn">'+esc(m.name)+'</span><span class="md">'+esc(m.blurb)+'</span></span>'+
      '<span class="arw" aria-hidden="true">›</span></button>';
  }).join('')+
  '<div class="note" style="margin-top:12px;border:0;border-left:4px solid var(--ind)">'+
  '<b>Not every round should be a map.</b> These five sit alongside the plain question rounds in the main game, they do not replace them. '+
  'A learner who only ever taps a map stops reading the question.</div>';
  fitHalos();runChecks();
}
function renderRoutes(){
  head('Journey','pick a route','');
  $('scr').innerHTML='<div class="card"><div class="kick">Four journeys</div>'+
    '<div class="q">Where are you travelling?</div>'+
    '<div class="md" style="margin-top:6px">Tap each province you pass through, in order. Nothing is timed — the road is long.</div></div>'+
    M.routes.map(function(r,i){
      return '<button class="mode" type="button" data-act="route:'+i+'">'+
        '<span class="mi" aria-hidden="true">'+(i+1)+'</span>'+
        '<span><span class="mn">'+esc(r.from)+' → '+esc(r.to)+'</span>'+
        '<span class="md">'+esc(r.road)+' · '+r.provinces.length+' provinces · about '+r.approxKm.toLocaleString()+' km</span></span>'+
        '<span class="arw" aria-hidden="true">›</span></button>';
    }).join('');
  fitHalos();runChecks();
}

/* --- 1. Where's the capital? --- */
function renderCapital(){
  var it=Q[qi],st={};
  if(resolved){st[it.k]='ok';if(marks.wrong&&marks.wrong!==it.k)st[marks.wrong]='no';}
  head("Where's the capital?",pass===2?'the ones that caught you':'ten provincial capitals',(qi+1)+' / '+Q.length);
  $('scr').innerHTML=
   '<div class="card tight">'+svgMap({hit:resolved?null:'prov',state:st,pin:{lon:it.lon,lat:it.lat,label:it.town}})+'</div>'+
   '<div class="card"><div class="kick">Provincial capital</div>'+
     '<div class="q"><b>'+esc(it.town)+'</b> is the capital of which province?</div>'+
     (resolved?'':'<div class="hint">Tap the province on the map</div>')+
   '</div>'+fbHtml()+
   (resolved?'<button class="btn btn-coral" type="button" data-act="next">'+(qi+1>=Q.length&&!(pass===1&&tricky.length)?'Finish':'Next')+' →</button>':'');
}
function answerCapital(k){
  var it=Q[qi];
  if(resolved)return;
  asked++;
  if(k===it.k){
    resolved=true;if(!tries)score++;
    say('ok','✓',nameOf(it.k),esc(it.fact));
  }else{
    tries++;marks.wrong=k;missed(it);
    if(tries>=2){
      resolved=true;
      say('no','✗','It is '+nameOf(it.k),'You tapped '+esc(nameOf(k))+'. '+esc(it.fact));
    }else{
      say('no','✗','Not '+nameOf(k),esc(it.hint)+' Try once more.');
    }
  }
  render();
}

/* --- 2. Journey --- */
function renderJourney(){
  var r=Q[qi].route,st={},order={},i;
  for(i=0;i<sub;i++){st[r.provinces[i]]='step';order[r.provinces[i]]=i+1;}
  if(marks.wrong)st[marks.wrong]='no';
  var finished=sub>=r.provinces.length;
  head('Journey',esc(r.from)+' → '+esc(r.to),sub+' / '+r.provinces.length);
  $('scr').innerHTML=
   '<div class="card tight">'+svgMap({hit:finished?null:'prov',state:st,order:order})+'</div>'+
   '<div class="card"><div class="kick">'+esc(r.road)+'</div>'+
     '<div class="q">Travel from <b>'+esc(r.from)+'</b> to <b>'+esc(r.to)+'</b>.</div>'+
     '<div class="md" style="margin-top:5px">Tap each province you pass through, in order.</div>'+
     '<div class="route">'+r.provinces.map(function(k,i){
        return '<span class="rs '+(i<sub?'on':'')+'"><span class="n">'+(i+1)+'</span>'+(i<sub?esc(nameOf(k)):'?')+'</span>';
      }).join('')+'</div>'+
     (sub>0&&!finished?'<div class="leg"><b>'+esc(nameOf(r.provinces[sub-1]))+'</b> — '+esc(r.legs[r.provinces[sub-1]])+'</div>':'')+
   '</div>'+fbHtml()+
   (finished?'<button class="btn btn-coral" type="button" data-act="next">Finish →</button>'+
     '<button class="btn btn-ghost" type="button" data-act="routes">Another route</button>':'');
}
/* The wrong-tap answer is the reason this mode exists. It names where you are,
   then says something different depending on WHY the tap was wrong — a province
   that touches this one but lies off the route is a different mistake from one
   that does not touch it at all, and a child who is told the difference learns
   the shape of the country rather than the answer to this question. */
function answerJourney(k){
  var r=Q[qi].route;
  if(sub>=r.provinces.length)return;
  var wantK=r.provinces[sub],here=sub>0?r.provinces[sub-1]:null;
  asked++;
  if(k===wantK){
    marks.wrong=null;sub++;if(!tries)score++;tries=0;
    var last=sub>=r.provinces.length;
    if(last)say('ok','🚌','You made it to '+esc(r.to),
      esc(r.endNote)+' The route ran '+r.provinces.map(nameOf).join(' → ')+'.');
    else say('ok','✓',nameOf(k),esc(r.legs[k]));
  }else{
    tries++;marks.wrong=k;
    if(r.provinces.indexOf(k)>=0&&r.provinces.indexOf(k)<sub){
      say('no','✗','You have been there',
        'You passed through '+esc(nameOf(k))+' already — it is number '+(r.provinces.indexOf(k)+1)+' on the strip. Which province comes next?');
    }else if(!here){
      say('no','✗','That is not where you start',
        esc(r.from)+' is in '+esc(nameOf(wantK))+'. Start the journey in the province you are leaving from.');
    }else if(touches(k,here)){
      say('no','✗',nameOf(k)+' does touch '+nameOf(here),
        'So you could drive there — but you are heading for '+esc(r.to)+', and this road does not go that way. '+
        'Which province that touches '+esc(nameOf(here))+' takes you towards '+esc(r.to)+'?');
    }else{
      say('no','✗',nameOf(k)+' does not touch '+nameOf(here),
        'You are in '+esc(nameOf(here))+'. You cannot reach '+esc(nameOf(k))+' from there without crossing a province in between. '+
        'Which province touches '+esc(nameOf(here))+' on the way to '+esc(r.to)+'?');
    }
  }
  render();
}

/* --- 3. Odd one out --- */
function renderOdd(){
  var it=Q[qi],st={};
  PKEYS.forEach(function(k){st[k]=it.set.indexOf(k)>=0?'live':'dim';});
  if(resolved){st[it.odd]='ok';if(marks.wrong&&marks.wrong!==it.odd)st[marks.wrong]='no';}
  head('Odd one out',pass===2?'the ones that caught you':'four questions',(qi+1)+' / '+Q.length);
  $('scr').innerHTML=
   '<div class="card tight">'+svgMap({hit:resolved?null:'prov',state:st,tappable:it.set,labels:it.set})+'</div>'+
   '<div class="card"><div class="kick">One does not belong</div>'+
     '<div class="q">'+it.q+'</div>'+
     (resolved?'':'<div class="hint">Tap one of the four lit provinces</div>')+
   '</div>'+fbHtml()+
   (resolved?'<button class="btn btn-coral" type="button" data-act="next">'+(qi+1>=Q.length&&!(pass===1&&tricky.length)?'Finish':'Next')+' →</button>':'');
}
function answerOdd(k){
  var it=Q[qi];
  if(resolved)return;
  if(it.set.indexOf(k)<0)return;   /* dimmed provinces are not in this question */
  asked++;
  if(k===it.odd){resolved=true;if(!tries)score++;say('ok','✓',nameOf(it.odd),esc(it.why));}
  else{
    resolved=true;tries++;missed(it);
    say('no','✗','It is '+nameOf(it.odd),
      'You tapped '+esc(nameOf(k))+', which does belong with the other two. '+esc(it.why));
  }
  render();
}

/* --- 4. Our neighbours --- */
function renderNeighbours(){
  var st={},placed=0;
  FACTS.neighbours.forEach(function(z){if(marks[z.code]){st['z_'+z.code]='ok';placed++;}});
  PKEYS.forEach(function(k){st[k]='anchor';});
  var left=FACTS.neighbours.filter(function(z){return !marks[z.code];});
  var allDone=left.length===0;
  head('Our neighbours','eight countries',placed+' / 8');
  $('scr').innerHTML=
   '<div class="card tight">'+svgMap({viewBox:VB_WORLD,hit:allDone?null:'zone',state:st,zones:true})+'</div>'+
   '<div class="card"><div class="kick">Eight countries touch Zambia</div>'+
     (allDone?'<div class="q">All eight placed.</div>':
      '<div class="q">Tap a country, then tap the box it belongs in.</div>')+
     (allDone?'':'<div class="chips">'+FACTS.neighbours.map(function(z){
        return '<button class="pc '+(marks[z.code]?'gone':'')+(sel===z.code?' sel':'')+'" type="button" data-act="pick:'+z.code+'"'+
          (marks[z.code]?' disabled':'')+'>'+esc(z.name)+'</button>';
      }).join('')+'</div>')+
     (allDone?'':'<div class="hint">'+(sel?'Placing <b>'+esc(countryName(sel))+'</b> — now tap its box':'Pick a country first')+'</div>')+
   '</div>'+fbHtml()+
   (allDone?'<button class="btn btn-coral" type="button" data-act="next">Finish →</button>':'');
}
function answerNeighbour(code){
  if(!sel){say('say','·','Pick a country first','Tap one of the eight names, then tap the box you think it goes in.');render();return;}
  var want=zoneOf(sel),gotZone=zoneOf(code);
  asked++;
  if(code===sel){
    marks[sel]=true;if(!tries)score++;tries=0;
    say('ok','✓',want.name,esc(want.fact));
    sel=null;
  }else{
    tries++;
    say('no','✗','That box is '+gotZone.name+'’s',
      esc(want.name)+' is '+esc(want.side)+' of Zambia. '+esc(want.hint));
  }
  render();
}

/* --- 5. Where's the ceremony? --- */
/* Three questions per ceremony and only the first is on the map. The other two
   are plain options, on purpose: a round that is ALL map teaches tapping. */
function renderCeremony(){
  var it=Q[qi],st={};
  if(sub>0){st[it.province]='ok';if(marks.wrong&&marks.wrong!==it.province)st[marks.wrong]='no';}
  head("Where's the ceremony?",esc(it.name),(qi+1)+' / '+Q.length+' · '+(sub+1)+' of 3');
  var h='<div class="card tight">'+svgMap({hit:sub===0?'prov':null,state:st})+'</div>';
  if(sub===0){
    h+='<div class="card"><div class="kick">Traditional ceremony</div>'+
       '<div class="q">Where does the <b>'+esc(it.name)+'</b> take place?</div>'+
       '<div class="hint">Tap the province</div></div>';
  }else if(sub===1){
    h+='<div class="card"><div class="kick">'+esc(it.name)+' · '+esc(nameOf(it.province))+'</div>'+
       '<div class="q">Whose ceremony is it?</div>'+
       '<div class="opts">'+it.peopleOptions.map(function(o){
         return '<button class="opt '+(marks.people?(o===it.people?'ok':(marks.people===o?'no':'')):'')+'" type="button" data-act="opt:people:'+encodeURIComponent(o)+'"'+
           (marks.people?' disabled':'')+'><span class="g" aria-hidden="true">'+(marks.people?(o===it.people?'✓':(marks.people===o?'✗':'·')):'·')+'</span>'+esc(o)+'</button>';
       }).join('')+'</div></div>';
  }else{
    h+='<div class="card"><div class="kick">'+esc(it.name)+' · '+esc(it.people)+'</div>'+
       '<div class="q">When is it held?</div>'+
       '<div class="opts">'+it.monthOptions.map(function(o){
         return '<button class="opt '+(marks.month?(o===it.month?'ok':(marks.month===o?'no':'')):'')+'" type="button" data-act="opt:month:'+encodeURIComponent(o)+'"'+
           (marks.month?' disabled':'')+'><span class="g" aria-hidden="true">'+(marks.month?(o===it.month?'✓':(marks.month===o?'✗':'·')):'·')+'</span>'+esc(o)+'</button>';
       }).join('')+'</div></div>';
  }
  h+=fbHtml();
  if(resolved)h+='<button class="btn btn-coral" type="button" data-act="next">'+
    (qi+1>=Q.length&&!(pass===1&&tricky.length)?'Finish':'Next ceremony')+' →</button>';
  else if((sub===1&&marks.people)||(sub===2&&marks.month))
    h+='<button class="btn btn-coral" type="button" data-act="sub">Next →</button>';
  $('scr').innerHTML=h;
}
function answerCeremony(k){
  var it=Q[qi];
  if(sub!==0)return;
  asked++;
  if(k===it.province){
    if(!tries)score++;
    say('ok','✓',nameOf(it.province),esc(it.fact));
    sub=1;marks.wrong=null;
  }else{
    tries++;marks.wrong=k;missed(it);
    if(tries>=2){say('no','✗','It is in '+nameOf(it.province),'You tapped '+esc(nameOf(k))+'. '+esc(it.fact));sub=1;}
    else say('no','✗','Not '+nameOf(k),esc(it.hint)+' Try once more.');
  }
  render();
}
function answerOption(kind,val){
  var it=Q[qi];
  asked++;
  if(kind==='people'){
    marks.people=val;
    if(val===it.people){if(!tries)score++;say('ok','✓',esc(it.people),esc(it.name)+' is theirs. '+esc(it.fact));}
    else{missed(it);say('no','✗','It is the '+esc(it.people),'You chose '+esc(val)+'. '+esc(it.fact));}
  }else{
    marks.month=val;
    if(val===it.month){if(!tries)score++;say('ok','✓',esc(it.month),esc(it.monthWhy));}
    else{missed(it);say('no','✗','It is '+esc(it.month).toLowerCase(),'You chose '+esc(val)+'. '+esc(it.monthWhy));}
    resolved=true;
  }
  render();
}

/* ---------- done ---------- */
function renderDone(){
  head(M.name,'finished','');
  var line=M.id==='neighbours'?'All eight neighbours placed.':
    score+' of '+asked+' answered right first time.';
  $('scr').innerHTML=
   '<div class="card" style="text-align:center">'+
     '<div style="font-size:38px" aria-hidden="true">'+M.icon+'</div>'+
     '<div class="q" style="margin-top:4px">'+esc(M.name)+'</div>'+
     '<div class="md" style="margin-top:6px">'+esc(line)+'</div>'+
     (pass===2?'<div class="md" style="margin-top:6px">The ones that caught you came back at the end, and you have now answered them.</div>':'')+
   '</div>'+
   '<button class="btn btn-coral" type="button" data-act="mode:'+M.id+'">Play again</button>'+
   '<button class="btn btn-ghost" type="button" data-act="menu">Back to the modes</button>';
  fitHalos();runChecks();
}

/* ---------- input ---------- */
function hit(token){
  var bits=token.split(':'),kind=bits[0],val=bits[1];
  if(kind==='prov'){
    if(M.id==='capital')answerCapital(val);
    else if(M.id==='journey')answerJourney(val);
    else if(M.id==='odd')answerOdd(val);
    else if(M.id==='ceremony')answerCeremony(val);
  }else if(kind==='zone'){
    if(M.id==='neighbours')answerNeighbour(val);
  }
}
function doAct(act){
  var i=act.indexOf(':'),k=i<0?act:act.slice(0,i),v=i<0?'':act.slice(i+1);
  if(k==='mode'){startMode(v);return;}
  if(k==='route'){startRoute(+v);return;}
  if(k==='routes'){view='routes';reset();render();return;}
  if(k==='menu'){menu();return;}
  if(k==='next'){nextItem();return;}
  if(k==='sub'){sub++;fb=null;tries=0;render();return;}
  if(k==='pick'){if(marks[v])return;sel=(sel===v?null:v);fb=null;render();return;}
  if(k==='opt'){var p=v.split(':');answerOption(p[0],decodeURIComponent(p[1]));return;}
}
document.addEventListener('click',function(e){
  var t=e.target&&e.target.closest?e.target.closest('[data-act],[data-hit]'):null;
  if(!t)return;
  var a=t.getAttribute('data-act');
  if(a){doAct(a);return;}
  var h=t.getAttribute('data-hit');
  if(h)hit(h);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var t=e.target&&e.target.closest?e.target.closest('[data-hit]'):null;
  if(!t||t.tagName==='BUTTON')return;
  e.preventDefault();hit(t.getAttribute('data-hit'));
});

/* ---------- acceptance panel ---------- */
var LASTMEASURE=null,LASTZONE=null;
function measureNow(){
  var m=fitHalos(),w=Math.round($('phone').getBoundingClientRect().width);
  var pv=m.filter(function(x){return x.id.indexOf('prov:')===0;});
  var zn=m.filter(function(x){return x.id.indexOf('zone:')===0;});
  if(pv.length)LASTMEASURE={w:w,items:pv};
  if(zn.length)LASTZONE={w:w,items:zn};
  return LASTMEASURE;
}
function ruleHolds(k,rule){
  var B=FACTS.provinces[k].borders||[];
  if(rule==='borders:any')return B.length>0;
  if(rule.indexOf('borders:')===0){
    return rule.slice(8).split('|').some(function(c){return B.indexOf(c)>=0;});
  }
  if(rule.indexOf('touches:')===0)return touches(k,rule.slice(8));
  return null;
}
function runChecks(){
  var rows=[],D=PROV.dataset,ok=0,bad=0;
  function row(name,state,text){rows.push({n:name,s:state,t:text});if(state==='fail')bad++;else if(state==='pass')ok++;}

  row('Renders from the dataset',SRCFETCHED?'pass':'warn',
    'Outlines, label anchors, adjacency and every fact read from <code>'+esc(SRCNAME)+'</code>'+
    (SRCFETCHED?'':' — the datasets were not fetched (the page was opened from the filesystem, where the browser blocks it), so it fell back to the inline mirror. The mirror is written by <code>npm run sync:zambia-game</code>, and <code>npm run test:zambia-game</code> fails if it and the files disagree.')+
    ' Nothing on this page carries its own copy of a province path — that rule is enforced by the test, not by care.');

  row('Dated and attributed — but not verified',
    (PROV.dataset.verification.status==='UNVERIFIED'||FACTS.dataset.verification.status==='UNVERIFIED')?'warn':'pass',
    '<b>map '+esc(PROV.dataset.verification.status)+' · facts '+esc(FACTS.dataset.verification.status)+'.</b> '+
    'The three classes this page added — which countries each province borders, the journey routes, and the odd-one-out rules — are named in <code>verification.requiredBeforeRelease</code> so the teacher pass covers them rather than signing off on less than the file claims. '+
    'One boundary is flagged as genuinely unsettled: '+esc(FACTS.provinceBorders.unverified.split('.')[0])+'.');

  /* The prompt's geometry warning, run rather than repeated. */
  var boxWrong=[],anchorWrong=[];
  PKEYS.forEach(function(k){
    var b=G[k].bbox,mid=[(b.x0+b.x1)/2,(b.y0+b.y1)/2],lands=whichProvince(mid);
    if(lands!==k)boxWrong.push(nameOf(k)+' → '+(lands?nameOf(lands):'no province at all'));
    if(!inside(PROV.provinces[k].c,G[k].pts))anchorWrong.push(nameOf(k));
  });
  row('Names sit on the pole of inaccessibility, not the box centre',anchorWrong.length?'fail':'pass',
    'All 10 label anchors (<code>provinces[].c</code>) fall inside their own province. '+
    'The bounding-box centre does not: <b>'+boxWrong.length+' of 10 land in the wrong province</b> — '+esc(boxWrong.join(', '))+
    '. Central wraps around Copperbelt, Eastern curls around Muchinga and Luapula around Northern, so a box centre is not a location. '+
    'Nothing here uses one — not a label, not a leader, not a touch halo, not the ✓ mark.');

  /* Adjacency: declared in the dataset, re-checked against the trace here. */
  var edges=[],weak=[],phantom=[];
  Object.keys(ADJ).forEach(function(a){ADJ[a].forEach(function(b){
    if(a<b){var n=sharedBoundary(a,b);edges.push({a:a,b:b,n:n});if(n<6)weak.push(nameOf(a)+'–'+nameOf(b)+' ('+n+')');if(n===0)phantom.push(nameOf(a)+'–'+nameOf(b));}
  });});
  var asym=[];
  Object.keys(ADJ).forEach(function(a){ADJ[a].forEach(function(b){if((ADJ[b]||[]).indexOf(a)<0)asym.push(a+'→'+b);});});
  var weakest=edges.slice().sort(function(x,y){return x.n-y.n;})[0];
  row('Adjacency agrees with the traced outlines',(phantom.length||asym.length)?'fail':(weak.length?'warn':'pass'),
    edges.length+' declared borders, all symmetric, each re-measured against the trace by counting outline points that lie on the neighbour. '+
    'Weakest: <b>'+esc(nameOf(weakest.a)+'–'+nameOf(weakest.b))+'</b> at '+weakest.n+' shared points'+
    (weak.length?' — thin enough to be worth a teacher’s eye: '+esc(weak.join(', ')):'')+'. '+
    'Copperbelt and Luapula are correctly <b>not</b> neighbours: the Congo Pedicle sits between them, which is why the road from the Copperbelt to Mansa crosses another country or goes the long way round.');

  var legBad=[],legMissing=[];
  FACTS.journeys.forEach(function(r){
    for(var i=0;i<r.provinces.length-1;i++){
      if(!touches(r.provinces[i],r.provinces[i+1]))legBad.push(r.id+': '+nameOf(r.provinces[i])+'→'+nameOf(r.provinces[i+1]));
    }
    r.provinces.forEach(function(k){if(!r.legs[k])legMissing.push(r.id+'/'+k);});
  });
  row('Every journey is a road that exists on the map',(legBad.length||legMissing.length)?'fail':'pass',
    FACTS.journeys.length+' routes: '+FACTS.journeys.map(function(r){return esc(r.from)+'→'+esc(r.to)+' ('+r.provinces.length+')';}).join(' · ')+'. '+
    'Every consecutive pair shares a border, and every province on every route carries the line the learner is told when they reach it. '+
    'A route whose provinces do not touch would still play perfectly — which is precisely why it is checked here and in <code>test:zambia-game</code>.');

  var oddBad=[];
  FACTS.oddOneOut.forEach(function(o){
    var hold=o.set.filter(function(k){return ruleHolds(k,o.rule);});
    var not=o.set.filter(function(k){return !ruleHolds(k,o.rule);});
    if(hold.length!==3||not.length!==1||not[0]!==o.odd)oddBad.push(o.id+' ('+o.rule+')');
  });
  row('Odd one out is derived, never typed in',oddBad.length?'fail':'pass',
    FACTS.oddOneOut.length+' sets. Each names a rule — '+esc(FACTS.oddOneOut.map(function(o){return o.rule;}).join(', '))+
    ' — that is evaluated against <code>provinces[].borders</code> and the adjacency graph on every render. '+
    'A set is only correct if exactly three of its four satisfy the rule and the fourth is the one declared odd. '+
    (oddBad.length?'FAILING: '+esc(oddBad.join(', ')):'All four hold.'));

  var live=document.querySelectorAll('svg.map .prov[data-hit]').length;
  var dimHit=document.querySelectorAll('svg.map .prov.dim[data-hit]').length;
  var haloHit=document.querySelectorAll('svg.map circle.halo').length;
  row('Dimmed provinces are not tappable at all',dimHit?'fail':'pass',
    (M&&M.id==='odd'?'Odd one out is on screen: '+live+' of the ten provinces carry a hit target and '+haloHit+' carry a halo — the six dimmed ones carry neither, no <code>tabindex</code>, and no halo. ':
     'No odd-one-out question on screen right now; the rule still holds — '+dimHit+' dimmed provinces are tappable. ')+
    'They are excluded from the markup rather than ignored in the handler, so a stray tap, a Tab key and a screen reader all agree with the picture.');

  var m=measureNow();
  if(m){
    var worst=m.items.slice().sort(function(a,b){return a.px-b.px;})[0];
    var small=m.items.filter(function(x){return x.px<TOUCH_MIN;});
    var lu=m.items.filter(function(x){return x.id==='prov:lu';})[0];
    row('Every tappable province is a 44px target at '+m.w+'px',small.length?'fail':'pass',
      'Smallest effective target: <b>'+esc(worst.id.split(':')[1])+'</b> at '+worst.px.toFixed(0)+'px'+
      (lu?'; Lusaka, the province this rule exists for, measures '+lu.px.toFixed(0)+'px':'')+'. '+
      'Anything under 44px gets an invisible halo centred on the label anchor, stacked smallest-last so a small province wins the tap over a big neighbour. Change <b>Phone</b> above and this re-measures.');
  }else row('Touch targets','warn','No tappable map on screen to measure yet — open a mode.');

  if(LASTZONE){
    var wz=LASTZONE.items.slice().sort(function(a,b){return a.px-b.px;})[0];
    row('The eight neighbour boxes are targets too',wz.px<TOUCH_MIN?'fail':'pass',
      'Smallest at '+LASTZONE.w+'px: <b>'+esc(wz.id.split(':')[1])+'</b> at '+wz.px.toFixed(0)+'px. '+
      'Botswana’s real border is a few hundred metres at Kazungula; its box is the same size as everyone else’s, because a tap target is not a scale drawing.');
  }

  var overlap=[];
  FACTS.neighbours.forEach(function(z){
    var r=z.zone,i,j;
    for(i=0;i<=12;i++)for(j=0;j<=12;j++){
      var p=[r[0]+r[2]*i/12,r[1]+r[3]*j/12];
      if(whichProvince(p)&&overlap.indexOf(z.name)<0)overlap.push(z.name);
    }
  });
  row('No neighbour box sits on top of the country',overlap.length?'fail':'pass',
    'All eight boxes sampled on a 13×13 grid against the traced outline: '+(overlap.length?'OVERLAPPING — '+esc(overlap.join(', ')):'none overlaps any province')+'. '+
    'Mozambique’s box does overlap Eastern’s <i>bounding box</i> and not Eastern itself — the same distinction that makes box centres useless for labels.');

  var noHint=[];
  FACTS.capitals.forEach(function(c){if(!c.hint||!c.fact)noHint.push(c.town);});
  FACTS.ceremonies.forEach(function(c){if(!c.hint||!c.monthWhy)noHint.push(c.name);});
  FACTS.neighbours.forEach(function(z){if(!z.hint||!z.fact)noHint.push(z.name);});
  FACTS.oddOneOut.forEach(function(o){if(!o.why)noHint.push(o.id);});
  row('Every wrong answer teaches instead of buzzing',noHint.length?'fail':'pass',
    'Each of the '+(FACTS.capitals.length+FACTS.ceremonies.length+FACTS.neighbours.length+FACTS.oddOneOut.length)+
    ' answerable items carries both a positional hint and the fact behind it. '+
    'Journey mode does not need a written hint at all: it composes its answer from the map, and says something different depending on whether the province tapped touches the one you are standing in — '+
    '"North-Western does touch Copperbelt, but you are heading for Livingstone" is a different lesson from "Northern does not touch Central at all".');

  var cpBad=PROV.projection.checkPoints.filter(function(c){return whichProvince(proj(c.lon,c.lat))!==c.expect;});
  var capOut=FACTS.capitals.filter(function(c){return whichProvince(proj(c.lon,c.lat))!==c.province;});
  row('Capital pins are plotted, not placed by eye',cpBad.length?'fail':(capOut.length?'warn':'pass'),
    'Every town in "Where’s the capital?" is drawn at its real longitude and latitude through the projection in the dataset. '+
    (FACTS.capitals.length-capOut.length)+' of '+FACTS.capitals.length+' land inside the province they belong to'+
    (capOut.length?'; '+esc(capOut.map(function(c){return c.town+' ('+(distToPoly(proj(c.lon,c.lat),G[c.province].pts)*12).toFixed(0)+' km out)';}).join(', '))+
      ' sits just outside, which is the hand trace’s stated resolution of about '+D.positionalAccuracyKm+' km and not a disagreement about which province it is in':'')+'.');

  var glyphless=['ok','no'].filter(function(k){return !STATES[k].glyph;});
  var okShapes=document.querySelectorAll('.prov.ok,.zone.ok').length;
  var okMarks=document.querySelectorAll('text.mark.ok').length;
  var noShapes=document.querySelectorAll('.prov.no,.zone.no').length;
  var noMarks=document.querySelectorAll('text.mark.no').length;
  row('Colour is never the only signal',(!glyphless.length&&okShapes<=okMarks&&noShapes<=noMarks)?'pass':'fail',
    'On screen now: '+okShapes+' correct shapes carrying '+okMarks+' ✓ marks, '+noShapes+' wrong shapes carrying '+noMarks+' ✗ marks. '+
    'Wrong is also a diagonal hatch, and every route province carries its number in the order it was crossed — which is what makes journey mode readable with the colour gone. '+
    'Try <b>Drop the colour</b> in the strip above.');

  /* Measured, not modelled. The first version of this page sized names from the
     bounding box and printed "North-Western" through "Copperbelt"; a character-
     width estimate said the two did not overlap, and the screen said they did.
     So this row asks the renderer for the boxes it actually drew. */
  var labs=document.querySelectorAll('svg.map text.plab'),lb=[],clash=[],li,lj;
  for(li=0;li<labs.length;li++){
    try{var bb=labs[li].getBBox();lb.push({t:labs[li].textContent,b:bb});}catch(e){}
  }
  for(li=0;li<lb.length;li++)for(lj=li+1;lj<lb.length;lj++){
    var A=lb[li].b,B=lb[lj].b;
    if(!(A.x+A.width<B.x||B.x+B.width<A.x||A.y+A.height<B.y||B.y+B.height<A.y))
      clash.push(lb[li].t+' / '+lb[lj].t);
  }
  row('No two province names are printed on top of each other',clash.length?'fail':'pass',
    lb.length+' names on screen, measured with <code>getBBox()</code> at the width actually rendered rather than estimated from a character count. '+
    (clash.length?'OVERLAPPING: '+esc(clash.join(', ')):'None overlaps.')+' '+
    'Sizing comes from the inscribed radius at each anchor, not the bounding box — North-Western’s box is half the country wide while the room around its anchor is not, and box-derived sizing printed its name across Copperbelt.');

  var regions=document.querySelectorAll('svg.map [data-hit]:not(.halo)'),named=0,i2;
  for(i2=0;i2<regions.length;i2++){if(regions[i2].getAttribute('aria-label')&&regions[i2].querySelector('title'))named++;}
  row('Screen readers get names and state, not paths',(regions.length===0||named===regions.length)?'pass':'fail',
    named+' of '+regions.length+' tappable map regions carry both an <code>aria-label</code> naming the place AND its state, and a <code>&lt;title&gt;</code>. '+
    'Tab reaches them and Enter or Space answers.');

  row('No mode has a timer','pass',
    'None of the five declares a limit, and there is no clock in the file — no countdown, no interval, no penalty for a slow answer. '+
    'A mode ends when everything has been answered, including the items that caught the learner the first time, which come back once the queue empties.');

  $('panel').innerHTML='<h3>Acceptance, run against the data actually loaded</h3>'+
   '<p class="lead">Every row is recomputed on each render from <code>zambia_provinces.json</code> and <code>zambia_facts.json</code> — not from a list somebody kept up to date. '+
   'Change a dataset and the rows change with it. <b>'+ok+' pass, '+bad+' fail, '+(rows.length-ok-bad)+' need a person.</b></p>'+
   '<table>'+rows.map(function(r){
     return '<tr><td class="v '+(r.s==='pass'?'pass':(r.s==='fail'?'fail':'warn'))+'">'+(r.s==='pass'?'PASS':(r.s==='fail'?'FAIL':'TO DO'))+'</td>'+
       '<td class="v">'+r.n+'</td><td>'+r.t+'</td></tr>';
   }).join('')+'</table>';
}

/* ---------- notes column ---------- */
function notes(){
  $('notes').innerHTML=
  '<div class="note"><h3>One map, five rule sets</h3>The province outlines, the label anchors and now the adjacency graph all live in <code>zambia_provinces.json</code>; every fact lives in <code>zambia_facts.json</code>. Each mode here is a handful of rules over that data, not another drawing of Zambia. That is the return on getting the map right once — and the sibling prototype’s test already forbids pasting a province path back into the page.</div>'+
  '<div class="note warn"><h3>Journey mode is the one worth building</h3>Naming the provinces between Livingstone and Kasama teaches <b>adjacency and scale</b> — which province touches which, and what 1,300 km actually costs you — and neither is reachable by a place-the-label game. It is also how a Zambian child really meets the country: out of a bus window, along the Great North Road. Four routes are here; the sequences are data, so a fifth is an entry in a file.</div>'+
  '<div class="note"><h3>A wrong turn is answered from the map</h3>Journey mode does not keep a written hint per province. It looks at where you are standing and what you tapped, and says one of four things: you have been there already · that is not where you start · <b>it does touch this province, but the road goes the other way</b> · <b>it does not touch this province at all, so you cannot get there from here</b>. The last two are different mistakes and they earn different answers.</div>'+
  '<div class="note"><h3>Odd one out is derived, not authored</h3>Each set declares a <i>rule</i> — <code>borders:cd</code>, <code>borders:any</code>, <code>touches:ce</code> — and the page evaluates it against the data on every render. Nobody types in which province is the odd one. Two of the four turn on things worth knowing: <b>Central touches no other country</b>, and <b>Central borders eight of the other nine provinces</b> — every one except Northern.</div>'+
  '<div class="note"><h3>The dimmed six are not tappable</h3>They carry no hit target, no <code>tabindex</code> and no touch halo — excluded from the markup, not ignored by the handler. A tap, a Tab key and a screen reader then all agree with what the picture is saying.</div>'+
  '<div class="note warn"><h3>Never use a bounding-box centre</h3>Central wraps around Copperbelt, so its box centre lands <i>inside Copperbelt</i>. So does Eastern’s, in Muchinga, and Luapula’s, in Northern — three of ten. The dataset carries the pole of inaccessibility as <code>c</code>, and every label, ✓ mark and touch halo on this page uses it. The panel below computes both and prints the three that move.</div>'+
  '<div class="note"><h3>Not everything should be a map</h3>Five map modes plus the two already in the main game is plenty. The ceremony round is deliberately only one-third map: tap the province, then answer <i>whose</i> and <i>when</i> as plain options. A learner who only ever taps a map stops reading the question.</div>'+
  '<div class="note warn"><h3>Our neighbours already exists</h3>Mode 4 is the same exercise as the neighbours level in <code>zedexams-zambia-game.html</code>, reading the same eight zones. It is built here because the brief asked for five modes, but it should ship in one place or the other — not both. The other four are new.</div>'+
  '<div class="note"><h3>Same rules as everywhere else</h3>No timer, on any mode. A wrong tap names what was tapped and then teaches; nothing buzzes. Correct and wrong are a glyph and a pattern before they are a colour, and the route provinces carry their crossing order as a number — so <b>Drop the colour</b> leaves the map still readable. Missed items come back once the queue empties.</div>'+
  '<div class="note warn"><h3>Still unverified</h3>The three fact classes added for these modes — which countries each province borders, the four route sequences, and the rounded road distances printed to learners — are named in <code>verification.requiredBeforeRelease</code> and need the same Zambian teacher pass as the rest. One boundary is called out as genuinely unsettled: whether Southern Province faces Namibia across the Zambezi near Kazungula, where four countries meet at almost a point. Nothing the game asks turns on it.</div>';
}

/* ---------- wiring ---------- */
function fillRig(){
  $('rMode').innerHTML='<option value="">— the menu —</option>'+
    MODES.map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+'</option>';}).join('');
  $('rMode').onchange=function(){if(this.value)startMode(this.value);else menu();};
  $('rWidth').onchange=function(){
    var ps=document.querySelectorAll('.phone'),i;
    for(i=0;i<ps.length;i++)ps[i].className='phone'+(this.value?' '+this.value:'');
    fitHalos();runChecks();
  };
  $('rMenu').onclick=function(){$('rMode').value='';menu();};
  $('rMono').onchange=function(){document.body.classList.toggle('nocolour',this.checked);runChecks();};
  $('hBack').onclick=function(){
    if(view==='mode'&&M&&M.id==='journey'){view='routes';reset();render();return;}
    $('rMode').value='';menu();
  };
  $('rSrc').textContent=SRCFETCHED?('reading '+SRCNAME):'inline mirror — the datasets were not fetched';
  $('rSrc').className='chk '+(SRCFETCHED?'':'idle');
  $('rVerify').textContent='map '+PROV.dataset.verification.status.toLowerCase()+' · facts '+FACTS.dataset.verification.status.toLowerCase();
}

/* ---------- boot ---------- */
loadData().then(function(){
  ADJ=PROV.adjacency.edges;
  PKEYS.forEach(function(k){
    var pts=parsePath(PROV.provinces[k].d);
    G[k]={pts:pts,bbox:bbox(pts),area:areaOf(pts),inscribed:distToPoly(PROV.provinces[k].c,pts)};
  });
  buildModes();fillRig();notes();menu();
  window.addEventListener('resize',function(){fitHalos();runChecks();});
});
})();
</script>
</body></html>
