<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZedExams — Know Zambia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ind:#5b5bd6;--ind-soft:#ececfb;--ink:#1c2333;--muted:#6b7392;--bg:#eef0fb;
--coral:#ff7a4d;--coral-2:#f4592c;--gold:#f5b820;--line:#e6e8f5;--r:18px;
/* Okabe-Ito. Correct and wrong are told apart by GLYPH and PATTERN first; the
   colours only agree with the glyph. They are near-identical in greyscale,
   which is the whole reason the glyph is not optional. */
--ok:#009e73;--ok-ink:#04674c;--ok-soft:#e7f5f0;--ok-line:#bfe4d8;
--no:#d55e00;--no-ink:#8f3f00;--no-soft:#fdeee4;--no-line:#f6d3ba;
--anchor:#a8b3d6;--anchor-ink:#333a58;--land:#d7dff2}
*{box-sizing:border-box}
body{margin:0;background:#dfe3f5;font-family:Nunito,system-ui,sans-serif;color:var(--ink);padding:22px 14px 50px}
h1.pt{text-align:center;margin:0 0 4px;font-size:25px}
p.ps{text-align:center;color:#5a6180;margin:0 0 16px;font-size:13.5px}

/* ---- prototype control strip (not part of the app) ---- */
.rig{max-width:1180px;margin:0 auto 18px;background:#fff;border-radius:14px;padding:12px 15px;
display:flex;gap:13px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:#4b5270}
.rig b{color:var(--ink)}
.rig label{display:flex;gap:6px;align-items:center;font-weight:800}
.rig select,.rig button{font:inherit;font-weight:800;font-size:12.5px;border-radius:9px;border:1.5px solid var(--line);
background:#fff;color:var(--ind);padding:6px 10px;cursor:pointer}
.rig .sep{flex:1}
.rig .chk{background:var(--ok-soft);color:var(--ok-ink);border:1px solid var(--ok-line);border-radius:999px;padding:4px 11px;font-weight:800}
.rig .chk.bad{background:var(--no-soft);color:var(--no-ink);border-color:var(--no-line)}
.rig .chk.idle{background:var(--bg);color:var(--muted);border-color:var(--line)}

.stage{display:flex;gap:22px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:356px;height:752px;background:var(--bg);border-radius:34px;overflow:hidden;position:relative;
box-shadow:0 14px 40px rgba(40,44,90,.22);border:7px solid #12142a;display:flex;flex-direction:column}
.phone.w320{width:320px}.phone.w360{width:360px}.phone.w412{width:412px}
.notes{width:356px}
.note{background:#fff;border-radius:14px;padding:13px 15px;font-size:12.5px;line-height:1.6;color:#4b5270;border-left:4px solid var(--ind);margin-bottom:11px}
.note b{color:var(--ink)} .note h3{margin:0 0 5px;font-size:13.5px;color:var(--ink)} .note.warn{border-left-color:#e0a020}
.note code{background:#f2f3fb;border-radius:5px;padding:1px 5px;font-size:11.5px}

.top{padding:11px 14px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex:0 0 auto}
.back{width:32px;height:32px;border-radius:10px;background:var(--bg);border:none;display:grid;place-items:center;color:var(--ind);font-size:16px;font-family:inherit;cursor:pointer}
.ttl{font-weight:900;font-size:15px;line-height:1.2}
.ttl small{display:block;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.chip{margin-left:auto;background:var(--ok-soft);color:var(--ok-ink);border:1px solid var(--ok-line);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.body{padding:12px;flex:1;overflow-y:auto}.body::-webkit-scrollbar{width:0}
.card{background:#fff;border-radius:var(--r);padding:13px;margin-bottom:10px}
.card.tight{padding:8px 8px 6px}
.kick{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.q{font-size:15.5px;font-weight:800;line-height:1.45}
.q b{color:var(--ind)}

/* ---- the map ---- */
svg.map{width:100%;display:block;touch-action:manipulation;overflow:visible}
.prov{fill:var(--land);stroke:#fff;stroke-width:.5;transition:fill .18s}
.prov[data-hit]{cursor:pointer}
.prov[data-hit]:hover{fill:#c3cdea}
.prov.anchor{fill:var(--anchor)}
.prov.ok{fill:var(--ok)}
.prov.no{fill:url(#hatch)}
.prov.dim{fill:#eef1fa}
.prov:focus{outline:none;stroke:var(--ind);stroke-width:1.4}
.zone{fill:#fff;stroke:#b9c0da;stroke-width:.7;stroke-dasharray:2.4 2;cursor:pointer;rx:2}
.zone.ok{fill:var(--ok);stroke:var(--ok)}
.zone.no{fill:url(#hatch);stroke:var(--no)}
.zone:focus{outline:none;stroke:var(--ind);stroke-width:1.6}
.zlab{font-size:3.1px;font-weight:800;fill:var(--muted);text-anchor:middle;pointer-events:none}
.zlab.on{fill:#fff}
.plab{font-weight:900;fill:#fff;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.18);stroke-width:.35}
.plab.dark{fill:var(--anchor-ink);stroke:rgba(255,255,255,.7)}
.mark{font-weight:900;text-anchor:middle;pointer-events:none;font-size:4.2px;paint-order:stroke;stroke:#fff;stroke-width:.9}
.mark.ok{fill:#fff;stroke:rgba(0,0,0,.25)}
.mark.no{fill:var(--no-ink)}
.riv{fill:none;stroke:#4a86c8;stroke-width:.9;stroke-linejoin:round;stroke-linecap:round}
.riv.on{stroke:#12508f;stroke-width:1.5}
.lake{fill:#a9cdea;stroke:#4a86c8;stroke-width:.5}
.lake[data-hit]{cursor:pointer}
.lake.ok{fill:var(--ok);stroke:var(--ok-ink)}
.lake.no{fill:url(#hatch);stroke:var(--no)}
.wlab{font-size:2.7px;font-weight:800;fill:#12508f;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:.8}
.pin circle{fill:var(--coral-2);stroke:#fff;stroke-width:.6}
.pin text{font-size:3px;font-weight:900;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:1}
.halo{fill:transparent;cursor:pointer}
.halo:focus{outline:none}
body.nocolour svg.map{filter:grayscale(1)}

/* ---- name chips (tap-to-place) ---- */
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.pc{background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:13px;font-weight:800;
cursor:pointer;color:var(--ink);box-shadow:0 2px 0 #ccd2e6;min-height:44px;touch-action:manipulation}
.pc:active{transform:translateY(2px);box-shadow:none}
.pc.sel{border-color:var(--ind);background:var(--ind-soft);color:var(--ind);box-shadow:0 0 0 3px rgba(91,91,214,.16)}
.pc.gone{opacity:.4;pointer-events:none;background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-ink);box-shadow:none}
.pc.drag{cursor:grab}
.hint{text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin:9px 0 3px}
.hint b{color:var(--ind)}
.opts{display:grid;gap:8px;margin-top:2px}
.opt{background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:13px;font:inherit;font-size:15px;font-weight:800;
cursor:pointer;color:var(--ink);text-align:left;min-height:48px;display:flex;gap:9px;align-items:center}
.opt .g{width:22px;flex:0 0 auto;font-size:15px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.opt.no{border-color:var(--no);background:var(--no-soft);color:var(--no-ink)}
.fb{border-radius:14px;padding:12px;margin-top:10px;font-size:13px;line-height:1.6}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--ok-ink)}
.fb.no{background:var(--no-soft);border:1px solid var(--no-line);color:var(--no-ink)}
.fb.say{background:var(--bg);border:1px solid var(--line);color:#4b5270}
.fb .t{font-weight:900;font-size:14px;margin-bottom:3px;display:flex;gap:6px;align-items:baseline}
.btn{width:100%;padding:13px;border:none;border-radius:14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px;min-height:48px}
.btn-coral{background:linear-gradient(180deg,var(--coral),var(--coral-2));color:#fff}
.btn-ghost{background:#fff;color:var(--ind);border:1.5px solid var(--line);font-size:14px}
.prov-src{font-size:10.5px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.5}

/* ---- level ladder ---- */
.lv{background:#fff;border-radius:14px;padding:11px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;width:100%;
border:2px solid transparent;font:inherit;text-align:left;cursor:pointer}
.lv.cur{border-color:var(--ind)}
.lv.lock{opacity:.6;cursor:default}
.bd{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:15px;color:#fff;flex:0 0 auto}
.b-done{background:var(--ok)}.b-now{background:linear-gradient(180deg,var(--coral),var(--coral-2))}.b-lock{background:#cfd4e8;color:#8f97b5}
.nm{font-weight:900;font-size:13.5px;line-height:1.25}
.ds{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.rt{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:800;white-space:nowrap;padding-left:6px}
.sec{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:12px 0 7px}
.flagbox{display:flex;justify-content:center;margin:2px 0 8px}

/* ---- self-check panel ---- */
.panel{max-width:1180px;margin:26px auto 0;background:#151a2e;border-radius:16px;padding:18px 20px;color:#c9cfe6;font-size:12.5px;line-height:1.65}
.panel h3{margin:0 0 4px;font-size:14.5px;color:#fff}
.panel p.lead{margin:0 0 12px;color:#939cc0}
.panel table{width:100%;border-collapse:collapse}
.panel td{padding:5px 8px 5px 0;vertical-align:top;border-bottom:1px solid #232945}
.panel td.v{white-space:nowrap;font-weight:800}
.panel .pass{color:#4fd6a6}.panel .fail{color:#ff9a6b}.panel .warn{color:#f3c65f}
.panel code{background:#232945;border-radius:5px;padding:1px 5px;color:#dfe4f7}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:820px){.stage{display:block}.phone,.notes{width:100%;max-width:360px;margin:0 auto 22px}}
</style></head><body>

<h1 class="pt">Know Zambia</h1>
<p class="ps">Geography &amp; heritage, map-led. Tap a name, then tap where it goes.</p>

<div class="rig">
  <label>Level
    <select id="rLevel"></select>
  </label>
  <label>Phone
    <select id="rWidth"><option value="w320">320px</option><option value="w360" selected>360px</option><option value="">356px</option><option value="w412">412px</option></select>
  </label>
  <button id="rUnlock" type="button">Unlock all levels</button>
  <button id="rReset" type="button">Reset progress</button>
  <label><input type="checkbox" id="rMono"> Drop the colour</label>
  <span class="sep"></span>
  <span class="chk idle" id="rSrc">loading…</span>
  <span class="chk bad" id="rVerify">unverified</span>
</div>

<div class="stage">
  <div class="phone w360" id="phone">
    <div class="top">
      <button class="back" id="hBack" type="button" aria-label="Back to the level list">‹</button>
      <div class="ttl" id="hTtl">Know Zambia<small id="hSub">level</small></div>
      <div class="chip" id="hChip">0 / 0</div>
    </div>
    <div class="body" id="scr"></div>
  </div>

  <div class="phone w360">
    <div class="top"><button class="back" type="button" aria-hidden="true" tabindex="-1">‹</button>
      <div class="ttl">Know Zambia<small>nine levels</small></div><div class="chip" id="lChip">⭐ 0</div></div>
    <div class="body" id="ladder"></div>
  </div>

  <div class="notes" id="notes"></div>
</div>

<div class="panel" id="panel"></div>

    var c=st[k]||'';if(c!=='ok'&&c!=='anchor')return;
    var a=PROV.provinces[k].c,fs=labelSize(k);
    s+='<text class="plab'+(c==='anchor'?' dark':'')+'" x="'+a[0]+'" y="'+a[1]+'" style="font-size:'+fs.toFixed(2)+'px">'+esc(nameOf(k))+'</text>';
    if(c==='ok')s+='<text class="mark ok" x="'+a[0]+'" y="'+(a[1]-fs-1.2)+'">✓</text>';
  });
  PKEYS.forEach(function(k){
    if(st[k]!=='no')return;var a=PROV.provinces[k].c;
    s+='<text class="mark no" x="'+a[0]+'" y="'+a[1]+'">✗</text>';
  });
  if(o.pin){
    var p=proj(o.pin.lon,o.pin.lat);
    s+='<g class="pin"><circle cx="'+p[0].toFixed(2)+'" cy="'+p[1].toFixed(2)+'" r="1.5"></circle>'+
       '<text x="'+p[0].toFixed(2)+'" y="'+(p[1]-2.6).toFixed(2)+'">'+esc(o.pin.label)+'</text></g>';
  }
  /* Touch halos. Every target gets one; fitHalos() gives it a radius only when
     the shape itself measures under 44px at the width actually rendered. Small
     shapes are stacked last so their halo wins the tap over a big neighbour. */
  if(o.hit==='prov'){
    s+='<g class="halos">';
    PKEYS.slice().sort(function(a,b){return G[b].area-G[a].area;}).forEach(function(k){
      var a=PROV.provinces[k].c,b=G[k].bbox;
      s+='<circle class="halo" data-hit="prov:'+k+'" data-min="'+Math.min(b.w,b.h).toFixed(2)+'" cx="'+a[0]+'" cy="'+a[1]+'" r="0" aria-hidden="true"></circle>';
    });
    s+='</g>';
  }
  if(o.hit==='zone'){
    s+='<g class="halos">';
    FACTS.neighbours.slice().sort(function(a,b){return(b.zone[2]*b.zone[3])-(a.zone[2]*a.zone[3]);}).forEach(function(z){
      if(st['z_'+z.code])return;
      var r=z.zone;
      s+='<circle class="halo" data-hit="zone:'+z.code+'" data-min="'+Math.min(r[2],r[3])+'" cx="'+(r[0]+r[2]/2)+'" cy="'+(r[1]+r[3]/2)+'" r="0" aria-hidden="true"></circle>';
    });
    s+='</g>';
  }
  if(o.hit==='lake'){
    s+='<g class="halos">';
    FACTS.water.lakes.slice().sort(function(a,b){return(b.rx*b.ry)-(a.rx*a.ry);}).forEach(function(l){
      var p=proj(l.lon,l.lat);
      s+='<circle class="halo" data-hit="lake:'+l.id+'" data-min="'+(Math.min(l.rx,l.ry)*2).toFixed(2)+'" cx="'+p[0].toFixed(2)+'" cy="'+p[1].toFixed(2)+'" r="0" aria-hidden="true"></circle>';
    });
    s+='</g>';
  }
  return s+'</svg>';
}
function fitHalos(){
  var svgs=document.querySelectorAll('svg.map'),i,measured=[];
  for(i=0;i<svgs.length;i++){
    var svg=svgs[i],w=svg.getBoundingClientRect().width;if(!w)continue;
    var vb=svg.getAttribute('viewBox').split(/\s+/).map(Number),scale=w/vb[2];
    var hs=svg.querySelectorAll('circle.halo'),j;
    for(j=0;j<hs.length;j++){
      var minPx=parseFloat(hs[j].getAttribute('data-min'))*scale;
      var r=minPx>=TOUCH_MIN?0:(TOUCH_MIN/2)/scale;
      /* Round the radius UP, not to nearest. At 320px the ideal radius is
         8.270677 user units and toFixed(2) gives 8.27 — a 43.996px target,
         which fails the 44px rule this line exists to keep, and turns the
         page's own acceptance row red at the narrowest width it supports.
         Two hundredths of a unit too big costs nothing; a hair too small
         costs the guarantee. */
      hs[j].setAttribute('r',r?(Math.ceil(r*100)/100).toFixed(2):'0');
      measured.push({id:hs[j].getAttribute('data-hit'),px:Math.max(minPx,r*2*scale)});
    }
  }
  return measured;
}

/* ---------- flag (drawn simply — it is a teaching prop, not the standard) ---------- */
function flagSvg(){
  return '<svg viewBox="0 0 90 60" width="150" height="100" role="img" aria-label="The flag of Zambia: a green field, three stripes in red, black and orange in the bottom corner nearest the fly, and an orange eagle above them.">'+
   '<rect width="90" height="60" fill="#198a00"></rect>'+
   '<rect x="57" y="34" width="10" height="26" fill="#de2010"></rect>'+
   '<rect x="68" y="34" width="10" height="26" fill="#000"></rect>'+
   '<rect x="79" y="34" width="10" height="26" fill="#ef7d00"></rect>'+
   '<path d="M60 26 C64 16, 72 14, 74 20 C77 13, 85 16, 85 24 C82 21, 78 22, 76 26 C73 22, 66 21, 60 26 Z" fill="#ef7d00"></path>'+
   '<path d="M72 24 L74 31 L77 24 Z" fill="#ef7d00"></path></svg>';
}

/* ---------- game state ---------- */
var view='level',flash=null;
function startLevel(ix){levelIx=ix;stepIx=0;sel=null;fb=null;answered=false;flash=null;
  run={placed:{},zplaced:{},score:0,done:0,tries:0,resolved:false,picked:null};view='level';render();}
function stepState(){
  var s=LEVELS[levelIx].steps[stepIx],st={};
  if(!s)return st;
  if(s.t==='place'){for(var k in run.placed)st[k]=(run.placed[k]===stepIx?'ok':'anchor');}
  if(s.t==='zone'){for(var z in run.zplaced)st['z_'+z]='ok';}
  if(s.t==='map'&&run.resolved)st[run.rightKey]='ok';
  if(s.t==='lake'&&run.resolved)st['w_'+s.a]='ok';
  if(flash)st[flash]='no';
  return st;
}
function progressChip(){var L=LEVELS[levelIx];return run.done+' / '+L.count;}

function render(){
  if(view==='ladder'){renderLadder();$('scr').innerHTML=laddScreen();fitHalos();return;}
  var L=LEVELS[levelIx],s=L.steps[stepIx];
  $('hTtl').innerHTML=L.name+'<small>Level '+L.id+' of 9</small>';
  $('hChip').textContent=stepIx>=L.steps.length?('⭐ '+run.score+' / '+L.count):progressChip();
  if(stepIx>=L.steps.length){$('scr').innerHTML=doneScreen();renderLadder();return;}
  var st=stepState(),h='';
  if(s.t==='place'||s.t==='zone'){
    var isZone=s.t==='zone',pool=s.items,done=isZone?run.zplaced:run.placed;
    var left=pool.filter(function(k){return!(k in done);});
    h+='<div class="card"><div class="kick">'+s.kick+'</div><div class="q">'+s.intro+'</div></div>';
    h+='<div class="card tight">'+svgMap({viewBox:isZone?VB_WORLD:VB_MAIN,state:st,hit:isZone?'zone':'prov',zones:isZone})+'</div>';
    h+='<div class="hint">'+(left.length?(sel?'Now tap where <b>'+esc(labelFor(sel,isZone))+'</b> goes':'Tap a name, then tap where it goes'):'All placed.')+'</div>';
    h+='<div class="chips">'+pool.map(function(k){
      var gone=(k in done);
      return '<button class="pc'+(gone?' gone':'')+(sel===k?' sel':'')+'" type="button" data-act="pick:'+k+'"'+
        (gone?' disabled aria-label="'+esc(labelFor(k,isZone))+', placed"':' aria-pressed="'+(sel===k)+'"')+'>'+
        (gone?'✓ ':'')+esc(labelFor(k,isZone))+'</button>';
    }).join('')+'</div>';
    h+=fbHtml();
    if(!left.length)h+='<button class="btn btn-coral" type="button" data-act="next">'+(stepIx+1<L.steps.length?'Next round →':'Finish →')+'</button>';
  } else if(s.t==='map'||s.t==='lake'){
    h+='<div class="card"><div class="kick">'+s.kick+'</div><div class="q">'+s.q+'</div></div>';
    h+='<div class="card tight">'+svgMap({
        viewBox:(s.t==='lake'||s.water)?VB_WATER:VB_MAIN,state:st,
        hit:run.resolved?null:(s.t==='lake'?'lake':'prov'),
        water:(s.t==='lake'||s.water),river:run.resolved?s.river:null,
        nameWater:s.t==='lake'&&run.resolved,
        pin:run.resolved?s.pin:null})+
      '<div class="prov-src">Outlines: '+esc(SRCNAME.split(' + ')[0])+' · traced '+esc(PROV.dataset.traced)+' · '+esc(PROV.dataset.verification.status.toLowerCase())+'</div></div>';
    if(!run.resolved)h+='<div class="hint">'+(s.t==='lake'?'Tap the lake on the map':'Tap the province on the map')+'</div>';
    h+=fbHtml();
    if(run.resolved)h+='<button class="btn btn-coral" type="button" data-act="next">'+(stepIx+1<L.steps.length?'Next →':'Finish →')+'</button>';
  } else if(s.t==='ask'){
    h+='<div class="card"><div class="kick">'+s.kick+'</div>'+(s.flag?'<div class="flagbox">'+flagSvg()+'</div>':'')+'<div class="q">'+s.q+'</div></div>';
    h+='<div class="opts" role="group">'+s.options.map(function(o){
      var cls='',g='';
      if(run.resolved){
        if(o===s.answer){cls=' ok';g='✓';}
        else if(o===run.picked){cls=' no';g='✗';}
      }
      return '<button class="opt'+cls+'" type="button"'+(run.resolved?' disabled':'')+' data-act="ans:'+encodeURIComponent(o)+'">'+
        '<span class="g" aria-hidden="true">'+(g||'·')+'</span><span>'+esc(o)+'</span></button>';
    }).join('')+'</div>';
    h+=fbHtml();
    if(run.resolved)h+='<button class="btn btn-coral" type="button" data-act="next">'+(stepIx+1<L.steps.length?'Next →':'Finish →')+'</button>';
  }
  $('scr').innerHTML=h;
  fitHalos();renderLadder();runChecks();
}
function labelFor(k,isZone){
  if(isZone){var z=zoneOf(k);return z?z.name:k;}
  return nameOf(k);
}
function zoneOf(code){var r=null;FACTS.neighbours.forEach(function(z){if(z.code===code)r=z;});return r;}
function fbHtml(){
  var out='<div id="fb" aria-live="polite">';
  if(fb)out+='<div class="fb '+fb.k+'"><div class="t"><span aria-hidden="true">'+(fb.g||'')+'</span><span>'+fb.t+'</span></div>'+fb.b+'</div>';
  return out+'</div>';
}
function say(kind,glyph,title,body){fb={k:kind,g:glyph,t:title,b:body};}

/* ---------- answering ---------- */
function hit(token){
  var s=LEVELS[levelIx].steps[stepIx];if(!s)return;
  var bits=token.split(':'),kind=bits[0],key=bits[1];
  if((s.t==='place'&&kind==='prov')||(s.t==='zone'&&kind==='zone'))return placeAttempt(s,key);
  if(s.t==='map'&&kind==='prov')return mapAttempt(s,key);
  if(s.t==='lake'&&kind==='lake')return lakeAttempt(s,key);
}
function flashWrong(k){flash=k;render();setTimeout(function(){flash=null;render();},900);}
function placeAttempt(s,key){
  var isZone=s.t==='zone',done=isZone?run.zplaced:run.placed;
  if(!sel){say('say','','Pick a name first','Tap one of the names below, then tap where it goes on the map.');render();return;}
  if(key===sel){
    done[key]=stepIx;run.done++;if(!run.tries)run.score++;run.tries=0;
    var nm=labelFor(key,isZone);
    say('ok','✓',nm+' — correct',isZone?zoneOf(key).fact:FACTS.provinces[key].fact);
    sel=null;render();
  }else{
    run.tries++;
    var wrongName=labelFor(key,isZone),hintTxt=isZone?zoneOf(sel).hint:FACTS.provinces[sel].hint;
    say('no','✗','That one is '+wrongName,hintTxt+' Try again — nothing is lost.');
    flashWrong(isZone?('z_'+key):key);
  }
}
function mapAttempt(s,key){
  if(run.resolved)return;
  if(s.a.indexOf(key)>=0){
    run.rightKey=key;run.resolved=true;run.done++;if(!run.tries)run.score++;run.tries=0;
    say('ok','✓',nameOf(key)+' Province',s.fact+(s.a.length>1?' <b>'+esc(spansNote(s))+'</b>':''));
    render();
  }else{
    run.tries++;
    if(run.tries>=3){
      run.rightKey=s.a[0];run.resolved=true;run.done++;run.tries=0;
      say('no','✗','It is '+nameOf(s.a[0])+' — shown on the map',s.hint+' '+s.fact);
      render();
    }else{
      say('no','✗','That is '+nameOf(key),s.hint+' Try again.');
      flashWrong(key);
    }
  }
}
function lakeAttempt(s,key){
  if(run.resolved)return;
  if(key===s.a){
    run.resolved=true;run.done++;if(!run.tries)run.score++;run.tries=0;
    say('ok','✓',lakeName(key)+' — correct',s.fact);render();
  }else{
    run.tries++;
    if(run.tries>=3){run.resolved=true;run.done++;run.tries=0;say('no','✗','It is '+lakeName(s.a),s.hint+' '+s.fact);render();}
    else{say('no','✗','That is '+lakeName(key),s.hint+' Try again.');flashWrong('w_'+key);}
  }
}
function lakeName(id){var n=id;FACTS.water.lakes.forEach(function(l){if(l.id===id)n=l.name;});return n;}
function spansNote(s){var n='';FACTS.parks.forEach(function(p){if(p.spansNote&&p.provinces.join()===s.a.join())n=p.spansNote;});return n;}
function answer(opt){
  var s=LEVELS[levelIx].steps[stepIx];if(run.resolved)return;
  run.picked=opt;run.resolved=true;run.done++;
  if(opt===s.answer){run.score++;say('ok','✓',esc(s.answer),s.why);}
  else say('no','✗','It is '+esc(s.answer),s.whyWrong||s.why);
  render();
}
function next(){
  var L=LEVELS[levelIx];
  stepIx++;run.resolved=false;run.tries=0;run.picked=null;run.rightKey=null;fb=null;sel=null;flash=null;
  if(stepIx>=L.steps.length){
    unlocked[L.id]=true;unlocked[L.id+1]=true;bank();
  }
  render();
}

/* ---------- finish + level ladder ---------- */
function doneScreen(){
  var L=LEVELS[levelIx],full=run.score===L.count;
  var learned=[];
  L.steps.forEach(function(s){
    if(s.t==='map'&&s.pin)learned.push('<b>'+esc(s.pin.label)+'</b> — '+esc(nameOf(s.a[0]))+' Province');
    if(s.t==='ask'&&learned.length<6)learned.push('<b>'+esc(s.answer)+'</b>');
  });
  learned=learned.slice(0,5);
  var nextL=LEVELS[levelIx+1];
  return '<div class="card" style="text-align:center"><div style="font-size:38px" aria-hidden="true">🇿🇲</div>'+
   '<div style="font-size:20px;font-weight:900;margin-top:4px">Level '+L.id+' cleared</div>'+
   '<div style="font-size:12.5px;color:var(--muted);margin-top:4px">'+run.score+' of '+L.count+' right first time'+
   (full?' — every one.':'. The ones you missed come back next time.')+'</div></div>'+
   (learned.length?'<div class="card"><div class="kick">Coming back for you</div><div style="font-size:12.5px;line-height:1.9;color:#4b5270">📌 '+learned.join('<br>📌 ')+'</div></div>':'')+
   (nextL?'<button class="btn btn-coral" type="button" data-act="level:'+(levelIx+1)+'">Level '+nextL.id+' · '+nextL.name+' →</button>':
          '<div class="card"><div class="kick">All nine done</div><div style="font-size:13px;color:#4b5270;line-height:1.6">That is the whole map, the capitals, the districts, the water, the heritage, the ceremonies, the parks, the neighbours and the symbols.</div></div>')+
   '<button class="btn btn-ghost" type="button" data-act="ladder">Back to the levels</button>'+
   '<button class="btn btn-ghost" type="button" data-act="level:'+levelIx+'">Play this level again</button>';
}
function ladderHtml(){
  var groups=[],seen={},out='';
  LEVELS.forEach(function(l){if(!seen[l.group]){seen[l.group]=1;groups.push(l.group);}});
  groups.forEach(function(g){
    out+='<div class="sec">'+g+'</div>';
    LEVELS.forEach(function(l,i){
      if(l.group!==g)return;
      var open=!!unlocked[l.id],done=!!(progress[l.id]&&progress[l.id].done),cur=(i===levelIx&&view==='level');
      var badge=done?'b-done':(open?'b-now':'b-lock');
      out+='<button class="lv'+(open?'':' lock')+(cur?' cur':'')+'" type="button"'+(open?' data-act="level:'+i+'"':' disabled')+'>'+
        '<div class="bd '+badge+'" aria-hidden="true">'+(done?'✓':l.id)+'</div>'+
        '<div><div class="nm">'+l.name+'</div><div class="ds">'+l.blurb+'</div></div>'+
        '<div class="rt">'+(open?(progress[l.id]?progress[l.id].score+' / '+l.count:l.count+' to do'):'🔒 level '+(l.id-1)+' first')+'</div></button>';
    });
  });
  return out;
}
function renderLadder(){
  $('ladder').innerHTML=ladderHtml();
  var done=0;LEVELS.forEach(function(l){if(progress[l.id])done+=progress[l.id].score;});
  $('lChip').textContent='⭐ '+done;
}
function laddScreen(){
  $('hTtl').innerHTML='Know Zambia<small>pick a level</small>';
  $('hChip').textContent=Object.keys(unlocked).length-1+' / 9 open';
  return '<div class="card"><div class="kick">Zambia · 10 provinces</div>'+svgMap({state:allAnchors()})+
    '<div class="prov-src">'+esc(PROV.provinces.mu.createdNote)+'</div></div>'+ladderHtml();
}
function allAnchors(){var st={};PKEYS.forEach(function(k){st[k]='anchor';});return st;}

/* ---------- progress ---------- */
var progress={},KEY='zed:zambia:v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({unlocked:unlocked,progress:progress}));}catch(e){}}
function load(){try{var r=JSON.parse(localStorage.getItem(KEY)||'{}');if(r.unlocked)unlocked=r.unlocked;if(r.progress)progress=r.progress;}catch(e){}unlocked[1]=true;}
function bank(){var L=LEVELS[levelIx];var p=progress[L.id];if(!p||p.score<run.score)progress[L.id]={done:true,score:run.score};save();}

/* ============================================================================
   THE ACCEPTANCE CHECKS — run live, against the data actually loaded
   ========================================================================== */
var LASTMEASURE=null,LASTZONE=null;
function measureNow(){var m=fitHalos(),w=Math.round($('phone').getBoundingClientRect().width);
  var pv=m.filter(function(x){return x.id.indexOf('prov:')===0;});
  var zn=m.filter(function(x){return x.id.indexOf('zone:')===0;});
  if(pv.length)LASTMEASURE={w:w,items:pv};
  if(zn.length)LASTZONE={w:w,items:zn};
  return LASTMEASURE;}
function segDist(p,a,b){var dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;
  var t=l?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l)):0;
  var x=a[0]+t*dx-p[0],y=a[1]+t*dy-p[1];return Math.sqrt(x*x+y*y);}
function distToPoly(p,pts){var d=1e9;for(var i=0,j=pts.length-1;i<pts.length;j=i++){d=Math.min(d,segDist(p,pts[j],pts[i]));}return d;}
function allPins(){
  var out=[];
  FACTS.capitals.forEach(function(c){out.push({label:c.town,lon:c.lon,lat:c.lat,p:c.province});});
  FACTS.districts.forEach(function(d){out.push({label:d.district,lon:d.lon,lat:d.lat,p:d.province});});
  FACTS.heritage.forEach(function(h){out.push({label:h.name,lon:h.lon,lat:h.lat,p:h.province});});
  FACTS.parks.forEach(function(k){if(k.provinces.length===1)out.push({label:k.name,lon:k.lon,lat:k.lat,p:k.provinces[0]});});
  return out;
}
function runChecks(){
  var rows=[],D=PROV.dataset,V=D.verification,ok=0,bad=0;
  function row(name,state,text){rows.push({n:name,s:state,t:text});if(state==='fail')bad++;else if(state==='pass')ok++;}

  row('Renders from the dataset',SRCFETCHED?'pass':'warn',
    'Outlines and label anchors read from <code>'+esc(SRCNAME)+'</code>'+(SRCFETCHED?'':' — the datasets were not fetched (the page was opened from the filesystem, where the browser blocks it, or served without them beside it), so it fell back to the inline mirror. The mirror is written by <code>npm run sync:zambia-game</code> and <code>npm run test:zambia-game</code> fails if it and the files disagree.')+
    ' Traced '+esc(D.traced)+', dated '+esc(D.dated)+', positional accuracy about '+D.positionalAccuracyKm+' km.');

  row('Dated and attributed — but not verified',V.status==='UNVERIFIED'?'warn':'pass',
    '<b>'+esc(V.status)+'.</b> '+esc(D.tracedFrom)+' Still to do before release: '+esc(V.requiredBeforeRelease.join(' · '))+
    ' The two facts datasets carry the same block; a teacher signs off by filling in <code>checkedBy / checkedAgainst / checkedOn</code>, not by editing this page.');

  var parsed=PKEYS.filter(function(k){return PROV.provinces[k]&&G[k].pts.length>2&&inside(PROV.provinces[k].c,G[k].pts);});
  row('Ten provinces, each with a label anchor inside it',parsed.length===10?'pass':'fail',
    parsed.length+' of 10 outlines parse and hold their own label anchor. Province count in the dataset: '+D.provinceCount+'.');

  var mu=PROV.provinces.mu;
  row('Muchinga is present and dated',(mu&&/2011/.test(mu.createdNote||''))?'pass':'fail',
    mu?esc(mu.createdNote):'Muchinga missing. Zambia has had TEN provinces since 11 October 2011 — a nine-province map is out of date.');

  var so=null;FACTS.capitals.forEach(function(c){if(c.province==='so')so=c;});
  var liv=FACTS.capitals.filter(function(c){return c.town==='Livingstone';}).length;
  row('Southern Province’s capital is Choma',(so&&so.town==='Choma'&&liv===0)?'pass':'fail',
    so?('The dataset says <b>'+esc(so.town)+'</b>, and Livingstone appears '+(liv?'AS A CAPITAL — wrong':'only as a wrong option and in the explanation, which is where it belongs')+'. It moved in 2011.'):'No capital recorded for Southern.');

  var m=measureNow();
  if(m){
    var worst=m.items.slice().sort(function(a,b){return a.px-b.px;})[0];
    var small=m.items.filter(function(x){return x.px<TOUCH_MIN;});
    row('Every province is a 44px target at '+m.w+'px',small.length?'fail':'pass',
      'Smallest effective target: <b>'+esc(worst.id.split(':')[1])+'</b> at '+worst.px.toFixed(0)+'px. '+
      'Lusaka is the province this rule exists for — it measures '+
      (m.items.filter(function(x){return x.id==='prov:lu';})[0]||{px:0}).px.toFixed(0)+'px. '+
      'Targets under 44px get an invisible circular halo, stacked smallest-last so a small province wins the tap over a big neighbour.');
  } else row('Touch targets','warn','No interactive map on screen to measure yet.');

  if(LASTZONE){
    var wz=LASTZONE.items.slice().sort(function(a,b){return a.px-b.px;})[0];
    row('The neighbour boxes are targets too',wz.px<TOUCH_MIN?'fail':'pass',
      'Smallest of the eight at '+LASTZONE.w+'px: <b>'+esc(wz.id.split(':')[1])+'</b> at '+wz.px.toFixed(0)+'px. '+
      'Botswana’s real border is a few hundred metres at Kazungula; its box is the same size as everyone else’s, because a tap target is not a scale drawing.');
  }

  var w=LEVELS[0].steps.map(function(s){return s.items.length;}),cum=[],t=0;
  w.forEach(function(n){t+=n;cum.push(t);});
  row('Level 1 starts with three and grows',(cum.join()==='3,5,10')?'pass':'fail',
    'Rounds place '+w.join(' then ')+' — '+cum.join(' → ')+' on the map. Everything already placed stays visible as an anchor, and is drawn in grey with its name so it can be measured against.');

  var placeable=[],missing=[];
  LEVELS.forEach(function(l){l.steps.forEach(function(s){
    if(s.t==='place')s.items.forEach(function(k){placeable.push(k);if(!(FACTS.provinces[k]||{}).hint)missing.push(k);});
    if(s.t==='zone')s.items.forEach(function(c){placeable.push(c);if(!zoneOf(c).hint)missing.push(c);});
    if(s.t==='map'||s.t==='lake'){placeable.push(s.q);if(!s.hint)missing.push(s.q);}
  });});
  row('Every wrong placement returns a positional hint',missing.length?'fail':'pass',
    placeable.length+' placeable or tappable answers, '+(placeable.length-missing.length)+' carrying a hint that says where the thing is relative to something else. A wrong tap names what was tapped and then gives that hint — never a bare cross.');

  var anchors=['lu','cb','we'],anchorFail=[];
  LEVELS[0].steps.forEach(function(s,i){
    s.items.forEach(function(k){
      var h=FACTS.provinces[k].hint;
      if(i===0){if(!/north|south|east|west|top|bottom|middle|centre|corner/i.test(h))anchorFail.push(k);}
      else{
        var namesAnAnchor=anchors.some(function(a){return h.indexOf(nameOf(a))>=0;});
        if(!namesAnAnchor)anchorFail.push(k);
      }
    });
    if(i>0)anchors=anchors.concat(s.items);
    else anchors=s.items.slice();
  });
  row('Hints point at something already on the map',anchorFail.length?'fail':'pass',
    anchorFail.length?('These hints name nothing the learner has placed yet: '+anchorFail.join(', ')):
    'Round 1 hints use compass directions only (nothing is on the map yet); every later hint names a province already placed — "west of the Copperbelt", "below Lusaka".');

  var cp=PROV.projection.checkPoints.map(function(c){return{c:c,got:whichProvince(proj(c.lon,c.lat))};});
  var cpBad=cp.filter(function(x){return x.got!==x.c.expect;});
  row('The lon/lat projection lands where it should',cpBad.length?'fail':'pass',
    cp.length+' calibration points ('+cp.map(function(x){return esc(x.c.name);}).join(', ')+') project inside the province they belong to. '+
    'That is what lets a town, a heritage site or a river be drawn from its real coordinates instead of being nudged into place by eye.');

  var pins=allPins(),outside=[];
  pins.forEach(function(p){
    var xy=proj(p.lon,p.lat),got=whichProvince(xy);
    if(got!==p.p)outside.push({l:p.label,d:distToPoly(xy,G[p.p].pts),got:got});
  });
  var far=outside.filter(function(x){return x.d>2.5;});
  row('Pins agree with the traced boundaries',far.length?'warn':'pass',
    (pins.length-outside.length)+' of '+pins.length+' pins fall inside the province the data says they are in. '+
    (outside.length?('The rest sit within '+Math.max.apply(null,outside.map(function(x){return x.d;})).toFixed(1)+' map units of it — '+
      outside.map(function(x){return esc(x.l)+' ('+(x.d*12).toFixed(0)+' km)';}).join(', ')+
      ' — which is the hand trace’s resolution, not a disagreement about which province they are in. This row is why the dataset is marked unverified.'):''));

  var glyphless=Object.keys(STATES).filter(function(k){return k!=='anchor'&&!STATES[k].glyph;});
  var okShapes=document.querySelectorAll('.prov.ok,.zone.ok,.lake.ok').length;
  var okMarks=document.querySelectorAll('text.mark.ok').length;
  var noShapes=document.querySelectorAll('.prov.no,.zone.no,.lake.no').length;
  var noMarks=document.querySelectorAll('text.mark.no').length;
  row('Colour is never the only signal',(!glyphless.length&&okShapes<=okMarks&&noShapes<=noMarks)?'pass':'fail',
    'On screen now: '+okShapes+' correct shapes carrying '+okMarks+' ✓ marks, '+noShapes+' wrong shapes carrying '+noMarks+' ✗ marks. '+
    'Wrong is also drawn as a diagonal hatch, and the feedback says it in words. The palette is Okabe-Ito — and green and orange are nearly the same grey, '+
    'so <b>Drop the colour</b> in the strip above is the real test: the map still reads.');

  var regions=document.querySelectorAll('svg.map [data-hit]:not(.halo)'),named=0;
  for(var i=0;i<regions.length;i++){if(regions[i].getAttribute('aria-label')&&regions[i].querySelector('title'))named++;}
  row('Screen readers get names, not paths',(regions.length===0||named===regions.length)?'pass':'fail',
    named+' of '+regions.length+' tappable map regions carry both an <code>aria-label</code> (which says the name AND the state) and a <code>&lt;title&gt;</code>. '+
    'They are keyboard-reachable too — Tab to a province, Enter to place.');

  var badD=FACTS.districts.filter(function(d){return PKEYS.indexOf(d.province)<0;});
  row('Districts resolve to real provinces',badD.length?'fail':'pass',
    FACTS.districts.length+' districts, all mapping to one of the ten. District boundaries are NOT in this dataset and must be sourced separately before a district level can be drawn on the map — level 3 asks which province a district is in, which the outlines can answer. '+
    'District count on file: '+FACTS.dataset.districtCount.value+' as of '+esc(FACTS.dataset.districtCount.asOf)+' — '+esc(FACTS.dataset.districtCount.note));

  var total=0;LEVELS.forEach(function(l){total+=l.count;});
  row('Nine levels','pass',LEVELS.length+' levels, '+total+' scored questions: '+LEVELS.map(function(l){return l.id+') '+l.name.replace('&amp;','&')+' ×'+l.count;}).join(' · '));

  $('panel').innerHTML='<h3>Acceptance, run against the data actually loaded</h3>'+
   '<p class="lead">Every row below is computed on each render from <code>zambia_provinces.json</code> and <code>zambia_facts.json</code> — not from a list somebody kept up to date. '+
   'Change a dataset and the rows change with it. <b>'+ok+' pass, '+bad+' fail, '+(rows.length-ok-bad)+' need a person.</b></p>'+
   '<table>'+rows.map(function(r){
     return '<tr><td class="v '+(r.s==='pass'?'pass':(r.s==='fail'?'fail':'warn'))+'">'+(r.s==='pass'?'PASS':(r.s==='fail'?'FAIL':'TO DO'))+'</td>'+
       '<td class="v">'+r.n+'</td><td>'+r.t+'</td></tr>';
   }).join('')+'</table>';
}

/* ---------- notes column ---------- */
function notes(){
  var D=PROV.dataset;
  $('notes').innerHTML=
  '<div class="note warn"><h3>The map is real; it is not yet verified</h3>The ten outlines come from <code>zambia_provinces.json</code> — correct shapes, the Congo Pedicle notch, Muchinga present — traced '+esc(D.traced)+' and dated '+esc(D.dated)+'. It is marked <b>'+esc(D.verification.status)+'</b> in the file itself, and the panel below says so on every render. Two jobs remain: check it against <b>ZamStats or the Survey Department</b> and write what you checked into <code>verification.checkedAgainst</code>; and <b>source district boundaries separately</b> — they are not in this dataset, which is why level 3 asks which province a district is in rather than asking for it to be placed.</div>'+
  '<div class="note warn"><h3>Two facts generated lists get wrong</h3><b>Southern Province’s capital is Choma</b>, not Livingstone — it moved in 2011. Livingstone was the capital of the whole country until 1935 and is the tourist city at Mosi-oa-Tunya, which is why almost every AI-written list still puts it here. The game asks it as its own question, and the check below fails if the dataset ever says otherwise.<br><br><b>Muchinga was created in 2011</b> from districts of Northern, plus Chama from Eastern. Older textbooks show nine provinces. The game says which is current, on the level list and in the fact.</div>'+
  '<div class="note"><h3>Tap-to-place, drag as a bonus</h3>Tap the name, then tap the province. A finger dragging across a phone covers the target it is aiming at, so drag is the desktop affordance and tap is the one tested on a cheap Android. The selected name is announced in the line above the chips, and stays selected through a wrong tap so a second try costs one tap, not two.</div>'+
  '<div class="note"><h3>44px, measured, at the width you choose</h3>Lusaka is the province this rule exists for: it is the smallest, and at 360px its own shape measures about 32px top to bottom. Every target gets an invisible circular halo that switches on only when the shape itself measures under 44px <i>at the width actually rendered</i>, and halos are stacked smallest-last so Lusaka wins the tap over Central. Change <b>Phone</b> in the strip above and the check re-measures.</div>'+
  '<div class="note"><h3>Start with three, not ten</h3>Round 1 places three, round 2 takes it to five, round 3 to all ten. Everything already placed stays on the map in grey <i>with its name</i> — that is what a later hint points at. An empty map with ten labels is a memory test; a map with three known provinces on it is a lesson in where the fourth must be.</div>'+
  '<div class="note"><h3>A wrong placement teaches direction</h3>Every province, river, lake, site and neighbour carries a positional hint written relative to something else — "west of the Copperbelt", "below Lusaka", "at the very top, reaching Lake Tanganyika". A wrong tap names what was tapped, then gives the hint for what was being placed. Nothing is taken away and the name goes back in the bank. After three misses on a question the answer is shown rather than left as a wall.</div>'+
  '<div class="note"><h3>Colour is never the signal</h3>Correct is a ✓ and a filled shape; wrong is a ✗ and a diagonal hatch; already-placed is grey and carries its name. The palette is Okabe-Ito, and its green and orange sit at almost the same grey — which is the point of <b>Drop the colour</b> in the strip: with colour removed the map still reads, because the glyphs and the words were carrying it all along.</div>'+
  '<div class="note"><h3>Drawn from coordinates, not by eye</h3>The dataset carries a projection, so every town, heritage site, park and river in the game is plotted from its real longitude and latitude rather than nudged into position. It also makes the trace checkable: the panel projects five known points and reports where the pins disagree with the outline, in km. That disagreement <i>is</i> the accuracy statement — about '+D.positionalAccuracyKm+' km.</div>'+
  '<div class="note"><h3>Three of these are now built next door</h3><b>Journey mode</b>, <b>odd one out</b> and the <b>ceremony calendar</b> are prototyped in <code>zedexams-zambia-map-modes.html</code>, off the same two datasets — journey walks the new <code>adjacency</code> graph in <code>zambia_provinces.json</code>, and odd one out is derived from the new per-province <code>borders</code> list rather than authored. That page also carries a <b>neighbours</b> mode that duplicates level 8 here; the two should not both ship.</div>'+
  '<div class="note"><h3>Still to build</h3><b>Photo round</b> — a picture of Mosi-oa-Tunya or Shiwa Ng’andu, place it. Districts on the map, once boundaries are sourced.</div>';
}

/* ---------- wiring ---------- */
function doAct(act){
  var bits=act.split(':'),k=bits[0],v=act.slice(k.length+1);
  if(k==='pick'){var s=LEVELS[levelIx].steps[stepIx],done=(s.t==='zone'?run.zplaced:run.placed);if(v in done)return;sel=(sel===v?null:v);render();return;}
  if(k==='ans'){answer(decodeURIComponent(v));return;}
  if(k==='next'){next();return;}
  if(k==='ladder'){view='ladder';render();return;}
  if(k==='level'){startLevel(+v);return;}
}
document.addEventListener('click',function(e){
  var t=e.target&&e.target.closest?e.target.closest('[data-act],[data-hit]'):null;
  if(!t)return;
  var a=t.getAttribute('data-act');
  if(a){doAct(a);return;}
  var h=t.getAttribute('data-hit');
  if(h)hit(h);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var t=e.target&&e.target.closest?e.target.closest('[data-hit]'):null;
  if(!t||t.tagName==='BUTTON')return;
  e.preventDefault();hit(t.getAttribute('data-hit'));
});
/* Desktop bonus: drag a name onto the map. Tap-to-place is the primary path and
   nothing here is required to finish a level. */
function wireDrag(){
  document.addEventListener('dragstart',function(e){
    var t=e.target&&e.target.closest?e.target.closest('.pc[data-act^="pick:"]'):null;if(!t)return;
    sel=t.getAttribute('data-act').slice(5);try{e.dataTransfer.setData('text/plain',sel);}catch(err){}
  });
  document.addEventListener('dragover',function(e){if(e.target&&e.target.closest&&e.target.closest('[data-hit]'))e.preventDefault();});
  document.addEventListener('drop',function(e){
    var t=e.target&&e.target.closest?e.target.closest('[data-hit]'):null;if(!t)return;
    e.preventDefault();hit(t.getAttribute('data-hit'));
  });
}
function fillRig(){
  $('rLevel').innerHTML=LEVELS.map(function(l,i){return '<option value="'+i+'">'+l.id+' · '+l.name.replace('&amp;','&')+'</option>';}).join('');
  $('rLevel').onchange=function(){startLevel(+this.value);};
  $('rWidth').onchange=function(){
    var ps=document.querySelectorAll('.phone'),i;
    for(i=0;i<ps.length;i++){ps[i].className='phone'+(this.value?' '+this.value:'');}
    fitHalos();runChecks();
  };
  $('rUnlock').onclick=function(){LEVELS.forEach(function(l){unlocked[l.id]=true;});save();render();};
  $('rReset').onclick=function(){unlocked={1:true};progress={};save();startLevel(0);};
  $('rMono').onchange=function(){document.body.classList.toggle('nocolour',this.checked);runChecks();};
  $('hBack').onclick=function(){view='ladder';render();};
  $('rSrc').textContent=SRCFETCHED?('reading '+SRCNAME):'inline mirror — the datasets were not fetched';
  $('rSrc').className='chk '+(SRCFETCHED?'':'idle');
  $('rVerify').textContent='map '+PROV.dataset.verification.status.toLowerCase()+' · facts '+FACTS.dataset.verification.status.toLowerCase();
}

/* ---------- boot ---------- */
loadData().then(function(){
  PKEYS.forEach(function(k){
    var pts=parsePath(PROV.provinces[k].d);
    G[k]={pts:pts,bbox:bbox(pts),area:areaOf(pts),inscribed:distToPoly(PROV.provinces[k].c,pts)};
  });
  LEVELS=buildLevels();load();fillRig();notes();wireDrag();
  startLevel(0);
  window.addEventListener('resize',function(){fitHalos();runChecks();});
});
})();
</script>
</body></html>
