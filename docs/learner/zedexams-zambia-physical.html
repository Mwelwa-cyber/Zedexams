<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZedExams — Zambia's physical features</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ind:#5b5bd6;--ind-soft:#ececfb;--ink:#1c2333;--muted:#6b7392;--bg:#eef0fb;
--coral:#ff7a4d;--coral-2:#f4592c;--gold:#f5b820;--line:#e6e8f5;--r:18px;
/* Okabe-Ito, and the same rule as the Know Zambia game: correct and wrong are
   told apart by GLYPH and PATTERN first. The colours only ever agree with the
   glyph — they are near-identical in greyscale, which is why the glyph is not
   optional and why the strip has a "Drop the colour" switch. */
--ok:#009e73;--ok-ink:#04674c;--ok-soft:#e7f5f0;--ok-line:#bfe4d8;
--no:#d55e00;--no-ink:#8f3f00;--no-soft:#fdeee4;--no-line:#f6d3ba;
--anchor:#a8b3d6;--anchor-ink:#333a58;--land:#d7dff2;
--water:#2f86c9;--water-ink:#12508f;--water-soft:#e2f0fb}
*{box-sizing:border-box}
body{margin:0;background:#dfe3f5;font-family:Nunito,system-ui,sans-serif;color:var(--ink);padding:22px 14px 50px}
h1.pt{text-align:center;margin:0 0 4px;font-size:25px}
p.ps{text-align:center;color:#5a6180;margin:0 0 16px;font-size:13.5px}

/* ---- prototype control strip (not part of the app) ---- */
.rig{max-width:1180px;margin:0 auto 18px;background:#fff;border-radius:14px;padding:12px 15px;
display:flex;gap:13px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:#4b5270}
.rig b{color:var(--ink)}
.rig label{display:flex;gap:6px;align-items:center;font-weight:800}
.rig select,.rig button{font:inherit;font-weight:800;font-size:12.5px;border-radius:9px;border:1.5px solid var(--line);
background:#fff;color:var(--ind);padding:6px 10px;cursor:pointer}
.rig .sep{flex:1}
.rig .chk{background:var(--ok-soft);color:var(--ok-ink);border:1px solid var(--ok-line);border-radius:999px;padding:4px 11px;font-weight:800}
.rig .chk.bad{background:var(--no-soft);color:var(--no-ink);border-color:var(--no-line)}
.rig .chk.idle{background:var(--bg);color:var(--muted);border-color:var(--line)}

.stage{display:flex;gap:22px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:356px;height:760px;background:var(--bg);border-radius:34px;overflow:hidden;position:relative;
box-shadow:0 14px 40px rgba(40,44,90,.22);border:7px solid #12142a;display:flex;flex-direction:column}
.phone.w320{width:320px}.phone.w360{width:360px}.phone.w412{width:412px}
.notes{width:356px}
.note{background:#fff;border-radius:14px;padding:13px 15px;font-size:12.5px;line-height:1.6;color:#4b5270;border-left:4px solid var(--ind);margin-bottom:11px}
.note b{color:var(--ink)} .note h3{margin:0 0 5px;font-size:13.5px;color:var(--ink)} .note.warn{border-left-color:#e0a020}
.note code{background:#f2f3fb;border-radius:5px;padding:1px 5px;font-size:11.5px}

.top{padding:11px 14px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex:0 0 auto}
.back{width:32px;height:32px;border-radius:10px;background:var(--bg);border:none;display:grid;place-items:center;color:var(--ind);font-size:16px;font-family:inherit;cursor:pointer}
.ttl{font-weight:900;font-size:15px;line-height:1.2}
.ttl small{display:block;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.chip{margin-left:auto;background:var(--ok-soft);color:var(--ok-ink);border:1px solid var(--ok-line);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.body{padding:12px;flex:1;overflow-y:auto}.body::-webkit-scrollbar{width:0}
.card{background:#fff;border-radius:var(--r);padding:13px;margin-bottom:10px}
.card.tight{padding:8px 8px 6px}
.kick{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.q{font-size:15.5px;font-weight:800;line-height:1.45}
.q b{color:var(--ind)}

/* ---- the map ---- */
svg.map{width:100%;display:block;touch-action:manipulation;overflow:visible}
.prov{fill:var(--land);stroke:#fff;stroke-width:.5;transition:fill .18s}
.prov[data-hit]{cursor:pointer}
.prov[data-hit]:hover{fill:#c3cdea}
.prov.anchor{fill:var(--anchor)}
.prov.ok{fill:var(--ok)}
.prov.no{fill:url(#hatch)}
.prov.step{fill:var(--water)}
.prov:focus{outline:none;stroke:var(--ind);stroke-width:1.4}
.plab{font-weight:900;fill:#fff;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.18);stroke-width:.35}
.plab.dark{fill:var(--anchor-ink);stroke:rgba(255,255,255,.7)}
.mark{font-weight:900;text-anchor:middle;pointer-events:none;font-size:4.2px;paint-order:stroke;stroke:#fff;stroke-width:.9}
.mark.ok{fill:#fff;stroke:rgba(0,0,0,.25)}
.mark.no{fill:var(--no-ink)}
.riv{fill:none;stroke:var(--water-ink);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.lake{fill:#a9cdea;stroke:var(--water);stroke-width:.5}
.lake.ok{fill:var(--ok);stroke:var(--ok-ink)}
.wlab{font-size:2.7px;font-weight:800;fill:var(--water-ink);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:.8}
.pin circle{fill:var(--coral-2);stroke:#fff;stroke-width:.6}
.pin text{font-size:3px;font-weight:900;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:1}
.halo{fill:transparent;cursor:pointer}
.halo:focus{outline:none}
body.nocolour svg.map{filter:grayscale(1)}
.prov-src{font-size:10.5px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.5}

/* ---- shared controls ---- */
.hint{text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin:9px 0 3px}
.hint b{color:var(--ind)}
.fb{border-radius:14px;padding:12px;margin-top:10px;font-size:13px;line-height:1.6}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--ok-ink)}
.fb.no{background:var(--no-soft);border:1px solid var(--no-line);color:var(--no-ink)}
.fb.say{background:var(--bg);border:1px solid var(--line);color:#4b5270}
.fb .t{font-weight:900;font-size:14px;margin-bottom:3px;display:flex;gap:6px;align-items:baseline}
.btn{width:100%;padding:13px;border:none;border-radius:14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px;min-height:48px}
.btn-coral{background:linear-gradient(180deg,var(--coral),var(--coral-2));color:#fff}
.btn-ghost{background:#fff;color:var(--ind);border:1.5px solid var(--line);font-size:14px}

/* ---- mode menu ---- */
.mode{background:#fff;border-radius:14px;padding:12px;margin-bottom:9px;display:flex;gap:11px;align-items:center;
width:100%;border:2px solid transparent;font:inherit;text-align:left;cursor:pointer;min-height:48px}
.mode.cur{border-color:var(--ind)}
.mi{width:42px;height:42px;border-radius:12px;background:var(--water-soft);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.mi.done{background:var(--ok-soft)}
.mn{font-weight:900;font-size:14px}
.md{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.rt{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:800;white-space:nowrap;padding-left:6px}
.sec{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:12px 0 7px}

/* ---- the route strip (follow the river) ---- */
.route{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:9px}
.rs{background:var(--bg);border-radius:9px;padding:6px 9px;font-size:11px;font-weight:800;color:var(--muted);display:flex;gap:5px;align-items:center}
.rs.on{background:var(--water);color:#fff}

/* ---- buckets (watershed, lakes) ---- */
.item{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:16px;font-weight:900;text-align:center;margin-bottom:10px}
.item small{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin-top:3px}
.buckets{display:flex;gap:9px}
.bk{flex:1;background:#fff;border:2.5px solid var(--line);border-radius:15px;padding:12px 8px;min-height:96px;font:inherit;cursor:pointer;text-align:center;color:var(--ink)}
.bk h4{margin:0 0 3px;font-size:13px}
.bk .sub{font-size:10.5px;color:var(--muted);line-height:1.4}
.bk .g{font-size:19px;display:block;margin-bottom:3px}
.bk.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.bk.no{border-color:var(--no);background:var(--no-soft);color:var(--no-ink)}
.bk[disabled]{cursor:default}
.tally{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;justify-content:center}
.tl{border-radius:9px;padding:5px 9px;font-size:11px;font-weight:800;background:var(--bg);color:var(--muted)}
.tl.ok{background:var(--ok-soft);color:var(--ok-ink)}
.tl.no{background:var(--no-soft);color:var(--no-ink)}

/* ---- ordering (relief) ---- */
.slots{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.sl{background:var(--bg);border-radius:11px;padding:10px 12px;font-size:12.5px;font-weight:800;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.sl.f{background:var(--water);color:#fff}
.sl .alt{margin-left:auto;font-weight:800;font-size:11.5px;opacity:.95}
.ord{background:#fff;border:2px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;font-weight:800;font-size:13.5px;
cursor:pointer;display:flex;align-items:center;gap:9px;width:100%;font-family:inherit;color:var(--ink);text-align:left;min-height:48px}
.ord.gone{opacity:.35;pointer-events:none}
.ord .g{color:var(--muted);font-size:11.5px;margin-left:auto;font-weight:800}
.learned{font-size:12.5px;line-height:1.75;color:#4b5270}
.learned b{color:var(--ink)}
.src{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:8px}

/* ---- self-check panel ---- */
.panel{max-width:1180px;margin:26px auto 0;background:#151a2e;border-radius:16px;padding:18px 20px;color:#c9cfe6;font-size:12.5px;line-height:1.65}
.panel h3{margin:0 0 4px;font-size:14.5px;color:#fff}
.panel p.lead{margin:0 0 12px;color:#939cc0}
.panel table{width:100%;border-collapse:collapse}
.panel td{padding:5px 8px 5px 0;vertical-align:top;border-bottom:1px solid #232945}
.panel td.v{white-space:nowrap;font-weight:800}
.panel .pass{color:#4fd6a6}.panel .fail{color:#ff9a6b}.panel .warn{color:#f3c65f}
.panel code{background:#232945;border-radius:5px;padding:1px 5px;color:#dfe4f7}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:820px){.stage{display:block}.phone,.notes{width:100%;max-width:360px;margin:0 auto 22px}}
</style></head><body>

<h1 class="pt">Zambia's physical features</h1>
<p class="ps">Rivers, falls, lakes and relief — on the map you already have.</p>

<div class="rig">
  <label>Mode
    <select id="rMode"></select>
  </label>
  <label>Phone
    <select id="rWidth"><option value="w320">320px</option><option value="w360" selected>360px</option><option value="">356px</option><option value="w412">412px</option></select>
  </label>
  <button id="rReset" type="button">Reset progress</button>
  <label><input type="checkbox" id="rMono"> Drop the colour</label>
  <label><input type="checkbox" id="rBare"> Province file only</label>
  <span class="sep"></span>
  <span class="chk idle" id="rSrc">loading…</span>
  <span class="chk bad" id="rVerify">unverified</span>
</div>

<div class="stage">
  <div class="phone w360" id="phone">
    <div class="top">
      <button class="back" id="hBack" type="button" aria-label="Back to the list of modes">‹</button>
      <div class="ttl" id="hTtl">Physical features<small id="hSub">five modes</small></div>
      <div class="chip" id="hChip">0 / 0</div>
    </div>
    <div class="body" id="scr"></div>
  </div>

  <div class="notes" id="notes"></div>
</div>

<div class="panel" id="panel"></div>

function readMirror(id){return JSON.parse($(id).textContent);}
function loadData(){
  PROV=readMirror('mirror-provinces');FACTS=readMirror('mirror-facts');PHYS=readMirror('mirror-physical');
  var want=['zambia_provinces.json','zambia_facts.json','zambia_physical.json'];
  return Promise.all(want.map(function(u){return fetch(u).then(function(r){return r.ok?r.json():null;})
    .catch(function(){return null;});}))
    .then(function(r){
      if(r[0]&&r[1]&&r[2]){PROV=r[0];FACTS=r[1];PHYS=r[2];SRCFETCHED=true;
        SRCNAME='zambia_provinces.json + zambia_facts.json + zambia_physical.json';}
    })
    .catch(function(){});
}
function factsRiver(id){var out=null;FACTS.water.rivers.forEach(function(r){if(r.id===id)out=r;});return out;}
function factsLake(id){var out=null;FACTS.water.lakes.forEach(function(l){if(l.id===id)out=l;});return out;}
function lakeShape(l){
  if(l.factsLakeId){var f=factsLake(l.factsLakeId);if(f)return{lon:f.lon,lat:f.lat,rx:f.rx,ry:f.ry,rot:f.rot,from:'zambia_facts.json'};}
  if(l.geometry)return{lon:l.geometry.lon,lat:l.geometry.lat,rx:l.geometry.rx,ry:l.geometry.ry,rot:l.geometry.rot,from:'zambia_physical.json'};
  return null;
}

/* ---------- the five modes, built out of the datasets ----------
   ORDER MATTERS. Relief comes first because the prompt asks for it and the
   reason is pedagogic: once a learner has seen Zambia as a high plateau with
   valleys cut into it, the rivers stop being arbitrary names and start being
   water running downhill. ------------------------------------------------- */
function buildModes(){
  var m=[];

  m.push({id:'relief',kind:'order',icon:'⛰️',name:'Highest to lowest',
    blurb:'Put Zambia’s relief in order — the hills, the plateau, the valley, the river.',
    items:PHYS.relief,count:PHYS.relief.length,
    why:'Do this one first. Everything after it is water running downhill.'});

  m.push({id:'falls',kind:'map',icon:'💧',name:'Where is the waterfall?',
    blurb:'Victoria, Kalambo, Ngonye, Lumangwe, Kundalila — tap the province.',
    steps:PHYS.falls.map(function(f){
      return{q:'In which province is <b>'+esc(f.name)+'</b>'+(f.alsoKnownAs?' ('+esc(f.alsoKnownAs)+')':'')+'?',
        a:[f.province].concat(f.alsoAccept||[]),main:f.province,fact:f.fact,hint:f.hint,
        alsoWhy:f.alsoAcceptWhy||null,
        pin:{lon:f.lon,lat:f.lat,label:f.name.replace(' Falls','')},
        kick:f.river+' river'};
    }),count:PHYS.falls.length});

  var legs=PHYS.riverCourses.map(function(c){
    var fr=factsRiver(c.factsRiverId);
    return{id:c.id,name:c.name,route:c.route,why:c.why,end:c.end,
      line:fr?fr.waypoints:null};
  });
  var courseCount=0;legs.forEach(function(l){courseCount+=l.route.length;});
  m.push({id:'course',kind:'course',icon:'🌊',name:'Follow the river',
    blurb:'Trace the Zambezi and the Kafue province by province, source to end.',
    legs:legs,count:courseCount});

  m.push({id:'watershed',kind:'bucket',icon:'🧭',name:'Congo or Zambezi?',
    blurb:'Which way does the water go? Sort the rivers by the ocean they reach.',
    intro:PHYS.watershed.idea,verdict:'It goes to the ',
    buckets:[{id:'congo',b:PHYS.watershed.basins.congo},{id:'zambezi',b:PHYS.watershed.basins.zambezi}],
    steps:PHYS.watershed.rivers.map(function(r){
      return{label:r.name+' river',sub:'Where does this water end up?',a:r.basin,why:r.why,hint:r.hint,id:r.id};
    }),count:PHYS.watershed.rivers.length});

  m.push({id:'lakes',kind:'bucket',icon:'🏞️',name:'Natural or man-made?',
    blurb:'Tanganyika, Bangweulu, Mweru — and the two that people built.',verdict:'It is ',verdictLower:true,
    buckets:[{id:'natural',b:{name:'Natural',arrow:'🏞️',blurb:'it was always there'}},
             {id:'man-made',b:{name:'Man-made',arrow:'🏗️',blurb:'people built a dam'}}],
    steps:PHYS.lakes.map(function(l){
      return{label:l.name,sub:'Was this lake always here?',a:l.kind,why:l.why,hint:l.hint,id:l.id,lake:l};
    }),count:PHYS.lakes.length});

  return m;
}

/* ---------- the map ----------
   Everything optional is gated on EXTRAS inside this one function rather than
   at each call site, so "Province file only" cannot be forgotten by a screen
   that grows a pin later. --------------------------------------------------- */
function svgMap(o){
  o=o||{};
  var st=o.state||{},s='<svg class="map" viewBox="'+(o.viewBox||VB_MAIN)+'" role="img" aria-label="Map of Zambia’s ten provinces">';
  s+='<defs><pattern id="hatch" width="3" height="3" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
     '<rect width="3" height="3" fill="#fbe3d2"></rect><rect width="1.4" height="3" fill="#d55e00"></rect></pattern></defs>';

  PKEYS.forEach(function(k){
    var c=st[k]||'',hit=o.hit==='prov';
    s+='<path id="p_'+k+'" class="prov '+c+'" d="'+PROV.provinces[k].d+'"'+
       (hit?' data-hit="prov:'+k+'" role="button" tabindex="0"':'')+
       ' aria-label="'+esc(nameOf(k))+' Province'+(c&&STATES[c]?', '+STATES[c].word:'')+'"><title>'+esc(nameOf(k))+' Province</title></path>';
  });

  if(EXTRAS&&o.riverLine){
    var pts=o.riverLine.map(function(w){var p=proj(w[0],w[1]);return p[0].toFixed(2)+','+p[1].toFixed(2);}).join(' ');
    s+='<polyline class="riv" points="'+pts+'" aria-hidden="true"></polyline>';
  }
  if(EXTRAS&&o.lakes){
    o.lakes.forEach(function(L){
      var g=L.shape;if(!g)return;
      var p=proj(g.lon,g.lat);
      s+='<ellipse class="lake'+(L.on?' ok':'')+'" cx="'+p[0].toFixed(2)+'" cy="'+p[1].toFixed(2)+'" rx="'+g.rx+'" ry="'+g.ry+
         '" transform="rotate('+g.rot+' '+p[0].toFixed(2)+' '+p[1].toFixed(2)+')" aria-label="'+esc(L.name)+'"><title>'+esc(L.name)+'</title></ellipse>';
      if(L.on)s+='<text class="mark ok" x="'+p[0].toFixed(2)+'" y="'+(p[1]+1.5).toFixed(2)+'">✓</text>';
      s+='<text class="wlab" x="'+p[0].toFixed(2)+'" y="'+(p[1]+g.ry+3).toFixed(2)+'">'+esc(L.name.replace('Lake ',''))+'</text>';
    });
  }

  PKEYS.forEach(function(k){
    var c=st[k]||'';if(c!=='ok'&&c!=='step'&&c!=='anchor')return;
    var a=PROV.provinces[k].c,fs=labelSize(k);
    s+='<text class="plab'+(c==='anchor'?' dark':'')+'" x="'+a[0]+'" y="'+a[1]+'" style="font-size:'+fs.toFixed(2)+'px">'+esc(nameOf(k))+'</text>';
    if(c==='ok')s+='<text class="mark ok" x="'+a[0]+'" y="'+(a[1]-fs-1.2)+'">✓</text>';
  });
  PKEYS.forEach(function(k){
    if(st[k]!=='no')return;var a=PROV.provinces[k].c;
    s+='<text class="mark no" x="'+a[0]+'" y="'+a[1]+'">✗</text>';
  });

  if(EXTRAS&&o.pin){
    var pp=proj(o.pin.lon,o.pin.lat);
    s+='<g class="pin"><circle cx="'+pp[0].toFixed(2)+'" cy="'+pp[1].toFixed(2)+'" r="1.5"></circle>'+
       '<text x="'+pp[0].toFixed(2)+'" y="'+(pp[1]-2.6).toFixed(2)+'">'+esc(o.pin.label)+'</text></g>';
  }

  /* Touch halos. Every province gets one; fitHalos() gives it a radius only
     when the shape itself measures under 44px at the width actually rendered.
     Smallest last, so Lusaka wins the tap over Central. */
  if(o.hit==='prov'){
    s+='<g class="halos">';
    PKEYS.slice().sort(function(a,b){return G[b].area-G[a].area;}).forEach(function(k){
      var a=PROV.provinces[k].c,b=G[k].bbox;
      s+='<circle class="halo" data-hit="prov:'+k+'" data-min="'+Math.min(b.w,b.h).toFixed(2)+'" cx="'+a[0]+'" cy="'+a[1]+'" r="0" aria-hidden="true"></circle>';
    });
    s+='</g>';
  }
  return s+'</svg>';
}
function fitHalos(){
  var svgs=document.querySelectorAll('svg.map'),i,measured=[];
  for(i=0;i<svgs.length;i++){
    var svg=svgs[i],w=svg.getBoundingClientRect().width;if(!w)continue;
    var vb=svg.getAttribute('viewBox').split(/\s+/).map(Number),scale=w/vb[2];
    var hs=svg.querySelectorAll('circle.halo'),j;
    for(j=0;j<hs.length;j++){
      var minPx=parseFloat(hs[j].getAttribute('data-min'))*scale;
      var r=minPx>=TOUCH_MIN?0:(TOUCH_MIN/2)/scale;
      hs[j].setAttribute('r',r.toFixed(2));
      measured.push({id:hs[j].getAttribute('data-hit'),px:Math.max(minPx,r*2*scale)});
    }
  }
  return measured;
}

/* ---------- run state ---------- */
function startMode(ix){
  modeIx=ix;fb=null;
  var M=MODES[ix];
  run={ix:0,leg:0,step:0,score:0,done:0,tries:0,resolved:false,picked:null,wrong:{},order:[],marks:[],finished:false};
  if(M.kind==='course')run.trace={};
  render();
}
function toMenu(){modeIx=-1;fb=null;render();}
function say(kind,glyph,title,body){fb={k:kind,g:glyph,t:title,b:body};}
function fbHtml(){
  var out='<div id="fb" aria-live="polite">';
  if(fb)out+='<div class="fb '+fb.k+'"><div class="t"><span aria-hidden="true">'+(fb.g||'')+'</span><span>'+fb.t+'</span></div>'+fb.b+'</div>';
  return out+'</div>';
}
function srcLine(){
  return '<div class="prov-src">Outlines: zambia_provinces.json · traced '+esc(PROV.dataset.traced)+' · '+
    esc(PROV.dataset.verification.status.toLowerCase())+(EXTRAS?'':' · province file only')+'</div>';
}

/* ---------- screens ---------- */
function render(){
  if(modeIx<0){
    $('hTtl').innerHTML='Physical features<small>five modes</small>';
    $('hChip').textContent=totalDone()+' / '+totalCount();
    $('scr').innerHTML=menuScreen();
    fitHalos();runChecks();return;
  }
  var M=MODES[modeIx];
  $('hTtl').innerHTML=esc(M.name)+'<small>mode '+(modeIx+1)+' of '+MODES.length+'</small>';
  $('hChip').textContent=run.done+' / '+M.count;
  var h='';
  if(run.finished)h=doneScreen();
  else if(M.kind==='order')h=orderScreen();
  else if(M.kind==='map')h=mapScreen();
  else if(M.kind==='course')h=courseScreen();
  else if(M.kind==='bucket')h=bucketScreen();
  $('scr').innerHTML=h;
  fitHalos();runChecks();
}
function menuScreen(){
  var out='<div class="card tight">'+svgMap({state:allAnchors()})+
    '<div class="prov-src">'+esc(PROV.provinces.mu.createdNote)+'</div></div>'+
    '<div class="sec">Pick a mode</div>';
  MODES.forEach(function(M,i){
    var p=progress[M.id],done=p&&p.done;
    out+='<button class="mode" type="button" data-act="mode:'+i+'">'+
      '<div class="mi'+(done?' done':'')+'" aria-hidden="true">'+M.icon+'</div>'+
      '<div><div class="mn">'+esc(M.name)+'</div><div class="md">'+esc(M.blurb)+'</div></div>'+
      '<div class="rt">'+(p?p.score+' / '+M.count:M.count+' to do')+'</div></button>';
  });
  return out+'<div class="note" style="border:none;background:#fff;margin-top:4px">'+
    '<b>Start at the top.</b> '+esc(MODES[0].why)+'</div>';
}
function allAnchors(){var st={};PKEYS.forEach(function(k){st[k]='anchor';});return st;}

/* --- 1. relief, an ordering --- */
function orderScreen(){
  var M=MODES[modeIx],left=[];
  M.items.forEach(function(r,i){if(run.order.indexOf(i)<0)left.push(i);});
  var h='<div class="card"><div class="kick">Highest first</div>'+
    '<div class="q">Put Zambia in order, from the highest place to the lowest.</div></div>';
  h+='<div class="card"><div class="slots">';
  M.items.forEach(function(_,i){
    var k=run.order[i];
    h+='<div class="sl'+(k===undefined?'':' f')+'"><b>'+(i+1)+'</b> '+
      (k===undefined?'—':esc(M.items[k].name)+'<span class="alt">'+esc(M.items[k].display)+'</span>')+'</div>';
  });
  h+='</div>';
  left.forEach(function(i){
    h+='<button class="ord" type="button" data-act="ord:'+i+'">'+esc(M.items[i].name)+'<span class="g">tap to place</span></button>';
  });
  h+='</div>'+fbHtml();
  return h;
}

/* --- 2. waterfalls, on the map --- */
function mapScreen(){
  var M=MODES[modeIx],s=M.steps[run.ix],st={};
  for(var w in run.wrong)st[w]='no';
  if(run.resolved)st[run.rightKey||s.main]='ok';
  var h='<div class="card"><div class="kick">'+esc(s.kick)+'</div><div class="q">'+s.q+'</div></div>';
  h+='<div class="card tight">'+svgMap({state:st,hit:run.resolved?null:'prov',pin:run.resolved?s.pin:null})+srcLine()+'</div>';
  if(!run.resolved)h+='<div class="hint">Tap the province on the map</div>';
  h+=fbHtml();
  if(run.resolved)h+='<button class="btn btn-coral" type="button" data-act="next">'+(run.ix+1<M.steps.length?'Next →':'Finish →')+'</button>';
  return h;
}

/* --- 3. follow the river --- */
function courseScreen(){
  var M=MODES[modeIx],leg=M.legs[run.leg],st={};
  leg.route.slice(0,run.step).forEach(function(k){st[k]='step';});
  for(var w in run.wrong)st[w]='no';
  var full=run.step>=leg.route.length;
  var h='<div class="card"><div class="kick">'+esc(leg.name)+' river · river '+(run.leg+1)+' of '+M.legs.length+'</div>'+
    '<div class="q">Tap the provinces the <b>'+esc(leg.name)+'</b> flows through, from source to end.</div></div>';
  h+='<div class="card tight">'+svgMap({state:st,hit:full?null:'prov',riverLine:full?leg.line:null})+srcLine()+'</div>';
  h+='<div class="route">'+leg.route.map(function(k,i){
    return '<span class="rs'+(i<run.step?' on':'')+'">'+(i<run.step?'<span aria-hidden="true">✓</span> '+esc(nameOf(k)):String(i+1))+'</span>';
  }).join('')+'</div>';
  if(!full)h+='<div class="hint">'+(run.step?'Where does it go after <b>'+esc(nameOf(leg.route[run.step-1]))+'</b>?':'Which province does it <b>rise</b> in?')+'</div>';
  h+=fbHtml();
  if(full){
    var last=run.leg+1>=M.legs.length;
    h+='<button class="btn btn-coral" type="button" data-act="next">'+(last?'Finish →':'Now the '+esc(M.legs[run.leg+1].name)+' →')+'</button>';
  }
  return h;
}

/* --- 4 & 5. buckets --- */
function bucketScreen(){
  var M=MODES[modeIx],s=M.steps[run.ix];
  var h='';
  if(M.intro&&run.ix===0&&!run.resolved)h+='<div class="card"><div class="kick">The idea</div><div style="font-size:12.5px;line-height:1.65;color:#4b5270">'+esc(M.intro)+'</div></div>';
  h+='<div class="card"><div class="kick">'+esc(M.name)+'</div>'+
    '<div class="item">'+esc(s.label)+'<small>'+esc(s.sub)+'</small></div>'+
    '<div class="buckets">'+M.buckets.map(function(b){
      var cls='';
      if(run.resolved){if(b.id===s.a)cls=' ok';else if(b.id===run.picked)cls=' no';}
      return '<button class="bk'+cls+'" type="button"'+(run.resolved?' disabled':'')+' data-act="bk:'+b.id+'">'+
        '<span class="g" aria-hidden="true">'+(b.b.arrow||'')+'</span><h4>'+esc(b.b.name)+'</h4>'+
        '<div class="sub">'+esc(b.b.blurb)+'</div></button>';
    }).join('')+'</div>';
  if(s.lake&&run.resolved&&EXTRAS){
    var shape=lakeShape(s.lake);
    if(shape)h+='<div style="margin-top:10px">'+svgMap({viewBox:VB_WATER,lakes:[{shape:shape,name:s.lake.name,on:true}]})+'</div>';
  }
  h+='</div>';
  h+=fbHtml();
  h+='<div class="tally">'+M.steps.map(function(x,i){
    var cls=i<run.ix?(run.marks[i]?' ok':' no'):(i===run.ix&&run.resolved?(run.marks[i]?' ok':' no'):'');
    return '<span class="tl'+cls+'">'+esc(x.label.replace(' river','').replace('Lake ',''))+'</span>';
  }).join('')+'</div>';
  if(run.resolved)h+='<button class="btn btn-coral" type="button" data-act="next">'+(run.ix+1<M.steps.length?'Next →':'Finish →')+'</button>';
  return h;
}

/* --- the end of a mode --- */
function doneScreen(){
  var M=MODES[modeIx],full=run.score===M.count,h='';
  h+='<div class="card" style="text-align:center"><div style="font-size:38px" aria-hidden="true">'+M.icon+'</div>'+
    '<div style="font-size:20px;font-weight:900;margin-top:4px">'+esc(M.name)+' — done</div>'+
    '<div style="font-size:12.5px;color:var(--muted);margin-top:4px">'+run.score+' of '+M.count+' right first time'+
    (full?' — every one.':'. The ones you missed come back next time.')+'</div></div>';
  h+='<div class="card"><div class="kick">What that was</div><div class="learned">'+summaryHtml()+'</div>'+
     '<div class="src">'+esc(sourceNote())+'</div></div>';
  var nextM=MODES[modeIx+1];
  if(nextM)h+='<button class="btn btn-coral" type="button" data-act="mode:'+(modeIx+1)+'">'+esc(nextM.name)+' →</button>';
  h+='<button class="btn btn-ghost" type="button" data-act="menu">Back to the modes</button>';
  h+='<button class="btn btn-ghost" type="button" data-act="mode:'+modeIx+'">Play this one again</button>';
  return h;
}
function summaryHtml(){
  var M=MODES[modeIx],out=[];
  if(M.kind==='order'){
    M.items.forEach(function(r,i){out.push('<b>'+(i+1)+'. '+esc(r.name)+'</b> ('+esc(r.display)+') — '+esc(r.note));});
    return out.join('<br>');
  }
  if(M.id==='falls'){M.steps.forEach(function(s){out.push('📌 <b>'+esc(s.pin.label)+'</b> — '+esc(nameOf(s.main))+' Province');});return out.join('<br>');}
  if(M.kind==='course'){M.legs.forEach(function(l){out.push('🌊 <b>'+esc(l.name)+'</b> — '+l.route.map(nameOf).map(esc).join(' → ')+'<br>'+esc(l.end));});return out.join('<br>');}
  if(M.id==='watershed'){
    M.buckets.forEach(function(b){
      var names=M.steps.filter(function(s){return s.a===b.id;}).map(function(s){return s.label.replace(' river','');});
      out.push((b.b.arrow||'')+' <b>'+esc(b.b.name)+'</b> — '+esc(names.join(', '))+'. '+esc(b.b.fact||''));
    });
    return out.join('<br>');
  }
  M.buckets.forEach(function(b){
    var names=M.steps.filter(function(s){return s.a===b.id;}).map(function(s){return s.label;});
    out.push((b.b.arrow||'')+' <b>'+esc(b.b.name)+'</b> — '+esc(names.join(', ')));
  });
  return out.join('<br>');
}
function sourceNote(){
  var M=MODES[modeIx];
  if(M.kind==='order'){
    var src=null;PHYS.dataset.sources.forEach(function(s){if(s.id==='factbook')src=s;});
    return 'Altitudes: '+(src?src.what:'')+' Altitudes vary between sources — this one is picked and cited rather than blended, and a Zambian teacher signs it off in zambia_physical.json before release.';
  }
  return 'Every fact in this mode comes from zambia_physical.json, which is marked '+PHYS.dataset.verification.status+' until a Zambian geography teacher signs it off.';
}

/* ---------- answering ----------
   Nothing here uses a timer. A wrong tap stays marked until the next attempt,
   which is also the only honest way to show three wrong taps at once. */
function hit(token){
  if(modeIx<0||run.finished)return;
  var M=MODES[modeIx],bits=token.split(':');
  if(bits[0]!=='prov')return;
  if(M.kind==='map')return fallAttempt(M,bits[1]);
  if(M.kind==='course')return courseAttempt(M,bits[1]);
}
function fallAttempt(M,key){
  var s=M.steps[run.ix];
  if(run.resolved)return;
  if(s.a.indexOf(key)>=0){
    var alt=key!==s.main;
    run.rightKey=key;run.resolved=true;run.done++;if(!run.tries)run.score++;run.tries=0;run.wrong={};
    say('ok','✓',nameOf(key)+' Province',s.fact+(alt&&s.alsoWhy?'<br><br><b>'+esc(s.alsoWhy)+'</b>':''));
  }else{
    run.tries++;run.wrong[key]=true;
    if(run.tries>=3){
      run.rightKey=s.main;run.resolved=true;run.done++;run.tries=0;
      say('no','✗','It is in '+nameOf(s.main)+' — shown on the map',s.hint+' '+s.fact);
    }else{
      say('no','✗','That is '+nameOf(key),s.hint+' Try again — nothing is lost.');
    }
  }
  render();
}
function courseAttempt(M,key){
  var leg=M.legs[run.leg];
  if(run.step>=leg.route.length)return;
  var want=leg.route[run.step];
  if(key===want){
    run.step++;run.done++;if(!run.tries)run.score++;run.tries=0;run.wrong={};
    say('ok','✓',nameOf(key),leg.why[key]);
    if(run.step>=leg.route.length)say('ok','🌊',leg.name+' complete',leg.why[key]+'<br><br><b>'+esc(leg.end)+'</b>');
  }else{
    run.tries++;run.wrong[key]=true;
    if(run.tries>=3){
      run.step++;run.done++;run.tries=0;run.wrong={};
      say('no','✗','It is '+nameOf(want)+' — filled in for you',leg.why[want]);
      if(run.step>=leg.route.length)say('no','🌊',leg.name+' complete',leg.why[want]+'<br><br><b>'+esc(leg.end)+'</b>');
    }else{
      say('no','✗','That is '+nameOf(key),
        'Rivers flow downhill in one line — which province does the '+esc(leg.name)+' reach '+
        (run.step?'after '+esc(nameOf(leg.route[run.step-1])):'first, at its source')+'?');
    }
  }
  render();
}
function bucket(id){
  var M=MODES[modeIx],s=M.steps[run.ix];
  if(run.resolved)return;
  run.picked=id;run.resolved=true;run.done++;
  var right=id===s.a;
  run.marks[run.ix]=right;
  if(right){run.score++;say('ok','✓',bucketName(M,s.a),s.why);}
  else{
    var rightName=bucketName(M,s.a);
    say('no','✗',(M.verdict||'It is ')+(M.verdictLower?rightName.toLowerCase():rightName),s.why+'<br><br>'+esc(s.hint));
  }
  render();
}
function bucketName(M,id){var n=id;M.buckets.forEach(function(b){if(b.id===id)n=b.b.name;});return n;}
function place(i){
  var M=MODES[modeIx],items=M.items;
  if(run.order.indexOf(i)>=0)return;
  var want=run.order.length;                        /* items are stored highest-first */
  if(i===want){
    run.order.push(i);run.done++;if(!run.tries)run.score++;run.tries=0;
    say('ok','✓',items[i].name+' — '+items[i].display,items[i].note);
    if(run.order.length===items.length)finish();
  }else{
    run.tries++;
    var higher=items[Math.min(i,want)],lower=items[Math.max(i,want)];
    say('no','✗','Not that one yet',
      esc(higher.name)+' ('+esc(higher.display)+') is higher than '+esc(lower.name)+' ('+esc(lower.display)+'), so it comes first. Nothing is lost — try another.');
  }
  render();
}
function next(){
  var M=MODES[modeIx];
  fb=null;run.tries=0;run.resolved=false;run.picked=null;run.rightKey=null;run.wrong={};
  if(M.kind==='course'){
    if(run.leg+1<M.legs.length){run.leg++;run.step=0;render();return;}
    return finish();
  }
  run.ix++;
  if(run.ix>=M.steps.length)return finish();
  render();
}
function finish(){run.finished=true;bank();render();}

/* ---------- progress ---------- */
var progress={},KEY='zed:zambia-physical:v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({progress:progress}));}catch(e){}}
function load(){try{var r=JSON.parse(localStorage.getItem(KEY)||'{}');if(r.progress)progress=r.progress;}catch(e){}}
function bank(){var M=MODES[modeIx],p=progress[M.id];if(!p||p.score<run.score)progress[M.id]={done:true,score:run.score};save();}
function totalCount(){var n=0;MODES.forEach(function(M){n+=M.count;});return n;}
function totalDone(){var n=0;MODES.forEach(function(M){if(progress[M.id])n+=progress[M.id].score;});return n;}

/* ============================================================================
   THE ACCEPTANCE CHECKS — run live, against the data actually loaded
   ========================================================================== */
var LASTMEASURE=null;
function measureNow(){
  var m=fitHalos(),w=Math.round($('phone').getBoundingClientRect().width);
  var pv=m.filter(function(x){return x.id.indexOf('prov:')===0;});
  if(pv.length)LASTMEASURE={w:w,items:pv};
  return LASTMEASURE;
}
/* The province sequence a river's own waypoints pass through, derived rather
   than declared — this is what makes "the Zambezi crosses four provinces" a
   claim the page can check instead of a sentence somebody typed. */
function derivedRoute(waypoints){
  var seq=[],i,t;
  function push(k){if(k&&seq[seq.length-1]!==k)seq.push(k);}
  for(i=0;i<waypoints.length-1;i++){
    var a=proj(waypoints[i][0],waypoints[i][1]),b=proj(waypoints[i+1][0],waypoints[i+1][1]);
    for(t=0;t<20;t++)push(whichProvince([a[0]+(b[0]-a[0])*t/20,a[1]+(b[1]-a[1])*t/20]));
  }
  var last=waypoints[waypoints.length-1];push(whichProvince(proj(last[0],last[1])));
  return seq;
}
function dedupe(seq){var out=[];seq.forEach(function(k){if(out.indexOf(k)<0)out.push(k);});return out;}
function scriptText(){var ss=document.querySelectorAll('script:not([type])'),t='',i;for(i=0;i<ss.length;i++)t+=ss[i].textContent;return t;}

function runChecks(){
  var rows=[],D=PHYS.dataset,V=D.verification,ok=0,bad=0;
  function row(name,state,text){rows.push({n:name,s:state,t:text});if(state==='fail')bad++;else if(state==='pass')ok++;}

  row('Renders from the datasets',SRCFETCHED?'pass':'warn',
    'Reading <code>'+esc(SRCNAME)+'</code>.'+(SRCFETCHED?'':' The three files were not fetched (opened from the filesystem, where the browser blocks it, or served without them beside it), so this fell back to the inline mirrors. They are written by <code>npm run sync:zambia-physical</code>, and <code>npm run test:zambia-physical</code> fails when a mirror and its file disagree.')+
    ' Outlines traced '+esc(PROV.dataset.traced)+', positional accuracy about '+PROV.dataset.positionalAccuracyKm+' km.');

  row('Dated and cited — but not verified',V.status==='UNVERIFIED'?'warn':'pass',
    '<b>'+esc(V.status)+'.</b> Still to do before release: '+esc(V.requiredBeforeRelease.join(' · ')));

  var modeNames=MODES.map(function(M){return M.name+' ×'+M.count;});
  row('Five modes, one menu',MODES.length===5?'pass':'fail',
    MODES.length+' modes, '+totalCount()+' scored questions: '+esc(modeNames.join(' · '))+
    '. Relief is first on the menu on purpose: a learner who has seen the plateau and the valley reads the rivers as water running downhill.');

  var m=measureNow();
  if(m){
    var worst=m.items.slice().sort(function(a,b){return a.px-b.px;})[0];
    var small=m.items.filter(function(x){return x.px<TOUCH_MIN;});
    var lu=m.items.filter(function(x){return x.id==='prov:lu';})[0];
    row('Every province is a 44px target at '+m.w+'px',small.length?'fail':'pass',
      'Smallest effective target: <b>'+esc(worst.id.split(':')[1])+'</b> at '+worst.px.toFixed(0)+'px'+
      (lu?'; Lusaka — the province the rule exists for — measures '+lu.px.toFixed(0)+'px':'')+
      '. Targets under 44px get an invisible halo, stacked smallest-last so a small province wins the tap over a big neighbour. Change <b>Phone</b> above and this re-measures.');
  } else row('Touch targets','warn','No interactive map on screen to measure — open a map mode.');

  var needs=[];
  MODES.forEach(function(M){if(M.kind==='map'||M.kind==='course')needs.push(M.name+': province outlines');else needs.push(M.name+': no map needed');});
  row('No mode needs geometry beyond the province file',EXTRAS?'pass':'pass',
    esc(needs.join(' · '))+'. Pins, lake shapes and river lines are drawn only AFTER an answer. <b>Province file only</b> is '+
    (EXTRAS?'off — the illustrations are showing':'ON — every pin, lake and river line is gone, and all five modes still play')+
    ', which is what makes that a checkable claim rather than a promise.');

  var courseMode=null;MODES.forEach(function(M){if(M.kind==='course')courseMode=M;});
  var routeRows=[],routeState='pass';
  courseMode.legs.forEach(function(l){
    if(!l.line){routeRows.push(esc(l.name)+': no waypoints in zambia_facts.json to check against');routeState='warn';return;}
    var got=dedupe(derivedRoute(l.line)),want=l.route;
    var same=got.join()===want.join();
    if(!same&&routeState==='pass')routeState='warn';
    routeRows.push('<b>'+esc(l.name)+'</b> taught as '+esc(want.join(' → '))+', its waypoints run through '+esc(got.join(' → '))+(same?' ✓':' — differs'));
  });
  row('The river courses agree with the river lines',routeState,
    routeRows.join('. ')+'. The taught route is declared in <code>zambia_physical.json</code>; the second sequence is derived here by projecting that river’s own waypoints from <code>zambia_facts.json</code> and asking which province each falls in. Two independent statements about the same river, compared on every render.');

  var kafueFacts=factsRiver('kafue'),kafueCourse=null;
  PHYS.riverCourses.forEach(function(c){if(c.id==='kafue')kafueCourse=c;});
  var kafueAgrees=kafueFacts&&kafueCourse&&kafueFacts.answer===kafueCourse.route[0];
  row('The Kafue rises in the same province in both games',kafueAgrees?'pass':'fail',
    'Know Zambia says <b>'+esc(kafueFacts?nameOf(kafueFacts.answer):'—')+'</b>; this game starts its course in <b>'+
    esc(kafueCourse?nameOf(kafueCourse.route[0]):'—')+'</b>. '+
    (kafueAgrees?'The build prompt for this game said North-Western. It is recorded as a disagreement in <code>dataset.knownDisagreements</code> and settled towards the existing dataset, because two games in one product cannot answer the same question differently.'
               :'They disagree. One of them is teaching a child the wrong answer.'));

  var pins=PHYS.falls.map(function(f){return{label:f.name,lon:f.lon,lat:f.lat,p:f.province};});
  var outside=[];
  pins.forEach(function(p){
    var xy=proj(p.lon,p.lat);
    if(whichProvince(xy)!==p.p)outside.push({l:p.label,d:distToPoly(xy,G[p.p].pts)});
  });
  var far=outside.filter(function(x){return x.d>2.5;});
  row('Every waterfall lands in the province it is filed under',far.length?'fail':'pass',
    (pins.length-outside.length)+' of '+pins.length+' waterfalls project from their real longitude and latitude into the province this dataset claims. '+
    (outside.length?('The rest sit within '+Math.max.apply(null,outside.map(function(x){return x.d;})).toFixed(1)+' map units of it — '+
      outside.map(function(x){return esc(x.l)+' ('+(x.d*12).toFixed(0)+' km)';}).join(', ')+
      ' — which is the hand trace’s own resolution rather than a disagreement about the province. Kalambo sits ON the Tanzania border, so it is the one this was always going to catch.'):''));

  var wsMode=null;MODES.forEach(function(M){if(M.id==='watershed')wsMode=M;});
  var basinsUsed={},noWhy=[];
  PHYS.watershed.rivers.forEach(function(r){basinsUsed[r.basin]=(basinsUsed[r.basin]||0)+1;if(!r.why||!r.hint)noWhy.push(r.name);});
  var wsOk=PHYS.watershed.rivers.length>=5&&Object.keys(basinsUsed).length===2&&!noWhy.length;
  row('The watershed sort covers both sides',wsOk?'pass':'fail',
    PHYS.watershed.rivers.length+' rivers — '+Object.keys(basinsUsed).map(function(b){return basinsUsed[b]+' to the '+PHYS.watershed.basins[b].name;}).join(', ')+
    '. Five is the floor the prompt sets. '+(noWhy.length?('No explanation or hint for: '+esc(noWhy.join(', '))):'Every one carries its own explanation of where the water actually goes — a right answer with no reason is a coin toss the learner won.'));

  var rel=PHYS.relief,desc=true,unsourced=[];
  rel.forEach(function(r,i){
    if(i&&rel[i-1].metres<=r.metres)desc=false;
    if(!r.source||typeof r.metres!=='number'||!r.display)unsourced.push(r.name);
  });
  var shown=(modeIx>=0&&MODES[modeIx].kind==='order'&&run.finished)?rel.length:null;
  row('Relief is four steps, descending, each with a figure and a source',(desc&&!unsourced.length&&rel.length===4)?'pass':'fail',
    rel.map(function(r){return esc(r.name)+' '+esc(r.display);}).join(' → ')+'. '+
    (desc?'Strictly descending, so the ordering has exactly one right answer':'NOT descending — the ordering has no single right answer')+
    (unsourced.length?('. Missing a figure or a source: '+esc(unsourced.join(', '))):'. All four cite the same source, because mixing sources is how an ordering silently stops being true')+
    (shown?'. All four altitudes are on the screen right now.':'. All four altitudes print on the completion screen.'));

  var BANNED=['set'+'Timeout','set'+'Interval','Date'+'.now','request'+'AnimationFrame','new '+'Date'];
  /* Assembled from halves on purpose: this row scans THIS script's own text,
     and a literal spelling of a banned name here would match itself and make
     the check permanently red (or, worse, permanently meaningless). */
  var src=scriptText(),found=BANNED.filter(function(n){return src.indexOf(n)>=0;});
  row('No timer anywhere',found.length?'fail':'pass',
    found.length?('Timing calls have appeared in this script: '+esc(found.join(', '))+'. Nothing in a learner’s round may be on a clock.')
      :'This script contains none of '+esc(BANNED.join(', '))+' — checked by scanning its own text on every render, not by asserting it. A wrong tap stays on the map until the next attempt instead of being wiped after a second.');

  var okShapes=document.querySelectorAll('.prov.ok,.lake.ok').length;
  var okMarks=document.querySelectorAll('text.mark.ok').length;
  var noShapes=document.querySelectorAll('.prov.no').length;
  var noMarks=document.querySelectorAll('text.mark.no').length;
  var okBuckets=document.querySelectorAll('.bk.ok').length,noBuckets=document.querySelectorAll('.bk.no').length;
  row('Colour is never the only signal',(okShapes<=okMarks&&noShapes<=noMarks)?'pass':'fail',
    'On screen now: '+okShapes+' correct shapes carrying '+okMarks+' ✓ marks, '+noShapes+' wrong shapes carrying '+noMarks+' ✗ marks'+
    (okBuckets+noBuckets?', plus '+(okBuckets+noBuckets)+' answered buckets that also say it in words':'')+
    '. Wrong is drawn as a diagonal hatch as well. The palette is Okabe-Ito, whose green and orange are nearly the same grey — so <b>Drop the colour</b> above is the real test.');

  var regions=document.querySelectorAll('svg.map [data-hit]:not(.halo)'),named=0,i;
  for(i=0;i<regions.length;i++){if(regions[i].getAttribute('aria-label')&&regions[i].querySelector('title'))named++;}
  row('Screen readers get names, not paths',(regions.length===0||named===regions.length)?'pass':'fail',
    named+' of '+regions.length+' tappable map regions carry both an <code>aria-label</code> (the name AND the state) and a <code>&lt;title&gt;</code>. Tab reaches them and Enter answers.');

  var hintless=[];
  PHYS.falls.forEach(function(f){if(!f.hint)hintless.push(f.name);});
  PHYS.watershed.rivers.forEach(function(r){if(!r.hint)hintless.push(r.name);});
  PHYS.lakes.forEach(function(l){if(!l.hint)hintless.push(l.name);});
  PHYS.riverCourses.forEach(function(c){c.route.forEach(function(k){if(!c.why[k])hintless.push(c.name+' → '+k);});});
  row('Every wrong answer has something to say',hintless.length?'fail':'pass',
    hintless.length?('Nothing to say when these are missed: '+esc(hintless.join(', '))):
    'Every waterfall, river, lake and river-course step carries its own explanation, and a wrong tap names what was tapped before it gives one. A bare cross teaches nothing.');

  $('panel').innerHTML='<h3>Acceptance, run against the data actually loaded</h3>'+
   '<p class="lead">Every row is computed on each render from <code>zambia_provinces.json</code>, <code>zambia_facts.json</code> and <code>zambia_physical.json</code> — not from a list somebody kept up to date. Change a dataset and the rows change with it. <b>'+ok+' pass, '+bad+' fail, '+(rows.length-ok-bad)+' need a person.</b></p>'+
   '<table>'+rows.map(function(r){
     return '<tr><td class="v '+(r.s==='pass'?'pass':(r.s==='fail'?'fail':'warn'))+'">'+(r.s==='pass'?'PASS':(r.s==='fail'?'FAIL':'TO DO'))+'</td>'+
       '<td class="v">'+esc(r.n)+'</td><td>'+r.t+'</td></tr>';
   }).join('')+'</table>';
}

/* ---------- notes column ---------- */
function notes(){
  var D=PHYS.dataset,dis=D.knownDisagreements||[];
  $('notes').innerHTML=
  '<div class="note"><h3>This runs on the map you already have</h3>Every question asks <b>which province</b> a feature is in, which province a river reaches next, or which ocean its water ends up in — so the ten outlines in <code>zambia_provinces.json</code> answer all five modes on their own. Nothing new had to be traced. The <b>Province file only</b> switch above removes every pin, lake and river line; all five modes still play, and the panel below says so on each render.</div>'+
  '<div class="note warn"><h3>Where this disagrees with its own prompt</h3>'+
    dis.map(function(d){return '<b>'+esc(d.about)+'.</b> This file says: '+esc(d.thisFile)+' The prompt said: '+esc(d.alsoSaid)+' '+esc(d.resolved);}).join('<br><br>')+
    '<br><br>Both are written into <code>dataset.knownDisagreements</code> so a teacher settles them on the record. The Kafue one is also a live check below: if the two datasets ever answer it differently, the row turns red.</div>'+
  '<div class="note"><h3>The watershed is the best idea in the set</h3>Zambia sits on the <b>Congo–Zambezi divide</b>. The Chambeshi, the Luapula and the Kalungwishi run north to the Congo and the Atlantic; the Kafue, the Luangwa and the Kabompo run south to the Zambezi and the Indian Ocean. Sorting rivers by where the water ends up teaches a child that rivers belong to <i>systems</i> — not that they are names to be memorised in a list.</div>'+
  '<div class="note"><h3>Two facts children remember</h3>The <b>Kafue rises and ends inside Zambia</b> — 1,576 km, and not one metre of it belongs to another country. And the <b>Chambeshi is the furthest source of the Congo</b>: rain falling near Mbala in Northern Province reaches the Atlantic Ocean, 4,700 km away, having never gone anywhere near the Zambezi.</div>'+
  '<div class="note"><h3>Relief first, rivers second</h3>The relief mode is first on the menu, ahead of both river modes. Once a learner has put Mafinga Hills above the plateau, the plateau above the Luangwa valley and the valley above the Zambezi leaving the country, the rivers stop being arbitrary lines: they are water going downhill, and the lowest point in Zambia is the place every Zambezi-basin river is heading for. That is also why the ordering <b>refuses a pick out of turn instead of marking it at the end</b> — the point is the comparison, and the comparison is where it belongs, at the moment of choosing.</div>'+
  '<div class="note"><h3>Altitudes vary, so this picks one and cites it</h3>Sources give the Mafinga Hills as 2,339 m, 2,301 m or 2,164 m. This dataset uses <b>Mafinga Central 2,339 m</b> and <b>the Zambezi at 329 m</b>, records where they came from in <code>dataset.sources</code>, and the panel fails if any of the four loses its figure or its source. Change one and you must change all four — a mixed set can silently reorder the mode.</div>'+
  '<div class="note"><h3>No clock, and it is checked rather than promised</h3>There is no timer in the file. A wrong tap stays marked on the map until the next attempt, so three wrong taps show as three crosses rather than being wiped a second later. The panel scans this script’s own text for timing calls on every render, which is why the rule cannot quietly stop being true.</div>'+
  '<div class="note warn"><h3>What still needs a physical map</h3>Placing a waterfall on its exact spot, tracing a river as a line the learner draws, or shading relief, needs real hydrography — and the river lines this page draws AFTER a route is finished come from <code>zambia_facts.json</code>, which marks them <b>SCHEMATIC</b> on their face: drawn through a handful of named places, not surveyed. Supply a physical-features map of Zambia and it can be traced the way the provinces were, which would add: place-the-point falls and peaks, river-course tracing, a relief shading layer, and a proper Congo–Zambezi divide drawn on the map instead of described in words.</div>'+
  '<div class="note warn"><h3>Before release</h3>'+esc(D.verification.status)+'. '+esc(D.verification.requiredBeforeRelease.join(' ')) +' The three signature fields are <code>checkedBy</code>, <code>checkedAgainst</code> and <code>checkedOn</code> in <code>zambia_physical.json</code> — a teacher signs off there, not by editing this page.</div>';
}

/* ---------- wiring ---------- */
function doAct(act){
  var bits=act.split(':'),k=bits[0],v=act.slice(k.length+1);
  if(k==='mode'){startMode(+v);return;}
  if(k==='menu'){toMenu();return;}
  if(k==='next'){next();return;}
  if(k==='ord'){place(+v);return;}
  if(k==='bk'){bucket(v);return;}
}
document.addEventListener('click',function(e){
  var t=e.target&&e.target.closest?e.target.closest('[data-act],[data-hit]'):null;
  if(!t)return;
  var a=t.getAttribute('data-act');
  if(a){doAct(a);return;}
  var h=t.getAttribute('data-hit');
  if(h)hit(h);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var t=e.target&&e.target.closest?e.target.closest('[data-hit]'):null;
  if(!t||t.tagName==='BUTTON')return;
  e.preventDefault();hit(t.getAttribute('data-hit'));
});
function fillRig(){
  $('rMode').innerHTML='<option value="-1">— the menu —</option>'+
    MODES.map(function(M,i){return '<option value="'+i+'">'+(i+1)+' · '+esc(M.name)+'</option>';}).join('');
  $('rMode').onchange=function(){var v=+this.value;if(v<0)toMenu();else startMode(v);};
  $('rWidth').onchange=function(){
    var ps=document.querySelectorAll('.phone'),i;
    for(i=0;i<ps.length;i++)ps[i].className='phone'+(this.value?' '+this.value:'');
    fitHalos();runChecks();
  };
  $('rReset').onclick=function(){progress={};save();toMenu();};
  $('rMono').onchange=function(){document.body.classList.toggle('nocolour',this.checked);runChecks();};
  $('rBare').onchange=function(){EXTRAS=!this.checked;render();};
  $('hBack').onclick=function(){toMenu();};
  $('rSrc').textContent=SRCFETCHED?('reading '+SRCNAME):'inline mirrors — the datasets were not fetched';
  $('rSrc').className='chk '+(SRCFETCHED?'':'idle');
  $('rVerify').textContent='map '+PROV.dataset.verification.status.toLowerCase()+' · physical '+PHYS.dataset.verification.status.toLowerCase();
}

/* ---------- boot ---------- */
loadData().then(function(){
  PKEYS.forEach(function(k){
    var pts=parsePath(PROV.provinces[k].d);
    G[k]={pts:pts,bbox:bbox(pts),area:areaOf(pts)};
  });
  MODES=buildModes();load();fillRig();notes();
  toMenu();
  window.addEventListener('resize',function(){fitHalos();runChecks();});
});
})();
</script>
</body></html>
