<!DOCTYPE html>
<html lang="en-ZM">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <!--
      Brand-level defaults. This file is the SPA fallback shell for every route
      and the homepage card source (prerender skips "/" on purpose), and no-JS
      social scrapers (WhatsApp/Facebook/LinkedIn) read these static tags. Keep
      the copy brand-level, not route-specific — per-route titles/descriptions
      come from <SeoHelmet> at runtime and from the prerendered route HTML.
    -->
    <title>ZedExams — Zambian CBC Exam Prep, Quizzes &amp; AI Study Help</title>
    <meta name="description" content="Daily exams, quizzes, lessons, games and AI study help for Zambian CBC learners (Grade 4–7), plus printable lesson-planning tools for teachers." />
    <meta name="author" content="ZedExams" />
    <!--
      No static canonical link element here, on purpose.

      This file is the single shell for every SPA route, so a hardcoded
      canonical declares "https://zedexams.com/" on /pricing, /papers,
      /blog/*, etc. Googlebot reads raw HTML on its first crawl pass
      (before it renders JS), so every page told Google it was a duplicate
      of the homepage — which kept everything but / out of the index and
      surfaced as "Alternate page with proper canonical tag" in Search
      Console. react-helmet-async also *adds* its own canonical at runtime,
      so the static tag produced two conflicting canonicals after hydration.

      Per-route canonicals are set by <SeoHelmet path="..."> instead
      (src/components/seo/SeoHelmet.jsx). Routes without SeoHelmet
      self-canonicalise to the fetched URL, which is correct. Do not
      re-add a static canonical without per-route prerendering. -->

    <!-- Viewport + theme -->
    <!--
      color-scheme:light opts the site OUT of the browser's auto-dark behaviour.
      Without this, form controls (<select>, date pickers, scrollbars, the pre-
      React paint, etc.) pick up the OS dark-mode palette and clash with the
      in-app ThemeProvider — the page reads as "a bit too dark" on dark-mode
      browsers. Users who want a dark palette can still pick Midnight from the
      theme switcher; OS preference just stops forcing it.
    -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0F1B2D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZedExams" />
    <meta name="application-name" content="ZedExams" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/zedexams-logo.png?v=5" />
    <link rel="apple-touch-icon" href="/zedexams-logo.png?v=5" />

    <!-- PWA manifest — makes the site installable as a home-screen app on
         Android. No service worker yet, so it doesn't work offline; that
         lands separately as part of the full PWA work (audit A1). -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZedExams" />
    <meta property="og:title" content="ZedExams — Zambian CBC Exam Prep, Quizzes &amp; AI Study Help" />
    <meta property="og:description" content="Daily exams, quizzes, lessons, games and AI study help for Zambian CBC learners (Grade 4–7), plus printable lesson-planning tools for teachers." />
    <meta property="og:url" content="https://zedexams.com/" />
    <meta property="og:image" content="https://zedexams.com/zedexams-logo.png?v=5" />
    <meta property="og:image:alt" content="ZedExams" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1431" />
    <meta property="og:image:height" content="1762" />
    <meta property="og:locale" content="en_ZM" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZedExams — Zambian CBC Exam Prep, Quizzes &amp; AI Study Help" />
    <meta name="twitter:description" content="Daily exams, quizzes, lessons, games and AI study help for Zambian CBC learners (Grade 4–7), plus printable lesson-planning tools for teachers." />
    <meta name="twitter:image" content="https://zedexams.com/zedexams-logo.png?v=5" />

    <!-- Structured data — helps Google show rich results for queries
         like "Zambian CBC exam prep" or "Grade 7 ECZ revision". The
         richer the EducationalOrganization profile, the more likely
         brand queries get the knowledge-panel treatment with the
         logo, contact, and audience pulled in. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "ZedExams",
      "alternateName": "ZedExams.com",
      "url": "https://zedexams.com/",
      "logo": "https://zedexams.com/zedexams-logo.png?v=5",
      "description": "Zambian CBC exam prep — daily exams, quizzes, lessons, games and AI study help for Grade 4–7 learners, plus printable lesson tools for Zambian teachers.",
      "areaServed": { "@type": "Country", "name": "Zambia" },
      "inLanguage": "en-ZM",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "ZM"
      },
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "telephone": "+260977740465",
          "email": "support@zedexams.com",
          "availableLanguage": ["en"],
          "areaServed": "ZM"
        }
      ],
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student",
        "audienceType": "Zambian CBC learners (Grade 4–7) and teachers"
      },
      "sameAs": []
    }
    </script>

    <!--
      Fonts — single CSS request, trimmed weights, display=swap so text paints
      immediately in a fallback face and swaps when the webfont arrives.

      Loaded NON-render-blocking: the Google Fonts stylesheet was the top
      render-blocking request in PageSpeed (≈310ms added to FCP/LCP). Serving it
      as media="print" fetches it at a low priority without blocking first
      paint; /public/boot.js then promotes #zed-fonts to media="all" once it
      loads (an addEventListener('load') swap — this used to be an inline
      onload="this.media='all'" attribute, moved out so the CSP script-src can
      drop 'unsafe-inline'). The <noscript> copy keeps the fonts for the (rare)
      no-JS path. Because every face uses display=swap, deferring the CSS never
      hides text — the fallback shows instantly and the webfont swaps in with no
      layout shift.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      id="zed-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      media="print"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!--
      Warm up the Firebase connections opened during auth so TLS isn't in the
      critical path. examsprepzambia.firebaseapp.com hosts the auth-helper
      iframe (auth/iframe.js) that loads on every page — PageSpeed flagged it
      as the largest LCP-blocking origin (≈310ms), so it's preconnected here.
      identitytoolkit.googleapis.com is only hit once a user actually signs in
      (PageSpeed marked its preconnect "unused" on the landing page), so it's
      downgraded to dns-prefetch to keep us within the ~4-preconnect budget
      without hurting sign-in latency.
    -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://examsprepzambia.firebaseapp.com" crossorigin />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebaseinstallations.googleapis.com" />

    <!--
      Boot scripts (theme guard + font promotion + white-screen watchdog) live
      in /public/boot.js rather than inline so the CSP can drop 'unsafe-inline'
      from script-src. Preloaded here so it downloads during head parse and the
      render-blocking <script src="/boot.js"> at the top of <body> resolves
      near-instantly — the boot skeleton still paints fast.
    -->
    <link rel="preload" href="/boot.js" as="script" />

    <!--
      Analytics (inactive by default).
      When ready to track launch traffic, uncomment ONE of these blocks:

      Option A — Plausible (recommended, privacy-friendly, cookie-less, $9/mo):
        <script defer data-domain="zedexams.com" src="https://plausible.io/js/script.js"></script>

      Option B — Google Analytics 4 (free, cookie-based):
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-XXXXXXXXXX');
        </script>
    -->
  </head>
  <body>
    <!--
      Boot scripts — theme guard (pre-paint, avoids a palette flash), Google
      Fonts promotion, and the white-screen watchdog. Externalised to
      /public/boot.js so the CSP script-src can stay free of 'unsafe-inline';
      preloaded in <head> so this render-blocking fetch resolves near-instantly.
      Runs first so its error listeners are registered before the app boots.
    -->
    <script src="/boot.js"></script>
    <div id="root">
      <!--
        Inline boot skeleton — paints in the first frame with no JS/CSS bundle,
        so a cold mobile load shows the brand loader instantly instead of a
        blank screen for several seconds (real-user FCP p75 was ~4.5s on
        mobile). React's createRoot() clears #root when it mounts, so this is
        removed automatically; the boot watchdog's appMounted() ignores it so a
        genuine hang still surfaces the recovery UI.

        The animation is the brand ring loader (glow + two counter-rotating
        blue/orange arcs around the app-icon badge + indeterminate bar) and
        MUST stay markup/keyframes-identical to <FullScreenLoader /> so the
        skeleton → React hand-off is seamless — the ring keeps turning.
      -->
      <div id="zed-boot-skeleton" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;box-sizing:border-box;background:#FDF6EC;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
        <div class="zed-boot-loader" aria-hidden="true">
          <div class="zed-boot-glow"></div>
          <svg class="zed-boot-ring" viewBox="0 0 160 160" role="presentation">
            <circle class="zed-boot-track" cx="80" cy="80" r="72"></circle>
            <g class="zed-boot-arc zed-boot-arc--blue">
              <circle class="zed-boot-stroke zed-boot-stroke--blue" cx="80" cy="80" r="72"></circle>
              <circle class="zed-boot-dot--blue" cx="80" cy="8" r="6"></circle>
            </g>
            <g class="zed-boot-arc zed-boot-arc--orange">
              <circle class="zed-boot-stroke zed-boot-stroke--orange" cx="80" cy="80" r="72"></circle>
              <circle class="zed-boot-dot--orange" cx="80" cy="152" r="6"></circle>
            </g>
          </svg>
          <img class="zed-boot-badge" src="/zedexams-app-icon.jpg?v=1" alt="" width="64" height="64" draggable="false" />
        </div>
        <div style="font-size:1.6rem;font-weight:800;letter-spacing:-0.02em;color:#1A1F2E;">Zed<span style="color:#C5613F;">Exams</span></div>
        <div class="zed-boot-bar"><div class="zed-boot-bar-fill"></div></div>
        <style>
          .zed-boot-loader { position: relative; width: 140px; height: 140px; display: grid; place-items: center; }
          .zed-boot-glow { position: absolute; inset: -18%; border-radius: 50%; background: radial-gradient(circle, rgba(197, 97, 63, 0.22) 0%, rgba(197, 97, 63, 0) 68%); filter: blur(6px); animation: zed-boot-glow 2.8s ease-in-out infinite; }
          .zed-boot-ring { position: absolute; inset: 0; width: 100%; height: 100%; }
          .zed-boot-track { fill: none; stroke: #EBD9C2; stroke-width: 5; opacity: 0.5; }
          .zed-boot-arc { transform-origin: 50% 50%; animation: zed-boot-spin 1.5s linear infinite; }
          .zed-boot-arc--orange { animation-duration: 1.9s; animation-direction: reverse; }
          .zed-boot-stroke { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 135 320; }
          .zed-boot-stroke--blue { stroke: #2563EB; }
          .zed-boot-stroke--orange { stroke: #C5613F; }
          .zed-boot-dot--blue { fill: #2563EB; }
          .zed-boot-dot--orange { fill: #C5613F; }
          .zed-boot-badge { position: relative; z-index: 1; width: 64px; height: 64px; border-radius: 16px; object-fit: cover; box-shadow: 0 6px 16px rgba(26, 31, 46, 0.28); user-select: none; -webkit-user-drag: none; }
          .zed-boot-bar { position: relative; width: min(78vw, 320px); height: 4px; border-radius: 999px; background: #EBD9C2; overflow: hidden; }
          .zed-boot-bar-fill { position: absolute; top: 0; left: 0; height: 100%; width: 40%; border-radius: 999px; background: linear-gradient(90deg, #2563EB, #C5613F); animation: zed-boot-bar 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
          @media (max-width: 767px) { .zed-boot-loader { width: 112px; height: 112px; } }
          @keyframes zed-boot-spin { to { transform: rotate(360deg); } }
          @keyframes zed-boot-glow { 0%, 100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.04); } }
          @keyframes zed-boot-bar { 0% { left: -40%; width: 40%; } 50% { left: 25%; width: 55%; } 100% { left: 100%; width: 40%; } }
          @media (prefers-reduced-motion: reduce) {
            .zed-boot-arc, .zed-boot-glow { animation: none; }
            .zed-boot-bar-fill { animation: none; left: 0; width: 100%; opacity: 0.8; }
          }
        </style>
      </div>
    </div>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:#FDF6EC;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1A1F2E;text-align:center;">
        <div style="max-width:480px;">
          <h1 style="font-size:1.5rem;font-weight:800;margin:0 0 0.5rem;">ZedExams needs JavaScript</h1>
          <p style="margin:0 0 1rem;line-height:1.5;color:#4B6280;">
            ZedExams is an interactive learning app — quizzes, lessons, and games all run in your browser, so JavaScript is required. Please enable JavaScript and reload the page.
          </p>
          <p style="margin:0;font-size:0.875rem;color:#4B6280;">
            Need help? Email
            <a href="mailto:support@zedexams.com" style="color:#C5613F;font-weight:700;">support@zedexams.com</a>
            or WhatsApp
            <a href="https://wa.me/260977740465" style="color:#C5613F;font-weight:700;">+260 977 740 465</a>.
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
