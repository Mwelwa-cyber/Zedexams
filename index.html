<!DOCTYPE html>
<html lang="en-ZM">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <!--
      Brand-level defaults. This file is the SPA fallback shell for every route
      and the homepage card source (prerender skips "/" on purpose), and no-JS
      social scrapers (WhatsApp/Facebook/LinkedIn) read these static tags. Keep
      the copy brand-level, not route-specific — per-route titles/descriptions
      come from <SeoHelmet> at runtime and from the prerendered route HTML.
    -->
    <title>ZedExams — Zambian CBC Exam Prep, Quizzes &amp; AI Study Help</title>
    <meta name="description" content="Daily exams, quizzes, lessons, games and AI study help for Zambian CBC learners (Grade 4–7), plus printable lesson-planning tools for teachers." />
    <meta name="author" content="ZedExams" />
    <!--
      No static canonical link element here, on purpose.

      This file is the single shell for every SPA route, so a hardcoded
      canonical declares "https://zedexams.com/" on /pricing, /papers,
      /blog/*, etc. Googlebot reads raw HTML on its first crawl pass
      (before it renders JS), so every page told Google it was a duplicate
      of the homepage — which kept everything but / out of the index and
      surfaced as "Alternate page with proper canonical tag" in Search
      Console. react-helmet-async also *adds* its own canonical at runtime,
      so the static tag produced two conflicting canonicals after hydration.

      Per-route canonicals are set by <SeoHelmet path="..."> instead
      (src/components/seo/SeoHelmet.jsx). Routes without SeoHelmet
      self-canonicalise to the fetched URL, which is correct. Do not
      re-add a static canonical without per-route prerendering. -->

    <!-- Viewport + theme -->
    <!--
      color-scheme:light opts the site OUT of the browser's auto-dark behaviour.
      Without this, form controls (<select>, date pickers, scrollbars, the pre-
      React paint, etc.) pick up the OS dark-mode palette and clash with the
      in-app ThemeProvider — the page reads as "a bit too dark" on dark-mode
      browsers. Users who want a dark palette can still pick Midnight from the
      theme switcher; OS preference just stops forcing it.
    -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0F1B2D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZedExams" />
    <meta name="application-name" content="ZedExams" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/zedexams-logo.png?v=5" />
    <link rel="apple-touch-icon" href="/zedexams-logo.png?v=5" />

    <!-- PWA manifest — makes the site installable as a home-screen app on
         Android. No service worker yet, so it doesn't work offline; that
         lands separately as part of the full PWA work (audit A1). -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->

    <meta property="og:image:width" content="1431" />

    <!-- Structured data — helps Google show rich results for queries
         like "Zambian CBC exam prep" or "Grade 7 ECZ revision". The
         richer the EducationalOrganization profile, the more likely
         brand queries get the knowledge-panel treatment with the
         logo, contact, and audience pulled in. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "ZedExams",
      "alternateName": "ZedExams.com",
      "url": "https://zedexams.com/",
      "logo": "https://zedexams.com/zedexams-logo.png?v=5",
      "description": "Zambian CBC exam prep — daily exams, quizzes, lessons, games and AI study help for Grade 4–7 learners, plus printable lesson tools for Zambian teachers.",
      "areaServed": { "@type": "Country", "name": "Zambia" },
      "inLanguage": "en-ZM",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "ZM"
      },
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "telephone": "+260977740465",
          "email": "support@zedexams.com",
          "availableLanguage": ["en"],
          "areaServed": "ZM"
        }
      ],
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student",
        "audienceType": "Zambian CBC learners (Grade 4–7) and teachers"
      },
      "sameAs": []
    }
    </script>

    <!--
      Fonts — single CSS request, trimmed weights, display=swap so text paints
      immediately in a fallback face and swaps when the webfont arrives.

      Loaded NON-render-blocking: the Google Fonts stylesheet was the top
      render-blocking request in PageSpeed (≈310ms added to FCP/LCP). The
      media="print" + onload swap trick fetches it at a low priority without
      blocking first paint, then promotes it to all media once it loads. The
      <noscript> copy keeps the fonts for the (rare) no-JS path. Because every
      face uses display=swap, deferring the CSS never hides text — the fallback
      shows instantly and the webfont swaps in with no layout shift.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!--
      Warm up the Firebase connections opened during auth so TLS isn't in the
      critical path. examsprepzambia.firebaseapp.com hosts the auth-helper
      iframe (auth/iframe.js) that loads on every page — PageSpeed flagged it
      as the largest LCP-blocking origin (≈310ms), so it's preconnected here.
      identitytoolkit.googleapis.com is only hit once a user actually signs in
      (PageSpeed marked its preconnect "unused" on the landing page), so it's
      downgraded to dns-prefetch to keep us within the ~4-preconnect budget
      without hurting sign-in latency.
    -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://examsprepzambia.firebaseapp.com" crossorigin />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebaseinstallations.googleapis.com" />

    <!--
      Analytics (inactive by default).
      When ready to track launch traffic, uncomment ONE of these blocks:

      Option A — Plausible (recommended, privacy-friendly, cookie-less, $9/mo):
        <script defer data-domain="zedexams.com" src="https://plausible.io/js/script.js"></script>

      Option B — Google Analytics 4 (free, cookie-based):
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-XXXXXXXXXX');
        </script>
    -->
  </head>
  <body>
    <script>
      // Pre-paint theme guard. CSS :root defaults to the Sky palette, so
      // without this the body would flash blue before React mounts and
      // applies the saved/brand-default theme. Mirror ThemeContext: use
      // the saved choice, else the 'oatmeal' brand default.
      (function () {
        try {
          var legacy = { light: 'sky', warm: 'oatmeal', dark: 'midnight' };
          var ids = ['sky', 'lavender', 'midnight', 'oatmeal', 'solar', 'vivid'];
          var saved = localStorage.getItem('examprep:theme');
          saved = legacy[saved] || saved;
          document.body.classList.add(
            'theme-' + (ids.indexOf(saved) !== -1 ? saved : 'oatmeal')
          );
        } catch (e) {
          document.body.classList.add('theme-oatmeal');
        }
      })();
    </script>
    <div id="root"></div>
    <!--
      Boot watchdog (white-screen guard).

      If anything throws while the app is *starting up* — before React's
      <ErrorBoundary> has mounted — the user is left staring at a blank
      #root with no message and no way out. Real-world causes:
        • a Firebase config value missing/invalid in the deploy, which makes
          getAuth() throw synchronously at module load (src/firebase/config.js);
        • a stale service-worker serving a cached index.html that points at
          hashed chunks a newer deploy has already removed (ChunkLoadError);
        • any other module-eval throw on the critical path.
      None of these are catchable by the React ErrorBoundary, so without this
      net they render as a permanent white screen.

      This inline, dependency-free script watches #root. If the app hasn't
      painted shortly after a boot error (or after a hard timeout on a silent
      hang), it replaces the blank page with a recoverable message. The
      "Clear cache & reload" button unregisters service workers and clears
      Cache Storage, which is the actual cure for the stale-SW case. The app
      sets window.__ZED_APP_MOUNTED__ once it renders (src/main.jsx), so a
      successful boot — even a slow one on a poor connection — never trips it.
    -->
    <script>
      (function () {
        var HARD_TIMEOUT = 12000; // silent-hang backstop (slow ZM mobile networks)
        var ERROR_GRACE = 2000;   // wait after a boot error in case React still recovers
        var shown = false;
        function appMounted() {
          var root = document.getElementById('root');
          return !!(window.__ZED_APP_MOUNTED__ || (root && root.childElementCount > 0));
        }
        window.zedClearCacheReload = function () {
          var done = function () { location.reload(); };
          try {
            var jobs = [];
            if ('serviceWorker' in navigator) {
              jobs.push(
                navigator.serviceWorker.getRegistrations()
                  .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
                  .catch(function () {})
              );
            }
            if (window.caches && caches.keys) {
              jobs.push(
                caches.keys()
                  .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
                  .catch(function () {})
              );
            }
            Promise.all(jobs).then(done, done);
          } catch (e) { done(); }
        };
        function showFallback() {
          if (shown || appMounted()) return;
          shown = true;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:#FDF6EC;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1A1F2E;text-align:center;">' +
              '<div style="max-width:480px;">' +
                '<h1 style="font-size:1.5rem;font-weight:800;margin:0 0 0.5rem;">We could not finish loading ZedExams</h1>' +
                '<p style="margin:0 0 1.25rem;line-height:1.5;color:#4B6280;">This is usually a temporary loading or cached-version problem. Reloading the page fixes it most of the time.</p>' +
                '<div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.25rem;">' +
                  '<button type="button" onclick="location.reload()" style="cursor:pointer;border:0;border-radius:0.625rem;padding:0.7rem 1.25rem;font-weight:700;font-size:0.95rem;color:#fff;background:#EA580C;">Reload</button>' +
                  '<button type="button" onclick="window.zedClearCacheReload()" style="cursor:pointer;border:1px solid #CBD5E1;border-radius:0.625rem;padding:0.7rem 1.25rem;font-weight:700;font-size:0.95rem;color:#1A1F2E;background:#fff;">Clear cache &amp; reload</button>' +
                '</div>' +
                '<p style="margin:0;font-size:0.875rem;color:#4B6280;">Still stuck? Email <a href="mailto:support@zedexams.com" style="color:#EA580C;font-weight:700;">support@zedexams.com</a> or WhatsApp <a href="https://wa.me/260977740465" style="color:#EA580C;font-weight:700;">+260 977 740 465</a>.</p>' +
              '</div>' +
            '</div>';
        }
        function onBootError() {
          if (appMounted()) return;
          setTimeout(function () { if (!appMounted()) showFallback(); }, ERROR_GRACE);
        }
        // Capture-phase catches failed <script>/<link> loads (e.g. a stale-SW
        // ChunkLoadError) as well as thrown errors. The appMounted() recheck
        // after the grace window means a benign resource 404 that fires while
        // the app is still painting never shows the fallback.
        window.addEventListener('error', onBootError, true);
        window.addEventListener('unhandledrejection', onBootError);
        window.addEventListener('load', function () {
          setTimeout(function () { if (!appMounted()) showFallback(); }, HARD_TIMEOUT);
        });
      })();
    </script>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:#FDF6EC;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1A1F2E;text-align:center;">
        <div style="max-width:480px;">
          <h1 style="font-size:1.5rem;font-weight:800;margin:0 0 0.5rem;">ZedExams needs JavaScript</h1>
          <p style="margin:0 0 1rem;line-height:1.5;color:#4B6280;">
            ZedExams is an interactive learning app — quizzes, lessons, and games all run in your browser, so JavaScript is required. Please enable JavaScript and reload the page.
          </p>
          <p style="margin:0;font-size:0.875rem;color:#4B6280;">
            Need help? Email
            <a href="mailto:support@zedexams.com" style="color:#EA580C;font-weight:700;">support@zedexams.com</a>
            or WhatsApp
            <a href="https://wa.me/260977740465" style="color:#EA580C;font-weight:700;">+260 977 740 465</a>.
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
