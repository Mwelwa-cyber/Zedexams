<!DOCTYPE html>
<html lang="en-ZM">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <!--
      Brand-level defaults. This file is the SPA fallback shell for every route
      and the homepage card source (prerender skips "/" on purpose), and no-JS
      social scrapers (WhatsApp/Facebook/LinkedIn) read these static tags. Keep
      the copy brand-level, not route-specific — per-route titles/descriptions
      come from <SeoHelmet> at runtime and from the prerendered route HTML.
    -->
    <title>ZedExams — Zambian CBC Exam Prep, Quizzes &amp; AI Study Help</title>
    <meta name="description" content="Daily exams, quizzes, lessons, games and AI study help for Zambian CBC learners (Grade 4–7), plus printable lesson-planning tools for teachers." />
    <meta name="author" content="ZedExams" />
    <!--
      No static canonical link element here, on purpose.

      This file is the single shell for every SPA route, so a hardcoded
      canonical declares "https://zedexams.com/" on /pricing, /papers,
      /blog/*, etc. Googlebot reads raw HTML on its first crawl pass
      (before it renders JS), so every page told Google it was a duplicate
      of the homepage — which kept everything but / out of the index and
      surfaced as "Alternate page with proper canonical tag" in Search
      Console. react-helmet-async also *adds* its own canonical at runtime,
      so the static tag produced two conflicting canonicals after hydration.

      Per-route canonicals are set by <SeoHelmet path="..."> instead
      (src/components/seo/SeoHelmet.jsx). Routes without SeoHelmet
      self-canonicalise to the fetched URL, which is correct. Do not
      re-add a static canonical without per-route prerendering. -->

    <!-- Viewport + theme -->
    <!--
      "light dark" tells the browser both schemes are supported, so the
      pre-CSS paint and native form controls can match the OS on a dark-mode
      device instead of flashing white first. Which scheme actually applies
      to CONTENT is still decided by the app's own theme classes: boot.js
      seeds the saved theme (or, with nothing saved, the OS preference) on
      <body>/<html> before first paint, and index.css scopes `color-scheme`
      per theme (html.dark, html[data-theme='night'], .studio-theme, the
      light-pinned editor canvases). A hard-coded `light` here fought the
      Midnight/Night themes' native widgets.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0F1B2D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZedExams" />
    <meta name="application-name" content="ZedExams" />

    <link rel="apple-touch-icon" href="/zedexams-logo.png?v=5" />

    <link rel="manifest" href="/manifest.webmanifest" />

         like "Zambian CBC exam prep" or "Grade 7 ECZ revision". The
         richer the EducationalOrganization profile, the more likely
         brand queries get the knowledge-panel treatment with the
         logo, contact, and audience pulled in. -->
    <script type="application/ld+json">
    {

      "@type": "EducationalOrganization",

      "areaServed": { "@type": "Country", "name": "Zambia" },

      "address": {
        "@type": "PostalAddress",
        "addressCountry": "ZM"
      },
      "contactPoint": [
        {
          "@type": "ContactPoint",

    <!--
      Fonts — single CSS request, trimmed weights, display=swap so text paints
      immediately in a fallback face and swaps when the webfont arrives.

      Loaded NON-render-blocking: the Google Fonts stylesheet was the top
      render-blocking request in PageSpeed (≈310ms added to FCP/LCP). Serving it
      as media="print" fetches it at a low priority without blocking first
      paint; /public/boot.js then promotes #zed-fonts to media="all" once it
      loads (an addEventListener('load') swap — this used to be an inline
      onload="this.media='all'" attribute, moved out so the CSP script-src can
      drop 'unsafe-inline'). The <noscript> copy keeps the fonts for the (rare)
      no-JS path. Because every face uses display=swap, deferring the CSS never
      hides text — the fallback shows instantly and the webfont swaps in with no
      layout shift.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      id="zed-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      media="print"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!--
      Warm up the Firebase connections opened during auth so TLS isn't in the
      critical path. examsprepzambia.firebaseapp.com hosts the auth-helper
      iframe (auth/iframe.js) that loads on every page — PageSpeed flagged it
      as the largest LCP-blocking origin (≈310ms), so it's preconnected here.
      identitytoolkit.googleapis.com is only hit once a user actually signs in
      (PageSpeed marked its preconnect "unused" on the landing page), so it's
      downgraded to dns-prefetch to keep us within the ~4-preconnect budget
      without hurting sign-in latency.
    -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://examsprepzambia.firebaseapp.com" crossorigin />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebaseinstallations.googleapis.com" />

    <!--
      Boot scripts (theme guard + font promotion + white-screen watchdog) live
      in /public/boot.js rather than inline so the CSP can drop 'unsafe-inline'
      from script-src. Preloaded here so it downloads during head parse and the
      render-blocking <script src="/boot.js"> at the top of <body> resolves
      near-instantly — the boot skeleton still paints fast.
    -->
    <link rel="preload" href="/boot.js" as="script" />

    <!-- Android in-app splash controller (see the header comment in
         /public/zx-splash.js). Preloaded for the same reason as boot.js: the
         render-blocking <script src="/zx-splash.js"> just before #root then
         resolves near-instantly, so the website's boot-skeleton paint isn't
         delayed and the native WebView shows the splash in its first frame. -->
    <link rel="preload" href="/zx-splash.js" as="script" />

    <!--
      Analytics (inactive by default).
      When ready to track launch traffic, uncomment ONE of these blocks:

      Option A — Plausible (recommended, privacy-friendly, cookie-less, $9/mo):
        <script defer data-domain="zedexams.com" src="https://plausible.io/js/script.js"></script>

      Option B — Google Analytics 4 (free, cookie-based):
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-XXXXXXXXXX');
        </script>
    -->
  </head>
  <body>
    <!--
      Boot scripts — theme guard (pre-paint, avoids a palette flash), Google
      Fonts promotion, and the white-screen watchdog. Externalised to
      /public/boot.js so the CSP script-src can stay free of 'unsafe-inline';
      preloaded in <head> so this render-blocking fetch resolves near-instantly.
      Runs first so its error listeners are registered before the app boots.
    -->
    <script src="/boot.js"></script>
    <!-- ═══════════ ZedExams Android splash — START ═══════════
      Animated brand splash shown ONLY inside the Android app shell (Capacitor
      WebView; TWA signals also honoured). On the website /zx-splash.js removes
      this node and its <style> before first paint. Markup + style are inline so
      the splash renders instantly and offline with no external requests; the
      controller script is external because the CSP has no 'unsafe-inline' in
      script-src. All selectors are zx-prefixed and scoped so Tailwind/app CSS
      can't collide; the splash sits above every app layer (boot skeleton,
      FullScreenLoader, PageLoader) at the max z-index.
      Guarded by test:android-splash. -->
    <style id="zx-splash-style">
      #zx-splash {
        /* Max int32: the splash must beat EVERY app layer. It shipped at 9999,
           which tied FullScreenLoader (fixed, z-index 9999, later in the DOM →
           painted on top) and sat under PageLoader (10000) — on a real device
           the cream "Welcome back…" loader covered the splash mid-boot and the
           splash re-emerged after auth resolved. Nothing in src/ may stack
           above this (guarded by test:android-splash). */
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        overflow: hidden;
        background: radial-gradient(120vmax 120vmax at 50% 42%, #0d1f3e 0%, #081226 55%);
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      }
      #zx-splash[hidden] { display: none; }
      #zx-splash * { margin: 0; padding: 0; box-sizing: border-box; }

      .zx-glow {
        position: absolute; left: 50%; top: 42%;
        width: 72vmin; height: 72vmin;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle,
          rgba(59,130,246,0.22) 0%, rgba(59,130,246,0.08) 40%, transparent 70%);
        opacity: 0;
        animation: zxGlowIn 1.1s ease-out 0.05s forwards,
                   zxGlowBreathe 4s ease-in-out 1.2s infinite;
      }
      @keyframes zxGlowIn { to { opacity: 1; } }
      @keyframes zxGlowBreathe {
        0%,100% { transform: translate(-50%,-50%) scale(1); }
        50%     { transform: translate(-50%,-50%) scale(1.07); }
      }

      .zx-speck {
        position: absolute; border-radius: 50%; opacity: 0;
        animation: zxSpeckDrift var(--dur) linear var(--delay) infinite;
      }
      @keyframes zxSpeckDrift {
        0%   { opacity: 0; transform: translateY(12vh) scale(0.8); }
        12%  { opacity: var(--peak); }
        80%  { opacity: var(--peak); }
        100% { opacity: 0; transform: translateY(-14vh) scale(1.1); }
      }

      .zx-mark { position: relative; width: min(46vmin, 230px); height: min(46vmin, 230px); }
      .zx-mark svg { width: 100%; height: 100%; overflow: visible; }
      .zx-mark-inner { animation: zxMarkFloat 4.5s ease-in-out 2.6s infinite; }
      @keyframes zxMarkFloat {
        0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); }
      }

      /* Figure (swoosh + gown + arm) — revealed by a sweeping arc mask
         that travels around the circle and "forms" the graduate */
      .zx-figure { filter: drop-shadow(0 0 10px rgba(59,130,246,0.40)); }
      .zx-sweep {
        fill: none; stroke: #fff; stroke-width: 72;
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: zxDrawArc 0.95s cubic-bezier(0.60, 0, 0.30, 1) 0.20s forwards;
      }
      @keyframes zxDrawArc { to { stroke-dashoffset: 0; } }

      .zx-head {
        transform-box: fill-box; transform-origin: center; transform: scale(0);
        animation: zxHeadPop 0.45s cubic-bezier(0.34, 1.56, 0.55, 1) 1.00s forwards;
      }
      @keyframes zxHeadPop { to { transform: scale(1); } }

      .zx-zed {
        transform-box: fill-box; transform-origin: center; transform: scale(0);
        animation: zxZPop 0.55s cubic-bezier(0.34, 1.56, 0.55, 1) 0.75s forwards;
      }
      @keyframes zxZPop {
        0%   { transform: scale(0) rotate(-14deg); }
        100% { transform: scale(1) rotate(0deg); }
      }
      .zx-zed path { fill: url(#zxZGrad); }
      .zx-zed .zx-z-shadow { fill: rgba(0,0,0,0.35); filter: blur(3px); }

      .zx-cap {
        transform-box: fill-box; transform-origin: center; opacity: 0;
        animation: zxCapDrop 0.55s cubic-bezier(0.22, 1.2, 0.36, 1) 1.15s forwards;
      }
      @keyframes zxCapDrop {
        0%   { opacity: 0; transform: translateY(-30px) rotate(9deg); }
        60%  { opacity: 1; transform: translateY(4px) rotate(-3deg); }
        100% { opacity: 1; transform: translateY(0) rotate(0deg); }
      }
      .zx-tassel {
        transform-origin: 138px 42px;
        animation: zxTasselSwing 1.6s ease-in-out 1.7s 2;
      }
      @keyframes zxTasselSwing {
        0%,100% { transform: rotate(0deg); }
        30%     { transform: rotate(-13deg); }
        65%     { transform: rotate(7deg); }
      }

      .zx-wordmark {
        margin-top: 4.2vmin; display: flex;
        font-size: clamp(34px, 9vmin, 52px);
        font-weight: 800; letter-spacing: 0.5px; line-height: 1;
      }
      .zx-wordmark span {
        display: inline-block; opacity: 0; transform: translateY(0.55em);
        animation: zxLetterRise 0.5s cubic-bezier(0.22, 1.1, 0.36, 1) forwards;
      }
      .zx-lt-zed { color: #eef4ff; }
      .zx-lt-ex {
        background: linear-gradient(160deg, #fdba74, #f97316);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      @keyframes zxLetterRise { to { opacity: 1; transform: translateY(0); } }

      .zx-tagline {
        margin-top: 2vmin; color: rgba(238,244,255,0.62);
        font-size: clamp(13px, 3.4vmin, 16px);
        letter-spacing: 3.5px; text-transform: uppercase; font-weight: 500;
        opacity: 0; animation: zxFadeUp 0.6s ease-out 1.95s forwards;
      }
      @keyframes zxFadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .zx-loader {
        position: absolute;
        bottom: max(7vh, calc(env(safe-area-inset-bottom, 0px) + 6vh));
        display: flex; gap: 10px;
        opacity: 0; animation: zxFadeUp 0.5s ease-out 2.15s forwards;
      }
      .zx-loader i {
        width: 9px; height: 9px; border-radius: 50%; background: #60a5fa;
        animation: zxDotPulse 1.2s ease-in-out calc(var(--i) * 0.18s) infinite;
      }
      .zx-loader i:nth-child(2) { background: #eef4ff; }
      .zx-loader i:nth-child(3) { background: #f97316; }
      @keyframes zxDotPulse {
        0%,100% { transform: scale(0.65); opacity: 0.45; }
        40%     { transform: scale(1.15); opacity: 1; }
      }

      #zx-splash.zx-exit {
        animation: zxSplashExit 0.55s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      @keyframes zxSplashExit {
        to { opacity: 0; transform: scale(1.06); visibility: hidden; }
      }

      @media (prefers-reduced-motion: reduce) {
        #zx-splash *, #zx-splash *::before, #zx-splash *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>

    <div id="zx-splash" hidden>
      <div class="zx-glow"></div>
      <div id="zx-specks"></div>

        <div class="zx-mark-inner">

            <!-- head (traced) -->

            <!-- Graduation cap, dropping onto the head -->

    <div id="root">
      <!--
        Inline boot skeleton — paints in the first frame with no JS/CSS bundle,
        so a cold mobile load shows the brand loader instantly instead of a
        blank screen for several seconds (real-user FCP p75 was ~4.5s on
        mobile). React's createRoot() clears #root when it mounts, so this is
        removed automatically; the boot watchdog's appMounted() ignores it so a
        genuine hang still surfaces the recovery UI.

        The animation is the brand ring loader (glow + two counter-rotating
        blue/orange arcs around the app-icon badge + indeterminate bar) and
        MUST stay markup/keyframes-identical to <FullScreenLoader /> so the
        skeleton → React hand-off is seamless — the ring keeps turning.
      -->
      <div id="zed-boot-skeleton" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;box-sizing:border-box;background:#FDF6EC;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
        <div class="zed-boot-loader" aria-hidden="true">
          <div class="zed-boot-glow"></div>
          <svg class="zed-boot-ring" viewBox="0 0 160 160" role="presentation">
            <circle class="zed-boot-track" cx="80" cy="80" r="72"></circle>
            <g class="zed-boot-arc zed-boot-arc--blue">
              <circle class="zed-boot-stroke zed-boot-stroke--blue" cx="80" cy="80" r="72"></circle>
              <circle class="zed-boot-dot--blue" cx="80" cy="8" r="6"></circle>
            </g>
            <g class="zed-boot-arc zed-boot-arc--orange">
              <circle class="zed-boot-stroke zed-boot-stroke--orange" cx="80" cy="80" r="72"></circle>
              <circle class="zed-boot-dot--orange" cx="80" cy="152" r="6"></circle>
            </g>
          </svg>
          <img class="zed-boot-badge" src="/zedexams-app-icon.jpg?v=1" alt="" width="64" height="64" draggable="false" />
        </div>
        <div style="font-size:1.6rem;font-weight:800;letter-spacing:-0.02em;color:#1A1F2E;">Zed<span style="color:#C5613F;">Exams</span></div>
        <div class="zed-boot-bar"><div class="zed-boot-bar-fill"></div></div>
        <style>
          .zed-boot-loader { position: relative; width: 140px; height: 140px; display: grid; place-items: center; }
          .zed-boot-glow { position: absolute; inset: -18%; border-radius: 50%; background: radial-gradient(circle, rgba(197, 97, 63, 0.22) 0%, rgba(197, 97, 63, 0) 68%); filter: blur(6px); animation: zed-boot-glow 3.2s ease-in-out infinite; }
          .zed-boot-ring { position: absolute; inset: 0; width: 100%; height: 100%; }
          .zed-boot-track { fill: none; stroke: #EBD9C2; stroke-width: 5; opacity: 0.5; }
          .zed-boot-arc { transform-origin: 50% 50%; animation: zed-boot-spin 1.6s linear infinite; }
          .zed-boot-arc--orange { animation-duration: 2.4s; animation-direction: reverse; }
          .zed-boot-stroke { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 135 320; }
          .zed-boot-stroke--blue { stroke: #2563EB; }
          .zed-boot-stroke--orange { stroke: #C5613F; }
          .zed-boot-dot--blue { fill: #2563EB; }
          .zed-boot-dot--orange { fill: #C5613F; }
          .zed-boot-badge { position: relative; z-index: 1; width: 64px; height: 64px; border-radius: 16px; object-fit: cover; box-shadow: 0 6px 16px rgba(26, 31, 46, 0.28); user-select: none; -webkit-user-drag: none; }
          .zed-boot-bar { position: relative; width: min(78vw, 320px); height: 4px; border-radius: 999px; background: #EBD9C2; overflow: hidden; }
          .zed-boot-bar-fill { position: absolute; top: 0; left: 0; height: 100%; width: 40%; border-radius: 999px; background: linear-gradient(90deg, #2563EB, #C5613F); animation: zed-boot-bar 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
          @media (max-width: 767px) { .zed-boot-loader { width: 112px; height: 112px; } }
          @keyframes zed-boot-spin { to { transform: rotate(360deg); } }
          @keyframes zed-boot-glow { 0%, 100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.04); } }
          @keyframes zed-boot-bar { 0% { left: -40%; width: 40%; } 50% { left: 25%; width: 55%; } 100% { left: 100%; width: 40%; } }
          @media (prefers-reduced-motion: reduce) {
            .zed-boot-arc, .zed-boot-glow { animation: none; }
            .zed-boot-bar-fill { animation: none; left: 0; width: 100%; opacity: 0.8; }
          }
        </style>
      </div>
